name: Deploy Pages

on:
  push:
    branches: ["main"]
    paths:
      - "curriculum/**"
      - "docs/**"
      - "case-studies/**"
      - "templates/**"
      - "manifests/**"
      - "*.md"
      - "scripts/generar_sitio.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; los pushes seguidos cancelan el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias del manual
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # El manual se compila primero porque el generador del sitio borra site/
      # completo y después copia los PDF desde output/ a site/downloads/.
      - name: Compilar el manual en PDF (integral y por parte)
        run: python scripts/generar_manual.py --partes

      - name: Generar el sitio HTML
        run: python scripts/generar_sitio.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Verificar que el manual llegó a las descargas
        run: |
          test -f site/downloads/modern-business-creation-program-manual-v$(cat VERSION).pdf
          test -f site/downloads/manual.pdf
          partes=$(find site/downloads/partes -name '*.pdf' | wc -l)
          echo "PDF por parte publicados: $partes"
          test "$partes" -eq 24

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

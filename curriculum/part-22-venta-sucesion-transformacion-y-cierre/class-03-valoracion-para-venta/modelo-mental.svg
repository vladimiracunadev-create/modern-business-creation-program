<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">De la utilidad contable al resultado normalizado</title><desc id="d">De la utilidad contable al resultado normalizado. Cada barra es un ajuste al resultado reportado. La última es la base sobre la que un comprador aplicará un múltiplo. Un buen normalizado es la mitad de una buena negociación.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">De la utilidad contable al resultado normalizado</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 297 · Venta, sucesión, transformación y cierre</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="117.0" y="159.4" width="96.0" height="190.6" rx="8" fill="#B9BCC2"/><text x="165.0" y="149.4" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="165.0" dy="0.0">40 M$</tspan></text><text x="165.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="165.0" dy="0.0">Resultado reportado</tspan></text><rect x="267.0" y="321.4" width="96.0" height="28.6" rx="8" fill="#B9BCC2"/><text x="315.0" y="311.4" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="315.0" dy="0.0">6 M$</tspan></text><text x="315.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="315.0" dy="0.0">Gastos personales</tspan><tspan x="315.0" dy="16.0">del dueño</tspan></text><rect x="417.0" y="330.9" width="96.0" height="19.1" rx="8" fill="#B9BCC2"/><text x="465.0" y="320.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="465.0" dy="0.0">-4 M$</tspan></text><text x="465.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="465.0" dy="0.0">Sueldo del dueño a</tspan><tspan x="465.0" dy="16.0">valor de mercado</tspan></text><rect x="567.0" y="149.9" width="96.0" height="200.1" rx="8" fill="#374151"/><text x="615.0" y="139.9" font-size="14" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="615.0" dy="0.0">42 M$</tspan></text><text x="615.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="615.0" dy="0.0">Resultado</tspan><tspan x="615.0" dy="16.0">normalizado</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">El comprador paga un múltiplo del resultado normalizado, no del contable.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Millones de pesos (ejemplo ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#E7E8EA" stroke="#B9BCC2"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">297</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Comprar la sociedad o comprar los bienes</title><desc id="d">Comprar la sociedad o comprar los bienes. Compara los dos platos. Lo que uno gana en simplicidad, el otro lo gana en control del riesgo. La mejor estructura es la que reparte el riesgo y el costo según lo que cada parte puede asumir.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Comprar la sociedad o comprar los bienes</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 300 · Venta, sucesión, transformación y cierre</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="96.0" width="316.0" height="214.0" rx="14" fill="#FEF3E2" stroke="#F59E0B" stroke-width="2"/><text x="60.0" y="134.0" font-size="16" text-anchor="start" fill="#B45309" font-weight="700"><tspan x="60.0" dy="0.0">Share deal: comprar la sociedad</tspan></text><circle cx="64" cy="164" r="3.4" fill="#F59E0B"/><text x="78.0" y="168.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="78.0" dy="0.0">El comprador recibe todo, incluido el</tspan><tspan x="78.0" dy="16.6">pasivo oculto</tspan></text><circle cx="64" cy="210" r="3.4" fill="#F59E0B"/><text x="78.0" y="214.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="78.0" dy="0.0">Los contratos y permisos continúan con</tspan><tspan x="78.0" dy="16.6">la empresa</tspan></text><circle cx="64" cy="256" r="3.4" fill="#F59E0B"/><text x="78.0" y="260.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="78.0" dy="0.0">El efecto tributario recae en quien</tspan><tspan x="78.0" dy="16.6">vende sus acciones</tspan></text><rect x="404.0" y="96.0" width="316.0" height="214.0" rx="14" fill="#E7E8EA" stroke="#374151" stroke-width="2"/><text x="424.0" y="134.0" font-size="16" text-anchor="start" fill="#374151" font-weight="700"><tspan x="424.0" dy="0.0">Asset deal: comprar bienes</tspan><tspan x="424.0" dy="20.5">determinados</tspan></text><circle cx="428" cy="164" r="3.4" fill="#374151"/><text x="442.0" y="168.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="442.0" dy="0.0">El comprador elige qué adquiere</tspan></text><circle cx="428" cy="192" r="3.4" fill="#374151"/><text x="442.0" y="196.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="442.0" dy="0.0">Requiere ceder contratos, permisos y</tspan><tspan x="442.0" dy="16.6">activos uno a uno</tspan></text><circle cx="428" cy="238" r="3.4" fill="#374151"/><text x="442.0" y="242.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="442.0" dy="0.0">En lo laboral puede haber continuidad de</tspan><tspan x="442.0" dy="16.6">obligaciones</tspan></text><circle cx="380" cy="203" r="22" fill="#1F2937"/><text x="380.0" y="208.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">vs</tspan></text><rect x="40.0" y="326.0" width="680.0" height="90.0" rx="12" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.6"/><text x="60.0" y="350.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="60.0" dy="0.0">Criterio de decisión</tspan></text><text x="60.0" y="376.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="60.0" dy="0.0">Elige la estructura con criterio tributario y de riesgo: cuánto pasivo oculto puede</tspan><tspan x="60.0" dy="19.2">asumir el comprador y qué costo de cesión acepta el vendedor.</tspan></text><circle cx="720" cy="40" r="14" fill="#E7E8EA" stroke="#B9BCC2"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">300</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">De las contraseñas por mensajería a un gestor de secretos</title><desc id="d">De las contraseñas por mensajería a un gestor de secretos. Cada peldaño reduce un riesgo concreto. Subir uno ya mejora la seguridad: no hace falta esperar a tener un sistema perfecto para dejar de compartir contraseñas por chat.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">De las contraseñas por mensajería a un gestor de secretos</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 203 · Tecnología, datos, IA y operación digital</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="159.5" height="120.0" rx="10" fill="#E7F1F0"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Credenciales por</tspan><tspan x="54.0" dy="17.9">mensajería</tspan></text><text x="54.0" y="374.0" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="54.0" dy="0.0">La puerta de entrada</tspan><tspan x="54.0" dy="15.4">más común</tspan></text><rect x="207.5" y="223.3" width="159.5" height="176.7" rx="10" fill="#BFDAD8"/><text x="221.5" y="251.3" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="221.5" dy="0.0">2</tspan></text><text x="221.5" y="275.3" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="221.5" dy="0.0">Gestor compartido</tspan></text><text x="221.5" y="299.3" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="221.5" dy="0.0">Un lugar único, pero</tspan><tspan x="221.5" dy="15.4">acceso grupal</tspan></text><rect x="375.0" y="166.7" width="159.5" height="233.3" rx="10" fill="#97C4C0"/><text x="389.0" y="194.7" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="389.0" dy="0.0">3</tspan></text><text x="389.0" y="218.7" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="389.0" dy="0.0">Acceso individual</tspan></text><text x="389.0" y="242.7" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="389.0" dy="0.0">Cada persona con su</tspan><tspan x="389.0" dy="15.4">identidad</tspan></text><rect x="542.5" y="110.0" width="159.5" height="290.0" rx="10" fill="#6FADA8"/><text x="556.5" y="138.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="556.5" dy="0.0">4</tspan></text><text x="556.5" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="556.5" dy="0.0">Rotación y</tspan><tspan x="556.5" dy="17.9">trazabilidad</tspan></text><text x="556.5" y="204.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="556.5" dy="0.0">Se renuevan y se sabe</tspan><tspan x="556.5" dy="15.4">quién accedió</tspan></text><line x1="48.0" y1="412.0" x2="720.0" y2="412.0" stroke="#0F766E" stroke-width="2.4" marker-end="url(#fl)"/><text x="716.0" y="430.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="716.0" dy="0.0">Más seguro, más fácil de revocar</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">203</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Dónde se va el gasto tecnológico</title><desc id="d">Dónde se va el gasto tecnológico. Cada barra es una parte del gasto. Solo la primera genera valor. Las demás son oportunidades de ahorro que aparecen al inventariar licencias, ambientes y suscripciones.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Dónde se va el gasto tecnológico</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 210 · Tecnología, datos, IA y operación digital</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="117.0" y="149.9" width="96.0" height="200.1" rx="8" fill="#ABCFCC"/><text x="165.0" y="139.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="165.0" dy="0.0">55 %</tspan></text><text x="165.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="165.0" dy="0.0">Licencias en uso</tspan></text><rect x="267.0" y="277.2" width="96.0" height="72.8" rx="8" fill="#0F766E"/><text x="315.0" y="267.2" font-size="14" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="315.0" dy="0.0">20 %</tspan></text><text x="315.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="315.0" dy="0.0">Licencias ociosas</tspan></text><rect x="417.0" y="295.4" width="96.0" height="54.6" rx="8" fill="#ABCFCC"/><text x="465.0" y="285.4" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="465.0" dy="0.0">15 %</tspan></text><text x="465.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="465.0" dy="0.0">Infraestructura sin</tspan><tspan x="465.0" dy="16.0">uso</tspan></text><rect x="567.0" y="313.6" width="96.0" height="36.4" rx="8" fill="#ABCFCC"/><text x="615.0" y="303.6" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="615.0" dy="0.0">10 %</tspan></text><text x="615.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="615.0" dy="0.0">Suscripciones</tspan><tspan x="615.0" dy="16.0">olvidadas</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">Una revisión trimestral de inventario y consumo suele recuperar una parte importante del gasto</tspan><tspan x="56.0" dy="16.0">improductivo.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Participación en el gasto tecnológico (ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">210</text></svg>

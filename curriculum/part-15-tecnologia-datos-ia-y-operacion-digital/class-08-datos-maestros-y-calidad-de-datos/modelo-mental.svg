<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuántos de tus registros de clientes son realmente buenos</title><desc id="d">Cuántos de tus registros de clientes son realmente buenos. Cada barra es el resultado de aplicar una regla de calidad. Lo que queda al final es lo que realmente se puede usar. Los duplicados suelen ser la mayor pérdida (datos ilustrativos).</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuántos de tus registros de clientes son realmente buenos</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 204 · Tecnología, datos, IA y operación digital</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="100.0" width="520.0" height="52.0" rx="8" fill="#C3DDDB"/><text x="300.0" y="131.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Registros de clientes</tspan></text><text x="596.0" y="131.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">1.200</tspan></text><rect x="69.8" y="160.0" width="460.5" height="52.0" rx="8" fill="#93C1BE"/><text x="300.0" y="191.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Válidos (formato correcto)</tspan></text><text x="596.0" y="186.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">1.000</tspan></text><text x="596.0" y="207.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 83 %</tspan></text><rect x="96.0" y="220.0" width="408.0" height="52.0" rx="8" fill="#63A6A1"/><text x="300.0" y="251.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Únicos (sin duplicados)</tspan></text><text x="596.0" y="246.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">820</tspan></text><text x="596.0" y="267.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 82 %</tspan></text><rect x="122.2" y="280.0" width="355.5" height="52.0" rx="8" fill="#338B84"/><text x="300.0" y="311.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">Completos y vigentes</tspan></text><text x="596.0" y="306.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">640</tspan></text><text x="596.0" y="327.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 78 %</tspan></text><rect x="30" y="216" width="720" height="60" rx="12" fill="none" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="6 4"/><text x="742.0" y="212.0" font-size="11" text-anchor="end" fill="#DC2626" font-weight="700"><tspan x="742.0" dy="0.0">cuello</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">204</text></svg>

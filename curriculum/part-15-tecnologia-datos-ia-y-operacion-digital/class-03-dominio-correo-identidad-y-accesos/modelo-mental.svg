<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El ciclo de vida de un acceso</title><desc id="d">El ciclo de vida de un acceso. El ciclo se repite con cada persona. Lo que no se revisa se acumula: accesos de quienes cambiaron de rol o se fueron, que siguen abiertos sin que nadie lo note.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El ciclo de vida de un acceso</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 199 · Tecnología, datos, IA y operación digital</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><circle cx="380" cy="252" r="128" fill="none" stroke="#ABCFCC" stroke-width="3" stroke-dasharray="3 7"/><path d="M380.0,124.0 Q485.7,151.7 556.5,212.4" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M556.5,212.4 Q546.2,289.2 489.1,355.6" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M489.1,355.6 Q380.0,379.6 270.9,355.6" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M270.9,355.6 Q213.8,289.2 203.5,212.4" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M203.5,212.4 Q274.3,151.7 380.0,124.0" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><rect x="312.8" y="98.0" width="134.4" height="52.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="380.0" y="120.2" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Alta con el</tspan><tspan x="380.0" dy="16.6">mínimo permiso</tspan></text><circle cx="314.8" cy="100.0" r="10" fill="#0F766E"/><text x="314.8" y="104.0" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">1</text><rect x="489.3" y="186.4" width="134.4" height="52.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="556.5" y="208.7" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="556.5" dy="0.0">Cambios cuando</tspan><tspan x="556.5" dy="16.6">cambia el rol</tspan></text><circle cx="491.31608942438044" cy="188.44582472000673" r="10" fill="#0F766E"/><text x="491.31608942438044" y="192.44582472000673" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">2</text><rect x="429.5" y="321.1" width="119.2" height="69.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="489.1" y="343.5" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="489.1" dy="0.0">Revisión</tspan><tspan x="489.1" dy="16.6">periódica de</tspan><tspan x="489.1" dy="16.6">accesos</tspan></text><circle cx="431.49294282548306" cy="323.0541752799933" r="10" fill="#0F766E"/><text x="431.49294282548306" y="327.0541752799933" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">3</text><rect x="192.3" y="329.6" width="157.2" height="52.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="270.9" y="351.8" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="270.9" dy="0.0">Baja el mismo día</tspan><tspan x="270.9" dy="16.6">de la salida</tspan></text><circle cx="194.30705717451704" cy="331.554175
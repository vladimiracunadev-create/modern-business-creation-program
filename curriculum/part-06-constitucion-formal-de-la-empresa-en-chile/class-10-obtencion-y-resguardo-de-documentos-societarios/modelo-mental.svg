<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Qué contiene la carpeta societaria</title><desc id="d">Qué contiene la carpeta societaria. Cada capa es un grupo de documentos. Al armar la carpeta, verifica que cada uno esté vigente, firmado y guardado en un lugar con respaldo y con acceso para quien corresponda.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2563EB"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Qué contiene la carpeta societaria</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 80 · Constitución formal de la empresa en Chile</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="140.0" y="100.0" width="300.0" height="52.0" rx="10" fill="#D8E3FB"/><text x="290.0" y="131.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">Estatuto y certificado actualizado</tspan></text><text x="560.0" y="123.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">La base legal de la</tspan><tspan x="560.0" dy="16.0">sociedad</tspan></text><line x1="446.0" y1="126.0" x2="552.0" y2="126.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="115.0" y="158.0" width="350.0" height="52.0" rx="10" fill="#B6CBF8"/><text x="290.0" y="189.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">Certificados de vigencia y poderes</tspan></text><text x="560.0" y="181.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Quién representa y hasta</tspan><tspan x="560.0" dy="16.0">dónde</tspan></text><line x1="471.0" y1="184.0" x2="552.0" y2="184.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="90.0" y="216.0" width="400.0" height="52.0" rx="10" fill="#94B3F5"/><text x="290.0" y="247.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">RUT, inicio de actividades y domicilios</tspan></text><text x="560.0" y="239.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Identidad tributaria y</tspan><tspan x="560.0" dy="16.0">acreditaciones</tspan></text><line x1="496.0" y1="242.0" x2="552.0" y2="242.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="65.0" y="274.0" width="450.0" height="52.0" rx="10" fill="#729AF2"/><text x="290.0" y="305.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="290.0" dy="0.0">Libros y actas</tspan></text><text x="560.0" y="297.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Decisiones societarias al</tspan><tspan x="560.0" dy="16.0">día</tspan></text><line x1="521.0" y1="300.0" x2="552.0" y2="300.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="40.0" y="332.0" width="500.0" height="52.0" rx="10" fill="#5182EF"/><text x="290.0" y="363.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="290.0" dy="0.0">Carpeta tributaria</tspan></text><text x="560.0" y="355.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Lo que el SII sabe de la</tspan><tspan x="560.0" dy="16.0">empresa</tspan></text><line x1="546.0" y1="358.0" x2="552.0" y2="358.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="720" cy="40" r="14" fill="#E5ECFD" stroke="#B3C8F8"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">80</text></svg>

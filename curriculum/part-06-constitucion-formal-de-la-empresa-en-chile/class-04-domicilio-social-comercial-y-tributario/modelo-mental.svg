<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Tres domicilios, tres efectos distintos</title><desc id="d">Tres domicilios, tres efectos distintos. Cada satélite es un domicilio con su efecto. Si no coinciden, cada uno debe estar respaldado por un documento propio; si coinciden, basta uno, pero debe ser vigente.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2563EB"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Tres domicilios, tres efectos distintos</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 74 · Constitución formal de la empresa en Chile</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="380.0" y1="262.0" x2="380.0" y2="130.0" stroke="#9DB9F6" stroke-width="2"/><line x1="380.0" y1="262.0" x2="635.0" y2="262.0" stroke="#9DB9F6" stroke-width="2"/><line x1="380.0" y1="262.0" x2="380.0" y2="394.0" stroke="#9DB9F6" stroke-width="2"/><line x1="380.0" y1="262.0" x2="125.0" y2="262.0" stroke="#9DB9F6" stroke-width="2"/><ellipse cx="380" cy="262" rx="78" ry="46" fill="#2563EB"/><text x="380.0" y="266.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">Tu sociedad</tspan></text><rect x="292.0" y="103.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/><text x="380.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#2563EB" font-weight="800"><tspan x="380.0" dy="0.0">Domicilio social</tspan></text><text x="380.0" y="138.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Fija el tribunal</tspan><tspan x="380.0" dy="14.7">competente</tspan></text><rect x="547.0" y="235.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/><text x="635.0" y="254.0" font-size="13.5" text-anchor="middle" fill="#2563EB" font-weight="800"><tspan x="635.0" dy="0.0">Domicilio comercial</tspan></text><text x="635.0" y="270.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="635.0" dy="0.0">Determina el municipio</tspan><tspan x="635.0" dy="14.7">de la patente</tspan></text><rect x="292.0" y="374.0" width="176.0" height="40.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/><text x="380.0" y="393.0" font-size="13.5" text-anchor="middle" fill="#2563EB" font-weight="800"><tspan x="380.0" dy="0.0">Domicilio tributario</tspan></text><text x="380.0" y="409.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Se acredita ante el SII</tspan></text><rect x="37.0" y="235.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/><text x="125.0" y="254.0" font-size="13.5" text-anchor="middle" fill="#2563EB" font-weight="800"><tspan x="125.0" dy="0.0">Documento que acredita</tspan></text><text x="125.0" y="270.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="125.0" dy="0.0">Contrato, título o</tspan><tspan x="125.0" dy="14.7">certificado vigente</tspan></text><circle cx="720" cy="40" r="14" fill="#E5ECFD" stroke="#B3C8F8"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">74</text></svg>

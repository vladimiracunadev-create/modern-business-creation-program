<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Nombre legal, nombre comercial y objeto: tres cosas distintas</title><desc id="d">Nombre legal, nombre comercial y objeto: tres cosas distintas. Cada capa cumple un papel distinto. La razón social identifica ante la ley, el nombre de fantasía te presenta al cliente y el objeto fija lo que puedes hacer. Confundirlas genera problemas distintos.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2563EB"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Nombre legal, nombre comercial y objeto: tres cosas distintas</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 73 · Constitución formal de la empresa en Chile</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="140.0" y="100.0" width="300.0" height="64.0" rx="10" fill="#D8E3FB"/><text x="290.0" y="137.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">Razón social</tspan></text><text x="560.0" y="122.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">El nombre legal que figura</tspan><tspan x="560.0" dy="16.0">en la escritura y en el</tspan><tspan x="560.0" dy="16.0">RUT</tspan></text><line x1="446.0" y1="132.0" x2="552.0" y2="132.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="90.0" y="170.0" width="400.0" height="64.0" rx="10" fill="#94B3F5"/><text x="290.0" y="207.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">Nombre de fantasía</tspan></text><text x="560.0" y="199.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">El nombre comercial;</tspan><tspan x="560.0" dy="16.0">verifícalo en INAPI</tspan></text><line x1="496.0" y1="202.0" x2="552.0" y2="202.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="40.0" y="240.0" width="500.0" height="64.0" rx="10" fill="#5182EF"/><text x="290.0" y="277.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="290.0" dy="0.0">Objeto social</tspan></text><text x="560.0" y="269.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Lo que la sociedad puede</tspan><tspan x="560.0" dy="16.0">hacer: amplio, pero claro</tspan></text><line x1="546.0" y1="272.0" x2="552.0" y2="272.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="720" cy="40" r="14" fill="#E5ECFD" stroke="#B3C8F8"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">73</text></svg>

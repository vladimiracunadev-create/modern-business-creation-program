<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Los peldaños para abrir una cuenta empresarial</title><desc id="d">Los peldaños para abrir una cuenta empresarial. Cada peldaño es una exigencia del banco. Si te falta uno, el trámite se detiene o la cuenta se rechaza; completa todos antes de acudir.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2563EB"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Los peldaños para abrir una cuenta empresarial</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 83 · Constitución formal de la empresa en Chile</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="126.0" height="120.0" rx="10" fill="#E9EFFD"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#2563EB" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Carpeta</tspan><tspan x="54.0" dy="17.9">societaria</tspan></text><text x="54.0" y="374.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="54.0" dy="0.0">Estatuto, vigencia</tspan><tspan x="54.0" dy="15.4">y poderes</tspan></text><rect x="174.0" y="237.5" width="126.0" height="162.5" rx="10" fill="#CEDCFA"/><text x="188.0" y="265.5" font-size="22" text-anchor="start" fill="#2563EB" font-weight="800"><tspan x="188.0" dy="0.0">2</tspan></text><text x="188.0" y="289.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="188.0" dy="0.0">Acreditación</tspan><tspan x="188.0" dy="17.9">del domicilio</tspan></text><text x="188.0" y="331.5" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="188.0" dy="0.0">Documento vigente</tspan></text><rect x="308.0" y="195.0" width="126.0" height="205.0" rx="10" fill="#B3C8F8"/><text x="322.0" y="223.0" font-size="22" text-anchor="start" fill="#2563EB" font-weight="800"><tspan x="322.0" dy="0.0">3</tspan></text><text x="322.0" y="247.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="322.0" dy="0.0">Beneficiario</tspan><tspan x="322.0" dy="17.9">final</tspan></text><text x="322.0" y="289.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="322.0" dy="0.0">Quiénes controlan</tspan><tspan x="322.0" dy="15.4">realmente la</tspan><tspan x="322.0" dy="15.4">sociedad</tspan></text><rect x="442.0" y="152.5" width="126.0" height="247.5" rx="10" fill="#97B5F6"/><text x="456.0" y="180.5" font-size="22" text-anchor="start" fill="#2563EB" font-weight="800"><tspan x="456.0" dy="0.0">4</tspan></text><text x="456.0" y="204.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="456.0" dy="0.0">Perfil</tspan><tspan x="456.0" dy="17.9">transaccional</tspan></text><text x="456.0" y="246.5" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="456.0" dy="0.0">Qué movimientos</tspan><tspan x="456.0" dy="15.4">esperas y de dónde</tspan><tspan x="456.0" dy="15.4">viene el dinero</tspan></text><rect x="576.0" y="110.0" width="126.0" height="290.0" rx="10" fill="#7CA1F3"/><text x="590.0" y="138.0" font-size="22" text-anchor="start" fill="#2563EB" font-weight="800
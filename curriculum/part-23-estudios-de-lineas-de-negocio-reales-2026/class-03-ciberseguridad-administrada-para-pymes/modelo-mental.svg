<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Quiénes intervienen en un servicio de ciberseguridad administrada</title><desc id="d">Quiénes intervienen en un servicio de ciberseguridad administrada. El centro es el servicio y los satélites son quienes lo condicionan. El acceso privilegiado es a la vez el motor y el mayor riesgo: quien administra la seguridad de otros se vuelve un objetivo.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Quiénes intervienen en un servicio de ciberseguridad administrada</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 311 · Estudios de líneas de negocio reales 2026</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="380.0" y1="262.0" x2="380.0" y2="130.0" stroke="#A5AAB1" stroke-width="2"/><line x1="380.0" y1="262.0" x2="622.5" y2="221.2" stroke="#A5AAB1" stroke-width="2"/><line x1="380.0" y1="262.0" x2="529.9" y2="368.8" stroke="#A5AAB1" stroke-width="2"/><line x1="380.0" y1="262.0" x2="230.1" y2="368.8" stroke="#A5AAB1" stroke-width="2"/><line x1="380.0" y1="262.0" x2="137.5" y2="221.2" stroke="#A5AAB1" stroke-width="2"/><ellipse cx="380" cy="262" rx="78" ry="46" fill="#374151"/><text x="380.0" y="249.0" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">Servicio de</tspan><tspan x="380.0" dy="17.9">ciberseguridad</tspan><tspan x="380.0" dy="17.9">administrada</tspan></text><rect x="292.0" y="103.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/><text x="380.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="380.0" dy="0.0">Cliente pyme</tspan></text><text x="380.0" y="138.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Contrata y es</tspan><tspan x="380.0" dy="14.7">responsable de sus datos</tspan></text><rect x="534.5" y="194.2" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/><text x="622.5" y="213.2" font-size="13.5" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="622.5" dy="0.0">Cliente regulado</tspan></text><text x="622.5" y="229.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="622.5" dy="0.0">Traslada exigencias por</tspan><tspan x="622.5" dy="14.7">contrato</tspan></text><rect x="441.9" y="341.8" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/><text x="529.9" y="360.8" font-size="13.5" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="529.9" dy="0.0">Acceso privilegiado</tspan></text><text x="529.9" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="529.9" dy="0.0">El mayor riesgo del</tspan><tspan x="529.9" dy="14.7">proveedor</tspan></text><rect x="142.1" y="341.8" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/><text x="230.1" y="360.8" font-size="13.5" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="230.1" dy="0.0">SLA de respuesta</tspan></text><text x="230.1" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="230.1" dy="0.0">Compromiso medible de</tspan><tspan x="230.1" dy="14.7">tiempo</tspan></text><rect x="48.6" y="194.2" width="177.8" height="54.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/><text x="137.5" y="213.2" font-size="12" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="137.5" dy="0.0">Evidencia del servicio</tspan></text><text x="137.5" y="229.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="137.5" dy="0.0">Registros que demuestran</tspan><tspan x="137.5" dy="14.7">lo hecho</tspan></text><circle cx="720" cy="40" r="14" fill="#E7E8EA" stroke="#B9BCC2"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">311</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Lo que queda de un pedido tras la plataforma de delivery</title><desc id="d">Lo que queda de un pedido tras la plataforma de delivery. Cada barra resta un costo del precio. La primera gran caída es la comisión. Lo que queda al final debe cubrir sueldos, arriendo y utilidad (cifras ilustrativas).</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Lo que queda de un pedido tras la plataforma de delivery</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 318 · Estudios de líneas de negocio reales 2026</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="100.0" width="520.0" height="52.0" rx="8" fill="#CDD0D4"/><text x="300.0" y="131.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Precio del pedido</tspan></text><text x="596.0" y="131.0" font-size="14" text-anchor="start" fill="#374151" font-weight="700"><tspan x="596.0" dy="0.0">$10.000</tspan></text><rect x="83.8" y="160.0" width="432.5" height="52.0" rx="8" fill="#A5AAB1"/><text x="300.0" y="191.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Menos comisión de plataforma (25 %)</tspan></text><text x="596.0" y="186.0" font-size="14" text-anchor="start" fill="#374151" font-weight="700"><tspan x="596.0" dy="0.0">$7.500</tspan></text><text x="596.0" y="207.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 75 %</tspan></text><rect x="139.8" y="220.0" width="320.5" height="52.0" rx="8" fill="#7D848E"/><text x="300.0" y="251.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Menos materia prima y empaque</tspan></text><text x="596.0" y="246.0" font-size="14" text-anchor="start" fill="#374151" font-weight="700"><tspan x="596.0" dy="0.0">$4.300</tspan></text><text x="596.0" y="267.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 57 %</tspan></text><rect x="183.5" y="280.0" width="233.0" height="52.0" rx="8" fill="#555E6B"/><text x="300.0" y="311.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">Menos preparación y gastos</tspan></text><text x="596.0" y="306.0" font-size="14" text-anchor="start" fill="#374151" font-weight="700"><tspan x="596.0" dy="0.0">$1.800</tspan></text><text x="596.0" y="327.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 42 %</tspan></text><rect x="30" y="156" width="720" height="60" rx="12" fill="none" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="6 4"/><text x="742.0" y="152.0" font-size="11" text-anchor="end" fill="#DC2626" font-weight="700"><tspan x="742.0" dy="0.0">cuello</tspan></text><circle cx="720" cy="40" r="14" fill="#E7E8EA" stroke="#B9BCC2"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">318</text></svg>

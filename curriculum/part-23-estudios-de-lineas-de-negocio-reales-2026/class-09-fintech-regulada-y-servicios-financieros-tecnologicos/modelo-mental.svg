<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">¿Tu servicio financiero requiere registro ante la CMF?</title><desc id="d">¿Tu servicio financiero requiere registro ante la CMF?. Responde con honestidad qué servicio prestas. El registro no es un trámite posterior: es una condición para operar. Si usas datos financieros de clientes, revisa también el sistema de finanzas abiertas.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">¿Tu servicio financiero requiere registro ante la CMF?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 317 · Estudios de líneas de negocio reales 2026</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="55.0" y="336.0" width="190.0" height="84.0" rx="10" fill="#DFE1E3" stroke="#374151" stroke-width="1.6"/><text x="150.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="150.0" dy="0.0">Opera con tus</tspan><tspan x="150.0" dy="16.0">obligaciones de</tspan><tspan x="150.0" dy="16.0">información, gobierno y</tspan><tspan x="150.0" dy="16.0">prevención de lavado</tspan></text><rect x="285.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#DFE1E3" stroke="#374151" stroke-width="1.6"/><text x="380.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">No operes: inscríbete o</tspan><tspan x="380.0" dy="16.0">autorízate antes de</tspan><tspan x="380.0" dy="16.0">ofrecer el servicio</tspan></text><line x1="265.0" y1="290.0" x2="150.0" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="195.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="195.5" dy="0.0">sí</tspan></text><line x1="265.0" y1="290.0" x2="380.0" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="334.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="334.5" dy="0.0">no</tspan></text><path d="M167.8,224 h194.4 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-194.4 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#374151" stroke-width="2.2"/><text x="265.0" y="244.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="265.0" dy="0.0">¿Ya estás inscrito en el</tspan><tspan x="265.0" dy="16.6">registro de prestadores de</tspan><tspan x="265.0" dy="16.6">la CMF?</tspan></text><rect x="515.0" y="224.0" width="190.0" height="84.0" rx="10" fill="#DFE1E3" stroke="#374151" stroke-width="1.6"/><text x="610.0" y="246.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="610.0" dy="0.0">Revisa si usas finanzas</tspan><tspan x="610.0" dy="16.0">abiertas u otro servicio</tspan><tspan x="610.0" dy="16.0">regulado antes de</tspan><tspan x="610.0" dy="16.0">concluir que no aplica</tspan></text><line x1="437.5" y1="210.0" x2="265.0" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="339.2" y="215.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="339.2" dy="0.0">sí</tspan></text><line x1="437.5" y1="210.0" x2="610.0" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="535.8" y="215.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="535.8" dy="0.0">no</tspan></text><path d="M347.7,112 h179.60000000000002 a14,14 0 0 1 14,14 v70 a14,14 0 0 1 -14,14 h-179.60000000000002 a14,14 0 0 1 -14,-14 v-70 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#374151" stroke-width="2.2"/><text x="437.5" y="132.3" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="437.5" dy="0.0">¿Prestas asesoría o</tspan><tspan x="437.5" dy="16.6">intermediación de</tspan><tspan x="437.5" dy="16.6">instrumentos, plataforma</tspan><tspan x="437.5" dy="16.6">de financiamiento</tspan><tspan x="437.5" dy="16.6">colectivo o custodia?</tspan></text><circle cx="720" cy="40" r="14" fill="#E7E8EA" stroke="#B9BCC2"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">317</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Las 13 semanas: de lo comprometido a lo estimado</title><desc id="d">Las 13 semanas: de lo comprometido a lo estimado. La línea muestra el horizonte. Las primeras semanas son casi ciertas; las últimas, estimaciones. El hito final es la rutina: cada semana se corre el horizonte y se comparan los supuestos con la realidad.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Las 13 semanas: de lo comprometido a lo estimado</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 114 · Finanzas, caja, precios y economía unitaria</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#7C3AED" stroke-width="4"/><circle cx="110.0" cy="244" r="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="152.0" font-size="15" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="110.0" dy="0.0">Semanas 1 a 4</tspan></text><text x="110.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">Entradas y salidas</tspan><tspan x="110.0" dy="16.0">comprometidas</tspan></text><circle cx="290.0" cy="244" r="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/><line x1="290.0" y1="258.0" x2="290.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="290.0" y="312.0" font-size="15" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="290.0" dy="0.0">Semanas 5 a 8</tspan></text><text x="290.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="290.0" dy="0.0">Lo probable: pedidos,</tspan><tspan x="290.0" dy="16.0">cobros y pagos</tspan><tspan x="290.0" dy="16.0">recurrentes</tspan></text><circle cx="470.0" cy="244" r="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/><line x1="470.0" y1="230.0" x2="470.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="470.0" y="152.0" font-size="15" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="470.0" dy="0.0">Semanas 9 a 13</tspan></text><text x="470.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="470.0" dy="0.0">Estimaciones con</tspan><tspan x="470.0" dy="16.0">supuestos escritos</tspan></text><circle cx="650.0" cy="244" r="13" fill="#7C3AED" stroke="#7C3AED" stroke-width="3"/><line x1="650.0" y1="258.0" x2="650.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="312.0" font-size="15" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="650.0" dy="0.0">Cada semana</tspan></text><text x="650.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="650.0" dy="0.0">Se actualiza y se corre</tspan><tspan x="650.0" dy="16.0">el horizonte</tspan></text><text x="380.0" y="420.0" font-size="12" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">Se separa lo comprometido de lo probable y se actualiza todas las semanas.</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">114</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Piso, referencia y techo de un precio</title><desc id="d">Piso, referencia y techo de un precio. Cada peldaño es un límite. Tu precio vive entre el costo y el valor; el mercado indica dónde se ubican otros. El empaquetado cambia lo que el cliente compara.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Piso, referencia y techo de un precio</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 118 · Finanzas, caja, precios y economía unitaria</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="215.3" height="120.0" rx="10" fill="#F2EBFD"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#7C3AED" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Costo: el piso</tspan></text><text x="54.0" y="356.0" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="54.0" dy="0.0">Por debajo, pierdes dinero</tspan></text><rect x="263.3" y="195.0" width="215.3" height="205.0" rx="10" fill="#D1BAF9"/><text x="277.3" y="223.0" font-size="22" text-anchor="start" fill="#7C3AED" font-weight="800"><tspan x="277.3" dy="0.0">2</tspan></text><text x="277.3" y="247.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="277.3" dy="0.0">Mercado: la referencia</tspan></text><text x="277.3" y="271.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="277.3" dy="0.0">Lo que cobran otros por algo</tspan><tspan x="277.3" dy="15.4">comparable</tspan></text><rect x="486.7" y="110.0" width="215.3" height="290.0" rx="10" fill="#B089F4"/><text x="500.7" y="138.0" font-size="22" text-anchor="start" fill="#7C3AED" font-weight="800"><tspan x="500.7" dy="0.0">3</tspan></text><text x="500.7" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="500.7" dy="0.0">Valor: el techo</tspan></text><text x="500.7" y="186.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="500.7" dy="0.0">Lo que el cliente gana al</tspan><tspan x="500.7" dy="15.4">usarlo</tspan></text><line x1="48.0" y1="412.0" x2="720.0" y2="412.0" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#fl)"/><text x="716.0" y="430.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="716.0" dy="0.0">Tu precio se decide entre el piso y el techo</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">118</text></svg>

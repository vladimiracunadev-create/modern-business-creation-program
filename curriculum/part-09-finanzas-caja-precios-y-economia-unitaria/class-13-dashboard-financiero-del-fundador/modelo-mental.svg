<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Las cinco preguntas del dashboard del fundador</title><desc id="d">Las cinco preguntas del dashboard del fundador. Cada satélite es una pregunta con una cifra. Más indicadores no producen más control: producen ruido. Si un indicador no cambia ninguna decisión, sobra.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Las cinco preguntas del dashboard del fundador</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 125 · Finanzas, caja, precios y economía unitaria</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="380.0" y1="262.0" x2="380.0" y2="130.0" stroke="#C4A6F7" stroke-width="2"/><line x1="380.0" y1="262.0" x2="622.5" y2="221.2" stroke="#C4A6F7" stroke-width="2"/><line x1="380.0" y1="262.0" x2="529.9" y2="368.8" stroke="#C4A6F7" stroke-width="2"/><line x1="380.0" y1="262.0" x2="230.1" y2="368.8" stroke="#C4A6F7" stroke-width="2"/><line x1="380.0" y1="262.0" x2="137.5" y2="221.2" stroke="#C4A6F7" stroke-width="2"/><ellipse cx="380" cy="262" rx="78" ry="46" fill="#7C3AED"/><text x="380.0" y="266.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">Una página</tspan></text><rect x="292.0" y="103.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><text x="380.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="380.0" dy="0.0">¿Cuánta caja hay?</tspan></text><text x="380.0" y="138.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Y para cuántas semanas</tspan><tspan x="380.0" dy="14.7">alcanza</tspan></text><rect x="534.5" y="201.2" width="176.0" height="40.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><text x="622.5" y="220.2" font-size="13.5" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="622.5" dy="0.0">¿Cuánto se vendió?</tspan></text><text x="622.5" y="236.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="622.5" dy="0.0">Contra lo proyectado</tspan></text><rect x="441.9" y="348.8" width="176.0" height="40.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><text x="529.9" y="367.8" font-size="13.5" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="529.9" dy="0.0">¿Con qué margen?</tspan></text><text x="529.9" y="383.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="529.9" dy="0.0">Bruto y de contribución</tspan></text><rect x="142.1" y="341.8" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><text x="230.1" y="360.8" font-size="13.5" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="230.1" dy="0.0">¿Cuánto debo?</tspan></text><text x="230.1" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="230.1" dy="0.0">Proveedores, impuestos y</tspan><tspan x="230.1" dy="14.7">deuda</tspan></text><rect x="49.5" y="201.2" width="176.0" height="40.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><text x="137.5" y="220.2" font-size="13.5" text-anchor="middle" fil
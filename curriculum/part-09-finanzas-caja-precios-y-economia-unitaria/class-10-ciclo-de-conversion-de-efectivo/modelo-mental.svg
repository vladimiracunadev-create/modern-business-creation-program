<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Los días que se compra el dinero entre el pago y el cobro</title><desc id="d">Los días que se compra el dinero entre el pago y el cobro. Las tres primeras barras son las palancas y la cuarta es el resultado. Reducir inventario o cobro y alargar el pago acorta el ciclo. Cada día vale dinero.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Los días que se compra el dinero entre el pago y el cobro</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 122 · Finanzas, caja, precios y economía unitaria</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="117.0" y="204.5" width="96.0" height="145.5" rx="8" fill="#D1BAF9"/><text x="165.0" y="194.5" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="165.0" dy="0.0">40 d</tspan></text><text x="165.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="165.0" dy="0.0">Días de inventario</tspan></text><rect x="267.0" y="186.3" width="96.0" height="163.7" rx="8" fill="#D1BAF9"/><text x="315.0" y="176.3" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="315.0" dy="0.0">45 d</tspan></text><text x="315.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="315.0" dy="0.0">Días de cobro a</tspan><tspan x="315.0" dy="16.0">clientes</tspan></text><rect x="417.0" y="240.9" width="96.0" height="109.1" rx="8" fill="#D1BAF9"/><text x="465.0" y="230.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="465.0" dy="0.0">30 d</tspan></text><text x="465.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="465.0" dy="0.0">Días de pago a</tspan><tspan x="465.0" dy="16.0">proveedores</tspan></text><rect x="567.0" y="149.9" width="96.0" height="200.1" rx="8" fill="#7C3AED"/><text x="615.0" y="139.9" font-size="14" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="615.0" dy="0.0">55 d</tspan></text><text x="615.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="615.0" dy="0.0">Ciclo de conversión</tspan><tspan x="615.0" dy="16.0">de efectivo</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">Ciclo = inventario + cobro − pago. Cada día que se reduce libera el equivalente a un día de venta.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Días (ejemplo ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">122</text></svg>

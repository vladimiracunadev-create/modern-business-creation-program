<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">¿Qué se financia con deuda y a qué plazo?</title><desc id="d">¿Qué se financia con deuda y a qué plazo?. Recorre el árbol antes de pedir un crédito. La pregunta clave no es solo el costo, sino el plazo: un buen crédito con mal plazo puede ser peor que uno más caro con calce.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">¿Qué se financia con deuda y a qué plazo?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 123 · Finanzas, caja, precios y economía unitaria</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="55.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#EADFFC" stroke="#7C3AED" stroke-width="1.6"/><text x="150.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="150.0" dy="0.0">Deuda buena: calza el</tspan><tspan x="150.0" dy="16.0">plazo y el costo es</tspan><tspan x="150.0" dy="16.0">financiable</tspan></text><rect x="285.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#EADFFC" stroke="#7C3AED" stroke-width="1.6"/><text x="380.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Descalce: refinancia a</tspan><tspan x="380.0" dy="16.0">largo plazo antes de</tspan><tspan x="380.0" dy="16.0">comprar</tspan></text><line x1="265.0" y1="290.0" x2="150.0" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="195.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="195.5" dy="0.0">sí</tspan></text><line x1="265.0" y1="290.0" x2="380.0" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="334.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="334.5" dy="0.0">no</tspan></text><path d="M178.89999999999998,224 h172.20000000000002 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-172.20000000000002 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.2"/><text x="265.0" y="244.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="265.0" dy="0.0">¿El crédito tiene plazo</tspan><tspan x="265.0" dy="16.6">similar a la vida del</tspan><tspan x="265.0" dy="16.6">activo?</tspan></text><rect x="515.0" y="224.0" width="190.0" height="84.0" rx="10" fill="#EADFFC" stroke="#7C3AED" stroke-width="1.6"/><text x="610.0" y="246.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="610.0" dy="0.0">Se financia con caja o</tspan><tspan x="610.0" dy="16.0">con capital de trabajo,</tspan><tspan x="610.0" dy="16.0">no con deuda de largo</tspan><tspan x="610.0" dy="16.0">plazo</tspan></text><line x1="437.5" y1="178.0" x2="265.0" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="339.2" y="199.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="339.2" dy="0.0">sí</tspan></text><line x1="437.5" y1="178.0" x2="610.0" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="535.8" y="199.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="535.8" dy="0.0">no</tspan></text><path d="M351.4,112 h172.20000000000002 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-172.20000000000002 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.2"/><text x="437.5" y="132.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="437.5" dy="0.0">¿El activo o el gasto</tspan><tspan x="437.5" dy="16.6">generará beneficios por</tspan><tspan x="437.5" dy="16.6">varios años?</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">123</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El calendario tributario del caso, mes a mes y año a año</title><desc id="d">El calendario tributario del caso, mes a mes y año a año. La línea ordena las obligaciones del caso. Lo mensual es un ritmo; lo anual, un cierre. Cada punto tiene un responsable y una fecha, y la provisión liga lo tributario con lo financiero.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El calendario tributario del caso, mes a mes y año a año</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 328 · Capstone: construir una empresa de comienzo a fin</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#374151" stroke-width="4"/><circle cx="110.0" cy="244" r="9" fill="#FFFFFF" stroke="#374151" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="136.0" font-size="15" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="110.0" dy="0.0">Antes de operar</tspan></text><text x="110.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">Inicio de actividades</tspan><tspan x="110.0" dy="16.0">con giros, domicilio y</tspan><tspan x="110.0" dy="16.0">régimen</tspan></text><circle cx="290.0" cy="244" r="13" fill="#374151" stroke="#374151" stroke-width="3"/><line x1="290.0" y1="258.0" x2="290.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="290.0" y="312.0" font-size="15" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="290.0" dy="0.0">Cada mes</tspan></text><text x="290.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="290.0" dy="0.0">Revisión del Registro</tspan><tspan x="290.0" dy="16.0">de Compras y Ventas,</tspan><tspan x="290.0" dy="16.0">F29 y pago</tspan></text><circle cx="470.0" cy="244" r="9" fill="#FFFFFF" stroke="#374151" stroke-width="3"/><line x1="470.0" y1="230.0" x2="470.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="470.0" y="152.0" font-size="15" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="470.0" dy="0.0">Cada mes</tspan></text><text x="470.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="470.0" dy="0.0">Provisión del impuesto</tspan><tspan x="470.0" dy="16.0">por pagar</tspan></text><circle cx="650.0" cy="244" r="9" fill="#FFFFFF" stroke="#374151" stroke-width="3"/><line x1="650.0" y1="258.0" x2="650.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="312.0" font-size="15" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="650.0" dy="0.0">Cada año</tspan></text><text x="650.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="650.0" dy="0.0">Declaraciones juradas y</tspan><tspan x="650.0" dy="16.0">Formulario 22 en la</tspan><tspan x="650.0" dy="16.0">Operación Renta</tspan></text><text x="380.0" y="420.0" font-size="12" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">Provisionar el impuesto evita descubrir tarde que la caja
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El costo real de traer un producto a Chile</title><desc id="d">El costo real de traer un producto a Chile. Cada barra suma un costo al valor FOB. El IVA de importación, aunque recuperable, exige caja anticipada. El costo de internación es lo que importa para fijar el precio.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El costo real de traer un producto a Chile</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 242 · Comercio exterior e internacionalización</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="111.6" y="149.9" width="76.8" height="200.1" rx="8" fill="#ABCFCC"/><text x="150.0" y="139.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="150.0" dy="0.0">100</tspan></text><text x="150.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="150.0" dy="0.0">Valor FOB del</tspan><tspan x="150.0" dy="16.0">producto</tspan></text><rect x="231.6" y="326.0" width="76.8" height="24.0" rx="8" fill="#ABCFCC"/><text x="270.0" y="316.0" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="270.0" dy="0.0">12</tspan></text><text x="270.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="270.0" dy="0.0">Flete y seguro</tspan></text><rect x="351.6" y="338.0" width="76.8" height="12.0" rx="8" fill="#ABCFCC"/><text x="390.0" y="328.0" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="390.0" dy="0.0">6</tspan></text><text x="390.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="390.0" dy="0.0">Arancel</tspan></text><rect x="471.6" y="306.0" width="76.8" height="44.0" rx="8" fill="#0F766E"/><text x="510.0" y="296.0" font-size="14" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="510.0" dy="0.0">22</tspan></text><text x="510.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="510.0" dy="0.0">IVA de</tspan><tspan x="510.0" dy="16.0">importación</tspan></text><rect x="591.6" y="342.0" width="76.8" height="8.0" rx="8" fill="#ABCFCC"/><text x="630.0" y="332.0" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="630.0" dy="0.0">4</tspan></text><text x="630.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="630.0" dy="0.0">Agente y</tspan><tspan x="630.0" dy="16.0">almacenaje</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">El IVA de importación es crédito si vendes con IVA, pero inmoviliza caja; el resto es costo del</tspan><tspan x="56.0" dy="16.0">producto.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Costo por cada 100 de valor FOB (ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">242</text></svg>

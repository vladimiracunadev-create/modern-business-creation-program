<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Un camino para entrar a un mercado con apoyo institucional</title><desc id="d">Un camino para entrar a un mercado con apoyo institucional. La línea ordena el camino de un primer mercado. El hito destacado es la agenda de negocios, el paso que pasa de la información a conversaciones reales con compradores.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Un camino para entrar a un mercado con apoyo institucional</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 251 · Comercio exterior e internacionalización</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#0F766E" stroke-width="4"/><circle cx="110.0" cy="244" r="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="136.0" font-size="15" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="110.0" dy="0.0">Estudio de mercado</tspan></text><text x="110.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">Tamaño,</tspan><tspan x="110.0" dy="16.0">competidores,</tspan><tspan x="110.0" dy="16.0">canales y normas</tspan></text><circle cx="245.0" cy="244" r="13" fill="#0F766E" stroke="#0F766E" stroke-width="3"/><line x1="245.0" y1="258.0" x2="245.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="245.0" y="312.0" font-size="15" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="245.0" dy="0.0">Agenda de negocios</tspan></text><text x="245.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="245.0" dy="0.0">Contactos</tspan><tspan x="245.0" dy="16.0">validados con</tspan><tspan x="245.0" dy="16.0">compradores reales</tspan></text><circle cx="380.0" cy="244" r="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/><line x1="380.0" y1="230.0" x2="380.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="380.0" y="136.0" font-size="15" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="380.0" dy="0.0">Misión o feria</tspan></text><text x="380.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="380.0" dy="0.0">Primera presencia</tspan><tspan x="380.0" dy="16.0">con apoyo de</tspan><tspan x="380.0" dy="16.0">ProChile</tspan></text><circle cx="515.0" cy="244" r="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/><line x1="515.0" y1="258.0" x2="515.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="515.0" y="312.0" font-size="15" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="515.0" dy="0.0">Seguimiento</tspan></text><text x="515.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="515.0" dy="0.0">Muestras,</tspan><tspan x="515.0" dy="16.0">cotizaciones y</tspan><tspan x="515.0" dy="16.0">negociación</tspan></text><circle cx="650.0" cy="244" r="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/><line x1="650.0" y1="230.0" x2="650.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="136.0" font-size="15" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="650.0" dy="0.0">Primer pedido y ajustes</tspan></text><text x="650.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="650.0" dy="0.0">Se adapta</tspan><tspan x="650.0" dy="16.0">producto, precio y</tspan><tspan x="650.0" dy="16.0">cultura comercial</tspan></text><text x="380.0" y="420.0" font-size="12" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">El mayor valor de la institución está en la información y el contacto validado.</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">251</text></svg>

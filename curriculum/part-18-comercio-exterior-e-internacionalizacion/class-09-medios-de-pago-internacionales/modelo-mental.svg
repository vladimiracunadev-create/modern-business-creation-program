<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Qué medio de pago internacional elegir según el riesgo</title><desc id="d">Qué medio de pago internacional elegir según el riesgo. Ubica a tu comprador según la confianza que te inspira y cuánto costo aceptas. Con compradores nuevos, el pago anticipado o la carta de crédito protegen; con clientes de largo plazo, una cuenta abierta reduce costos.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Qué medio de pago internacional elegir según el riesgo</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 247 · Comercio exterior e internacionalización</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="150.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#CAE1DF" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">Carta de crédito confirmada</tspan></text><text x="164.0" y="148.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Poca confianza y tolerancia al</tspan><tspan x="164.0" dy="15.4">costo: el banco garantiza el pago</tspan><tspan x="164.0" dy="15.4">si los documentos son exactos.</tspan></text><rect x="410.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#E7F1F0" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">Cobranza documentaria</tspan></text><text x="424.0" y="148.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Confianza media: el banco gestiona</tspan><tspan x="424.0" dy="15.4">los documentos sin garantizar el</tspan><tspan x="424.0" dy="15.4">pago.</tspan></text><rect x="150.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#EEF0F3" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">Pago anticipado</tspan></text><text x="164.0" y="293.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Poca confianza y bajo costo: exige</tspan><tspan x="164.0" dy="15.4">al comprador pagar antes de</tspan><tspan x="164.0" dy="15.4">enviar.</tspan></text><rect x="410.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#FDEED3" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">Cuenta abierta</tspan></text><text x="424.0" y="293.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Alta confianza y bajo costo: pagas</tspan><tspan x="424.0" dy="15.4">al recibir, con riesgo del</tspan><tspan x="424.0" dy="15.4">vendedor.</tspan></text><line x1="140.0" y1="396.0" x2="676.0" y2="396.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><line x1="140.0" y1="396.0" x2="140.0" y2="92.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><text x="410.0" y="420.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="410.0" dy="0.0">Confianza en la contraparte (baja a alta)</tspan></text><g transform="translate(88 241.0) rotate(-90)"><text x="0.0" y="0.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="0.0" dy="0.0">Costo que aceptas pagar (bajo a alto)</tspan></text></g><text x="150.0" y="420.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="150.0" dy="0.0">bajo</tspan></text><text x="670.0" y="420.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="670.0" dy="0.0">alto</tspan></text><circle cx="254.0" cy="154.0" r="9" fill="#0F766E" stroke="#FFFFFF" stroke-width="3"/><text x="270.0" y="159.0" font-size="13" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="270.0" dy="0.0">Cliente nuevo</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">247</text></svg>

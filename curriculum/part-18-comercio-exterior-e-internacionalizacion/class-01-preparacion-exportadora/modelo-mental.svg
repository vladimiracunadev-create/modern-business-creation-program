<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">¿Está tu empresa lista para exportar?</title><desc id="d">¿Está tu empresa lista para exportar?. Cada peldaño es una condición. Si falla uno, el siguiente no se sostiene: de nada sirve un pedido grande sin capacidad para cumplirlo ni un margen que pague el flete.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">¿Está tu empresa lista para exportar?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 239 · Comercio exterior e internacionalización</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="159.5" height="120.0" rx="10" fill="#E7F1F0"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Capacidad</tspan><tspan x="54.0" dy="17.9">productiva estable</tspan></text><text x="54.0" y="374.0" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="54.0" dy="0.0">Puedes cumplir</tspan><tspan x="54.0" dy="15.4">volúmenes sin parar tu</tspan><tspan x="54.0" dy="15.4">mercado actual</tspan></text><rect x="207.5" y="223.3" width="159.5" height="176.7" rx="10" fill="#BFDAD8"/><text x="221.5" y="251.3" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="221.5" dy="0.0">2</tspan></text><text x="221.5" y="275.3" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="221.5" dy="0.0">Margen que soporta</tspan><tspan x="221.5" dy="17.9">los costos extra</tspan></text><text x="221.5" y="317.3" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="221.5" dy="0.0">Flete, seguros,</tspan><tspan x="221.5" dy="15.4">certificaciones y</tspan><tspan x="221.5" dy="15.4">trámites</tspan></text><rect x="375.0" y="166.7" width="159.5" height="233.3" rx="10" fill="#97C4C0"/><text x="389.0" y="194.7" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="389.0" dy="0.0">3</tspan></text><text x="389.0" y="218.7" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="389.0" dy="0.0">Producto adecuado</tspan><tspan x="389.0" dy="17.9">al destino</tspan></text><text x="389.0" y="260.7" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="389.0" dy="0.0">Etiquetas, normas y</tspan><tspan x="389.0" dy="15.4">preferencias locales</tspan></text><rect x="542.5" y="110.0" width="159.5" height="290.0" rx="10" fill="#6FADA8"/><text x="556.5" y="138.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="556.5" dy="0.0">4</tspan></text><text x="556.5" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="556.5" dy="0.0">Capacidad</tspan><tspan x="556.5" dy="17.9">administrativa</tspan></text><text x="556.5" y="204.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="556.5" dy="0.0">Documentación y</tspan><tspan x="556.5" dy="15.4">seguimiento de cada</tspan><tspan x="556.5" dy="15.4">embarque</tspan></text><line x1="48.0" y1="412.
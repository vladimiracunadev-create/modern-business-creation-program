<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Qué tan completo está tu mapa de datos</title><desc id="d">Qué tan completo está tu mapa de datos. Cada peldaño suma información al mapa. Ubica en cuál estás hoy y define cuándo llegarás al siguiente. Un mapa que no se actualiza se vuelve decoración.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#C2410C"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Qué tan completo está tu mapa de datos</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 148 · Consumidor, e-commerce, privacidad, IP y seguridad digital</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="126.0" height="120.0" rx="10" fill="#F9ECE7"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#C2410C" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Inventario</tspan></text><text x="54.0" y="356.0" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="54.0" dy="0.0">Qué datos hay y</tspan><tspan x="54.0" dy="15.4">dónde están</tspan></text><rect x="174.0" y="237.5" width="126.0" height="162.5" rx="10" fill="#F1D4C8"/><text x="188.0" y="265.5" font-size="22" text-anchor="start" fill="#C2410C" font-weight="800"><tspan x="188.0" dy="0.0">2</tspan></text><text x="188.0" y="289.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="188.0" dy="0.0">Finalidad</tspan></text><text x="188.0" y="313.5" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="188.0" dy="0.0">Para qué se usa</tspan><tspan x="188.0" dy="15.4">cada uno</tspan></text><rect x="308.0" y="195.0" width="126.0" height="205.0" rx="10" fill="#EABCAA"/><text x="322.0" y="223.0" font-size="22" text-anchor="start" fill="#C2410C" font-weight="800"><tspan x="322.0" dy="0.0">3</tspan></text><text x="322.0" y="247.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="322.0" dy="0.0">Base de licitud</tspan></text><text x="322.0" y="271.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="322.0" dy="0.0">Por qué es</tspan><tspan x="322.0" dy="15.4">legítimo tratarlo</tspan></text><rect x="442.0" y="152.5" width="126.0" height="247.5" rx="10" fill="#E2A58C"/><text x="456.0" y="180.5" font-size="22" text-anchor="start" fill="#C2410C" font-weight="800"><tspan x="456.0" dy="0.0">4</tspan></text><text x="456.0" y="204.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="456.0" dy="0.0">Proveedores y</tspan><tspan x="456.0" dy="17.9">plazos</tspan></text><text x="456.0" y="246.5" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="456.0" dy="0.0">Con quién se</tspan><tspan x="456.0" dy="15.4">comparte y cuánto</tspan><tspan x="456.0" dy="15.4">se guarda</tspan></text><rect x="576.0" y="110.0" width="126.0" height="290.0" rx="10" fill="#DA8D6D"/><text x="590.0" y="138.0" font-size="22" text-anchor="start" fill="#C2410C" font-weight="800"><tspan x="590.0" dy="0.0">5</tspan></text><text x="590.0" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="70
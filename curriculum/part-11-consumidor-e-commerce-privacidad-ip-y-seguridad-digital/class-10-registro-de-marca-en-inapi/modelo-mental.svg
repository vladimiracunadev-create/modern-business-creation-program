<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Antes de registrar una marca en INAPI</title><desc id="d">Antes de registrar una marca en INAPI. Responde en orden. Sin búsqueda de anterioridades no sabes si el nombre es libre; con ella, el siguiente filtro es si las clases cubren lo que realmente vendes.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#C2410C"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Antes de registrar una marca en INAPI</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 150 · Consumidor, e-commerce, privacidad, IP y seguridad digital</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="55.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#F5E1D8" stroke="#C2410C" stroke-width="1.6"/><text x="150.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="150.0" dy="0.0">Solicita el registro y</tspan><tspan x="150.0" dy="16.0">vigila posibles</tspan><tspan x="150.0" dy="16.0">oposiciones</tspan></text><rect x="285.0" y="336.0" width="190.0" height="84.0" rx="10" fill="#F5E1D8" stroke="#C2410C" stroke-width="1.6"/><text x="380.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Agrega las clases que</tspan><tspan x="380.0" dy="16.0">faltan: registrar en la</tspan><tspan x="380.0" dy="16.0">clase equivocada deja el</tspan><tspan x="380.0" dy="16.0">uso real sin protección</tspan></text><line x1="265.0" y1="290.0" x2="150.0" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="195.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="195.5" dy="0.0">sí</tspan></text><line x1="265.0" y1="290.0" x2="380.0" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="334.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="334.5" dy="0.0">no</tspan></text><path d="M175.2,224 h179.60000000000002 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-179.60000000000002 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.2"/><text x="265.0" y="244.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="265.0" dy="0.0">¿Las clases solicitadas</tspan><tspan x="265.0" dy="16.6">cubren el uso real de la</tspan><tspan x="265.0" dy="16.6">marca?</tspan></text><rect x="515.0" y="224.0" width="190.0" height="68.0" rx="10" fill="#F5E1D8" stroke="#C2410C" stroke-width="1.6"/><text x="610.0" y="246.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="610.0" dy="0.0">Búscalas primero:</tspan><tspan x="610.0" dy="16.0">invertir en identidad sin</tspan><tspan x="610.0" dy="16.0">búsqueda es apostar</tspan></text><line x1="437.5" y1="194.0" x2="265.0" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="339.2" y="207.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="339.2" dy="0.0">sí</tspan></text><line x1="437.5" y1="194.0" x2="610.0" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="535.8" y="207.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="535.8" dy="0.0">no</tspan></text><path d="M351.4,112 h172.20000000000002 a14,14 0 0 1 14,14 v54 a14,14 0 0 1 -14,14 h-172.20000000000002 a14,14 0 0 1 -14,-14 v-54 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.2"/><text x="437.5" y="132.6" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="437.5" dy="0.0">¿Buscaste marcas</tspan><tspan x="437.5" dy="16.6">anteriores iguales o</tspan><tspan x="437.5" dy="16.6">parecidas en las clases</tspan><tspan x="437.5" dy="16.6">que te interesan?</tspan></text><circle cx="720" cy="40" r="14" fill="#F8E8E2" stroke="#EABCAA"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#C2410C" font-weight="700">150</text></svg>

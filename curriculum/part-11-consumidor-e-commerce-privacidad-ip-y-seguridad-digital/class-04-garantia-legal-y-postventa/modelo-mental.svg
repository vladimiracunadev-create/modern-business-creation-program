<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cómo se tramita una garantía legal</title><desc id="d">Cómo se tramita una garantía legal. El ciclo muestra que la decisión central no es de la empresa: el consumidor escoge. Después del cumplimiento, la causa de la falla debe volver al área de producto y compras.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#C2410C"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cómo se tramita una garantía legal</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 144 · Consumidor, e-commerce, privacidad, IP y seguridad digital</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><circle cx="380" cy="252" r="128" fill="none" stroke="#EABCAA" stroke-width="3" stroke-dasharray="3 7"/><path d="M380.0,124.0 Q485.7,151.7 556.5,212.4" fill="none" stroke="#C2410C" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M556.5,212.4 Q546.2,289.2 489.1,355.6" fill="none" stroke="#C2410C" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M489.1,355.6 Q380.0,379.6 270.9,355.6" fill="none" stroke="#C2410C" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M270.9,355.6 Q213.8,289.2 203.5,212.4" fill="none" stroke="#C2410C" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M203.5,212.4 Q274.3,151.7 380.0,124.0" fill="none" stroke="#C2410C" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><rect x="301.4" y="98.0" width="157.2" height="52.0" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><text x="380.0" y="120.2" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">El consumidor</tspan><tspan x="380.0" dy="16.6">reclama una falla</tspan></text><circle cx="303.4" cy="100.0" r="10" fill="#C2410C"/><text x="303.4" y="104.0" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">1</text><rect x="477.9" y="186.4" width="157.2" height="52.0" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><text x="556.5" y="208.7" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="556.5" dy="0.0">Se registra el</tspan><tspan x="556.5" dy="16.6">reclamo con fecha</tspan></text><circle cx="479.9160894243804" cy="188.44582472000673" r="10" fill="#C2410C"/><text x="479.9160894243804" y="192.44582472000673" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">2</text><rect x="414.3" y="312.6" width="149.6" height="86.0" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><text x="489.1" y="335.1" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="489.1" dy="0.0">El consumidor</tspan><tspan x="489.1" dy="16.6">elige entre las</tspan><tspan x="489.1" dy="16.6">alternativas que</tspan><tspan x="489.1" dy="16.6">la ley le da</tspan></text><circle cx="416.292942825483" cy="314.5541752799933" r="10" fill="#C2410C"/><text x="416.292942825483" y="318.5541752799933" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">3</text><rect x="192.3" y="329.6" width="157.2" height="52.0" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><text x="270.9" y="351.8" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="270.9" dy="0.0">La empresa cumple</tspan><tspan x="270.9" dy="16.6">la opción elegida</tspan></text><circle cx="194.30705717451704" cy="331.5541752799933" r="10" fill="#C2410C"/><text x="194.30705717451704" y="335.5541752799933" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">4</text><rect x="128.7" y="186.4" width="149.6" height="52.0" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><text x="203.5" y="208.7" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="203.5" dy="0.0">Se cierra y se</tspan><tspan x="203.5" dy="16.6">analiza la causa</tspan></text><circle cx="130.6839105756195" cy="188.44582472000675" r="10" fill="#C2410C"/><text x="130.6839105756195" y="192.44582472000675" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">5</text><text x="380.0" y="247.9" font-size="14" text-anchor="middle" fill="#C2410C" font-weight="700"><tspan x="380.0" dy="0.0">La elección es</tspan><tspan x="380.0" dy="17.9">del consumidor</tspan></text><circle cx="720" cy="40" r="14" fill="#F8E8E2" stroke="#EABCAA"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#C2410C" font-weight="700">144</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuánta obligación directa trae la ley de ciberseguridad</title><desc id="d">Cuánta obligación directa trae la ley de ciberseguridad. Cada peldaño es un grado de obligación. Averigua en cuál estás tú y, si no estás obligada directamente, si alguno de tus clientes sí lo está.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#C2410C"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuánta obligación directa trae la ley de ciberseguridad</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 153 · Consumidor, e-commerce, privacidad, IP y seguridad digital</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="159.5" height="120.0" rx="10" fill="#F9ECE7"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#C2410C" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Empresa no</tspan><tspan x="54.0" dy="17.9">calificada</tspan></text><text x="54.0" y="374.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="54.0" dy="0.0">Sin obligaciones</tspan><tspan x="54.0" dy="15.4">directas, pero con</tspan><tspan x="54.0" dy="15.4">buenas prácticas</tspan></text><rect x="207.5" y="223.3" width="159.5" height="176.7" rx="10" fill="#EFCCBE"/><text x="221.5" y="251.3" font-size="22" text-anchor="start" fill="#C2410C" font-weight="800"><tspan x="221.5" dy="0.0">2</tspan></text><text x="221.5" y="275.3" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="221.5" dy="0.0">Proveedor de una</tspan><tspan x="221.5" dy="17.9">institución</tspan><tspan x="221.5" dy="17.9">regulada</tspan></text><text x="221.5" y="335.3" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="221.5" dy="0.0">Obligaciones por</tspan><tspan x="221.5" dy="15.4">contrato con ese</tspan><tspan x="221.5" dy="15.4">cliente</tspan></text><rect x="375.0" y="166.7" width="159.5" height="233.3" rx="10" fill="#E5AD96"/><text x="389.0" y="194.7" font-size="22" text-anchor="start" fill="#C2410C" font-weight="800"><tspan x="389.0" dy="0.0">3</tspan></text><text x="389.0" y="218.7" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="389.0" dy="0.0">Servicio esencial</tspan></text><text x="389.0" y="242.7" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="389.0" dy="0.0">Obligaciones de la</tspan><tspan x="389.0" dy="15.4">ley, incluido el</tspan><tspan x="389.0" dy="15.4">reporte de incidentes</tspan></text><rect x="542.5" y="110.0" width="159.5" height="290.0" rx="10" fill="#DA8D6D"/><text x="556.5" y="138.0" font-size="22" text-anchor="start" fill="#C2410C" font-weight="800"><tspan x="556.5" dy="0.0">4</tspan></text><text x="556.5" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="556.5" dy="0.0">Operador de</tspan><tspan x="556.5" dy="17.9">importancia vital</tspan></text><text x="556.5" y="204.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="556.5" dy="0.0">Obligaciones</tspan><tspan x="556.5" dy="15.4">reforzadas y plazos</tspan><tspan x="556.5" dy="15.4">más estrictos</tspan></text><line x1="48.0" y1="412.0" x2="720.0" y2="412.0" stroke="#C2410C" stroke-width="2.4" marker-end="url(#fl)"/><text x="716.0" y="430.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="716.0" dy="0.0">Más obligación directa</tspan></text><circle cx="720" cy="40" r="14" fill="#F8E8E2" stroke="#EABCAA"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#C2410C" font-weight="700">153</text></svg>

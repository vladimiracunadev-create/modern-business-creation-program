<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Pagar impuesto sobre lo cobrado, no solo sobre lo facturado</title><desc id="d">Pagar impuesto sobre lo cobrado, no solo sobre lo facturado. La primera barra es lo vendido; la segunda, lo realmente cobrado. En una base devengada se paga sobre la primera; en una base de caja, sobre lo cobrado, que ayuda cuando los clientes pagan tarde.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2563EB"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Pagar impuesto sobre lo cobrado, no solo sobre lo facturado</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 90 · SII y ciclo tributario de principio a fin</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="144.0" y="149.9" width="192.0" height="200.1" rx="8" fill="#B3C8F8"/><text x="240.0" y="139.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="240.0" dy="0.0">100 M$</tspan></text><text x="240.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="240.0" dy="0.0">Ventas del mes (devengadas)</tspan></text><rect x="444.0" y="230.0" width="192.0" height="120.0" rx="8" fill="#2563EB"/><text x="540.0" y="220.0" font-size="14" text-anchor="middle" fill="#2563EB" font-weight="800"><tspan x="540.0" dy="0.0">60 M$</tspan></text><text x="540.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="540.0" dy="0.0">Cobrado en el mes (base caja)</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">Con cobro lento, tributar en base a caja evita pagar impuesto sobre dinero que aún no entró.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Millones de pesos (ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#E5ECFD" stroke="#B3C8F8"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">90</text></svg>

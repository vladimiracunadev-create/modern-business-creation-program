<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">De la constitución a la primera factura</title><desc id="d">De la constitución a la primera factura. La línea ordena el proceso. El hito destacado es la declaración, que se hace en línea y define giros y régimen; los demás pasos dependen de que esté bien hecha.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2563EB"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">De la constitución a la primera factura</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 86 · SII y ciclo tributario de principio a fin</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#2563EB" stroke-width="4"/><circle cx="110.0" cy="244" r="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="152.0" font-size="15" text-anchor="middle" fill="#2563EB" font-weight="800"><tspan x="110.0" dy="0.0">Constitución</tspan></text><text x="110.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">La sociedad existe</tspan><tspan x="110.0" dy="16.0">y tiene RUT</tspan></text><circle cx="245.0" cy="244" r="13" fill="#2563EB" stroke="#2563EB" stroke-width="3"/><line x1="245.0" y1="258.0" x2="245.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="245.0" y="312.0" font-size="15" text-anchor="middle" fill="#2563EB" font-weight="800"><tspan x="245.0" dy="0.0">Declaración</tspan></text><text x="245.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="245.0" dy="0.0">Inicio de</tspan><tspan x="245.0" dy="16.0">actividades con</tspan><tspan x="245.0" dy="16.0">giros y régimen</tspan></text><circle cx="380.0" cy="244" r="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><line x1="380.0" y1="230.0" x2="380.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="380.0" y="120.0" font-size="15" text-anchor="middle" fill="#2563EB" font-weight="800"><tspan x="380.0" dy="0.0">Verificación</tspan></text><text x="380.0" y="138.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="380.0" dy="0.0">El SII puede</tspan><tspan x="380.0" dy="16.0">verificar la</tspan><tspan x="380.0" dy="16.0">actividad y el</tspan><tspan x="380.0" dy="16.0">domicilio</tspan></text><circle cx="515.0" cy="244" r="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><line x1="515.0" y1="258.0" x2="515.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="515.0" y="312.0" font-size="15" text-anchor="middle" fill="#2563EB" font-weight="800"><tspan x="515.0" dy="0.0">Habilitación</tspan></text><text x="515.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="515.0" dy="0.0">Se activa la</tspan><tspan x="515.0" dy="16.0">emisión de</tspan><tspan x="515.0" dy="16.0">documentos</tspan></text><circle cx="650.0" cy="244" r="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><line x1="650.0" y1="230.0" x2="650.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="136.0" font-size="15" text-anchor="middle" fill="#2563EB" font-weight="800"><tspan x="650.0" dy="0.0">Primera factura</tspan></text><text x="650.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="650.0" dy="0.0">Ya eres</tspan><tspan x="650.0" dy="16.0">contribuyente</tspan><tspan x="650.0" dy="16.0">operativo</tspan></text><text x="380.0" y="420.0" font-size="12" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">Declarar a tiempo y con datos correctos evita observaciones que retrasan la primera venta.</tspan></text><circle cx="720" cy="40" r="14" fill="#E5ECFD" stroke="#B3C8F8"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">86</text></svg>

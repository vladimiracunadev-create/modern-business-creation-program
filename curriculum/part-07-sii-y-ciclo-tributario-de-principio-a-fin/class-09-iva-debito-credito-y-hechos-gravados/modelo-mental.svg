<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El IVA que cobras no es tu caja</title><desc id="d">El IVA que cobras no es tu caja. La primera barra incluye el IVA que cobraste; la segunda muestra lo que realmente es tuyo. Gastar la primera es gastar dinero ajeno que debes entregar al mes siguiente (cifras ilustrativas).</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2563EB"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El IVA que cobras no es tu caja</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 93 · SII y ciclo tributario de principio a fin</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="100.0" width="520.0" height="52.0" rx="8" fill="#C8D8FA"/><text x="300.0" y="131.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Ventas con IVA</tspan></text><text x="596.0" y="131.0" font-size="14" text-anchor="start" fill="#2563EB" font-weight="700"><tspan x="596.0" dy="0.0">$119.000</tspan></text><rect x="68.0" y="160.0" width="464.0" height="52.0" rx="8" fill="#87A9F4"/><text x="300.0" y="191.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Sin el IVA que es del fisco</tspan></text><text x="596.0" y="191.0" font-size="14" text-anchor="start" fill="#2563EB" font-weight="700"><tspan x="596.0" dy="0.0">$100.000</tspan></text><text x="668.0" y="191.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 84 %</tspan></text><rect x="141.5" y="220.0" width="317.0" height="52.0" rx="8" fill="#467AEE"/><text x="300.0" y="251.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">Menos el costo neto de insumos</tspan></text><text x="596.0" y="251.0" font-size="14" text-anchor="start" fill="#2563EB" font-weight="700"><tspan x="596.0" dy="0.0">$50.000</tspan></text><text x="668.0" y="251.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 50 %</tspan></text><rect x="30" y="156" width="720" height="60" rx="12" fill="none" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="6 4"/><text x="742.0" y="152.0" font-size="11" text-anchor="end" fill="#DC2626" font-weight="700"><tspan x="742.0" dy="0.0">cuello</tspan></text><circle cx="720" cy="40" r="14" fill="#E5ECFD" stroke="#B3C8F8"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">93</text></svg>

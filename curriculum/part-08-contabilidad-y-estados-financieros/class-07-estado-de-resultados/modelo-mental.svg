<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Dónde se queda el dinero entre la venta y el resultado</title><desc id="d">Dónde se queda el dinero entre la venta y el resultado. Cada barra es lo que queda tras un tipo de costo. La mayor caída señala dónde está el problema: en el costo de entregar o en la estructura (cifras ilustrativas).</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Dónde se queda el dinero entre la venta y el resultado</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 105 · Contabilidad y estados financieros</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="100.0" width="520.0" height="52.0" rx="8" fill="#DECEFA"/><text x="300.0" y="131.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Ventas netas</tspan></text><text x="596.0" y="131.0" font-size="14" text-anchor="start" fill="#7C3AED" font-weight="700"><tspan x="596.0" dy="0.0">$100 M</tspan></text><rect x="136.2" y="160.0" width="327.5" height="52.0" rx="8" fill="#C4A6F7"/><text x="300.0" y="191.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Margen bruto</tspan></text><text x="596.0" y="186.0" font-size="14" text-anchor="start" fill="#7C3AED" font-weight="700"><tspan x="596.0" dy="0.0">$45 M</tspan></text><text x="596.0" y="207.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 45 %</tspan></text><rect x="194.0" y="220.0" width="212.0" height="52.0" rx="8" fill="#AA7FF3"/><text x="300.0" y="251.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Resultado operacional</tspan></text><text x="596.0" y="246.0" font-size="14" text-anchor="start" fill="#7C3AED" font-weight="700"><tspan x="596.0" dy="0.0">$12 M</tspan></text><text x="596.0" y="267.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 27 %</tspan></text><rect x="201.0" y="280.0" width="198.0" height="52.0" rx="8" fill="#9058F0"/><text x="300.0" y="311.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">Resultado final</tspan></text><text x="596.0" y="306.0" font-size="14" text-anchor="start" fill="#7C3AED" font-weight="700"><tspan x="596.0" dy="0.0">$8 M</tspan></text><text x="596.0" y="327.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 67 %</tspan></text><rect x="30" y="216" width="720" height="60" rx="12" fill="none" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="6 4"/><text x="742.0" y="212.0" font-size="11" text-anchor="end" fill="#DC2626" font-weight="700"><tspan x="742.0" dy="0.0">cuello</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">105</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El inventario justo: ni se acaba ni se acumula</title><desc id="d">El inventario justo: ni se acaba ni se acumula. A la izquierda, con poco inventario, hay quiebres y ventas perdidas; a la derecha, mucho capital inmovilizado, merma y obsolescencia. El mínimo de la curva es el inventario objetivo.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El inventario justo: ni se acaba ni se acumula</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 110 · Contabilidad y estados financieros</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="96.0" y1="362.0" x2="664.0" y2="362.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><line x1="96.0" y1="362.0" x2="96.0" y2="92.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><text x="376.0" y="394.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="376.0" dy="0.0">Nivel de inventario mantenido</tspan></text><g transform="translate(66 231.0) rotate(-90)"><text x="0.0" y="0.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="0.0" dy="0.0">Costo total (quiebres más capital inmovilizado)</tspan></text></g><path d="M96.0,190.4 L105.3,198.5 L114.7,206.4 L124.0,214.0 L133.3,221.4 L142.7,228.4 L152.0,235.2 L161.3,241.7 L170.7,247.9 L180.0,253.9 L189.3,259.5 L198.7,264.9 L208.0,270.0 L217.3,274.9 L226.7,279.4 L236.0,283.7 L245.3,287.7 L254.7,291.5 L264.0,294.9 L273.3,298.1 L282.7,301.0 L292.0,303.6 L301.3,306.0 L310.7,308.1 L320.0,309.9 L329.3,311.4 L338.7,312.6 L348.0,313.6 L357.3,314.3 L366.7,314.7 L376.0,314.8 L385.3,314.7 L394.7,314.3 L404.0,313.6 L413.3,312.6 L422.7,311.4 L432.0,309.9 L441.3,308.1 L450.7,306.0 L460.0,303.6 L469.3,301.0 L478.7,298.1 L488.0,294.9 L497.3,291.5 L506.7,287.7 L516.0,283.7 L525.3,279.4 L534.7,274.9 L544.0,270.0 L553.3,264.9 L562.7,259.5 L572.0,253.9 L581.3,247.9 L590.7,241.7 L600.0,235.2 L609.3,228.4 L618.7,221.4 L628.0,214.0 L637.3,206.4 L646.7,198.5 L656.0,190.4" fill="none" stroke="#7C3AED" stroke-width="3.4" stroke-linecap="round"/><circle cx="376.0" cy="314.8" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/><text x="376.0" y="290.8" font-size="13" text-anchor="end" fill="#7C3AED" font-weight="700"><tspan x="376.0" dy="0.0">Inventario objetivo</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">110</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">¿Qué dice realmente tu balance?</title><desc id="d">¿Qué dice realmente tu balance?. Ubica tu empresa por liquidez y endeudamiento. Pero antes, verifica que las cifras sean reales: cuentas por cobrar antiguas sin provisión y activos sin uso inflan una posición que no existe.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">¿Qué dice realmente tu balance?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 104 · Contabilidad y estados financieros</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="150.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#E2D4FB" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">Deuda alta, poca caja</tspan></text><text x="164.0" y="148.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Riesgo de quiebra de liquidez:</tspan><tspan x="164.0" dy="15.4">negocia plazos antes de que</tspan><tspan x="164.0" dy="15.4">ocurra.</tspan></text><rect x="410.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#F2EBFD" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">Deuda alta, buena caja</tspan></text><text x="424.0" y="148.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Apalancada pero con colchón:</tspan><tspan x="424.0" dy="15.4">vigila el costo de la deuda.</tspan></text><rect x="150.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#EEF0F3" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">Deuda baja, poca caja</tspan></text><text x="164.0" y="293.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Sin presión de deuda, pero cuida</tspan><tspan x="164.0" dy="15.4">el capital de trabajo.</tspan></text><rect x="410.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#FDEED3" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">Deuda baja, buena caja</tspan></text><text x="424.0" y="293.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Posición cómoda: evalúa si hay</tspan><tspan x="424.0" dy="15.4">capital ocioso.</tspan></text><line x1="140.0" y1="396.0" x2="676.0" y2="396.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><line x1="140.0" y1="396.0" x2="140.0" y2="92.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><text x="410.0" y="420.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="410.0" dy="0.0">Liquidez (capacidad de pagar lo que vence pronto)</tspan></text><g transform="translate(88 241.0) rotate(-90)"><text x="0.0" y="0.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="0.0" dy="0.0">Endeudamiento (deuda sobre patrimonio)</tspan></text></g><text x="150.0" y="420.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="150.0" dy="0.0">bajo</tspan></text><text x="670.0" y="420.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="670.0" dy="0.0">alto</tspan></text><circle cx="306.0" cy="177.2" r="9" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/><text x="322.0" y="182.2" font-size="13" text-anchor="start" fill="#7C3AED" font-weight="700"><tspan x="322.0" dy="0.0">Tu empresa hoy</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">104</text></svg>

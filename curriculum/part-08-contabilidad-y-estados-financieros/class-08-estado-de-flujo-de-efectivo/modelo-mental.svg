<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Utilidad no es lo mismo que efectivo</title><desc id="d">Utilidad no es lo mismo que efectivo. Compara las dos barras. La diferencia entre ellas es el dinero que quedó en cuentas por cobrar, inventario o inversiones. Una brecha creciente es una señal de alerta.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Utilidad no es lo mismo que efectivo</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 106 · Contabilidad y estados financieros</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="144.0" y="149.9" width="192.0" height="200.1" rx="8" fill="#D1BAF9"/><text x="240.0" y="139.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="240.0" dy="0.0">30 M$</tspan></text><text x="240.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="240.0" dy="0.0">Utilidad del año</tspan></text><rect x="444.0" y="296.6" width="192.0" height="53.4" rx="8" fill="#7C3AED"/><text x="540.0" y="286.6" font-size="14" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="540.0" dy="0.0">8 M$</tspan></text><text x="540.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="540.0" dy="0.0">Flujo operacional del año</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">Si la utilidad crece y el flujo operacional no, la empresa financia su crecimiento con deuda o con</tspan><tspan x="56.0" dy="16.0">proveedores.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Millones de pesos (ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">106</text></svg>

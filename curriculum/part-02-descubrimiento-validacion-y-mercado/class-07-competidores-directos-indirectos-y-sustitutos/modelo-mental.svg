<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Contra quién compites en la decisión del cliente</title><desc id="d">Contra quién compites en la decisión del cliente. Cada satélite es una forma en que el cliente puede resolver su problema sin ti. Una matriz competitiva útil compara por los criterios con que el cliente decide, no por los atributos que a ti te gustaría destacar.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Contra quién compites en la decisión del cliente</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 21 · Descubrimiento, validación y mercado</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="380.0" y1="262.0" x2="380.0" y2="130.0" stroke="#A1CBB3" stroke-width="2"/><line x1="380.0" y1="262.0" x2="622.5" y2="221.2" stroke="#A1CBB3" stroke-width="2"/><line x1="380.0" y1="262.0" x2="529.9" y2="368.8" stroke="#A1CBB3" stroke-width="2"/><line x1="380.0" y1="262.0" x2="230.1" y2="368.8" stroke="#A1CBB3" stroke-width="2"/><line x1="380.0" y1="262.0" x2="137.5" y2="221.2" stroke="#A1CBB3" stroke-width="2"/><ellipse cx="380" cy="262" rx="78" ry="46" fill="#2E8B57"/><text x="380.0" y="266.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">Tu oferta</tspan></text><rect x="292.0" y="103.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.8"/><text x="380.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="380.0" dy="0.0">Competidor directo</tspan></text><text x="380.0" y="138.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Ofrece lo mismo al mismo</tspan><tspan x="380.0" dy="14.7">cliente</tspan></text><rect x="531.9" y="194.2" width="181.2" height="54.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.8"/><text x="622.5" y="213.2" font-size="13.5" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="622.5" dy="0.0">Competidor indirecto</tspan></text><text x="622.5" y="229.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="622.5" dy="0.0">Resuelve el mismo</tspan><tspan x="622.5" dy="14.7">problema de otra forma</tspan></text><rect x="441.9" y="341.8" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.8"/><text x="529.9" y="360.8" font-size="13.5" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="529.9" dy="0.0">Sustituto</tspan></text><text x="529.9" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="529.9" dy="0.0">Cambia la necesidad:</tspan><tspan x="529.9" dy="14.7">otro producto distinto</tspan></text><rect x="142.1" y="341.8" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.8"/><text x="230.1" y="360.8" font-size="13.5" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="230.1" dy="0.0">Statu quo</tspan></text><text x="230.1" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="230.1" dy="0.0">La planilla, el cuaderno</tspan><tspan x="230.1" dy="14.7">o no hacer nada</tspan></text><rect x="49.5" y="194.2" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.8"/><text x="137.5" y="213.2" font-size="13.5" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="137.5" dy="0.0">Quien podría entrar</tspan></text><text x="137.5" y="229.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="137.5" dy="0.0">Un actor que hoy no está</tspan><tspan x="137.5" dy="14.7">pero puede llegar</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">21</text></svg>

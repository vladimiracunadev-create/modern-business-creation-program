<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El precio como experimento: ¿dónde está el máximo?</title><desc id="d">El precio como experimento: ¿dónde está el máximo?. A precios bajos vendes mucho pero ganas poco por unidad; a precios altos ocurre al revés. El máximo del ingreso está entre ambos y solo se descubre probando niveles distintos.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El precio como experimento: ¿dónde está el máximo?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 27 · Descubrimiento, validación y mercado</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="96.0" y1="362.0" x2="664.0" y2="362.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><line x1="96.0" y1="362.0" x2="96.0" y2="92.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><text x="376.0" y="394.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="376.0" dy="0.0">Precio que pruebas</tspan></text><g transform="translate(66 231.0) rotate(-90)"><text x="0.0" y="0.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="0.0" dy="0.0">Ingreso total esperado</tspan></text></g><path d="M96.0,287.9 L105.3,275.3 L114.7,263.1 L124.0,251.4 L133.3,240.2 L142.7,229.4 L152.0,219.1 L161.3,209.3 L170.7,199.9 L180.0,191.1 L189.3,182.6 L198.7,174.7 L208.0,167.2 L217.3,160.1 L226.7,153.6 L236.0,147.5 L245.3,141.8 L254.7,136.6 L264.0,131.9 L273.3,127.7 L282.7,123.9 L292.0,120.6 L301.3,117.8 L310.7,115.4 L320.0,113.5 L329.3,112.1 L338.7,111.1 L348.0,110.6 L357.3,110.5 L366.7,110.9 L376.0,111.8 L385.3,113.2 L394.7,115.0 L404.0,117.3 L413.3,120.0 L422.7,123.2 L432.0,126.9 L441.3,131.1 L450.7,135.7 L460.0,140.7 L469.3,146.3 L478.7,152.3 L488.0,158.8 L497.3,165.7 L506.7,173.1 L516.0,181.0 L525.3,189.3 L534.7,198.1 L544.0,207.4 L553.3,217.1 L562.7,227.3 L572.0,238.0 L581.3,249.1 L590.7,260.7 L600.0,272.8 L609.3,285.3 L618.7,298.3 L628.0,311.8 L637.3,325.7 L646.7,335.8 L656.0,335.8" fill="none" stroke="#2E8B57" stroke-width="3.4" stroke-linecap="round"/><circle cx="353.6" cy="110.5" r="8" fill="#2E8B57" stroke="#FFFFFF" stroke-width="3"/><text x="353.6" y="86.5" font-size="13" text-anchor="end" fill="#2E8B57" font-weight="700"><tspan x="353.6" dy="0.0">Precio que maximiza el</tspan><tspan x="353.6" dy="16.6">ingreso</tspan></text><text x="140.8" y="348.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="140.8" dy="0.0">Muy barato: vendes mucho, ganas poco. Muy caro: ganas por unidad, vendes poco.</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">27</text></svg>

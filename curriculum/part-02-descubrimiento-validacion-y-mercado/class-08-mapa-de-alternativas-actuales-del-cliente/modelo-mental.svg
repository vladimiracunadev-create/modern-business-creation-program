<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">¿La mejora compensa el costo de cambiar?</title><desc id="d">¿La mejora compensa el costo de cambiar?. Compara las dos barras. La primera es la mejora que el cliente percibe; la segunda, todo lo que le costaría cambiar. Solo se vende cuando la primera supera con holgura a la segunda.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">¿La mejora compensa el costo de cambiar?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 22 · Descubrimiento, validación y mercado</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="144.0" y="204.5" width="192.0" height="145.5" rx="8" fill="#B6D6C4"/><text x="240.0" y="194.5" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="240.0" dy="0.0">40</tspan></text><text x="240.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="240.0" dy="0.0">Mejora que percibe el cliente</tspan></text><rect x="444.0" y="149.9" width="192.0" height="200.1" rx="8" fill="#2E8B57"/><text x="540.0" y="139.9" font-size="14" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="540.0" dy="0.0">55</tspan></text><text x="540.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="540.0" dy="0.0">Costo de cambiar (dinero, tiempo,</tspan><tspan x="540.0" dy="16.0">riesgo)</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">Si el costo de cambio supera la mejora, no hay venta aunque tu solución sea objetivamente mejor.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Valor percibido por el cliente (ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">22</text></svg>

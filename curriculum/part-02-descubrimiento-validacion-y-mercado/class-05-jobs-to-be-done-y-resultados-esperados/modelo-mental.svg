<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuándo un cliente «contrata» una solución</title><desc id="d">Cuándo un cliente «contrata» una solución. El ciclo muestra por qué se contrata una solución: algo cambia, lo actual empuja a buscar y el progreso se verifica después. Toda venta debe poder ubicarse en alguno de estos puntos.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuándo un cliente «contrata» una solución</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 19 · Descubrimiento, validación y mercado</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><circle cx="380" cy="252" r="128" fill="none" stroke="#B6D6C4" stroke-width="3" stroke-dasharray="3 7"/><path d="M380.0,124.0 Q485.7,151.7 556.5,212.4" fill="none" stroke="#2E8B57" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M556.5,212.4 Q546.2,289.2 489.1,355.6" fill="none" stroke="#2E8B57" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M489.1,355.6 Q380.0,379.6 270.9,355.6" fill="none" stroke="#2E8B57" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M270.9,355.6 Q213.8,289.2 203.5,212.4" fill="none" stroke="#2E8B57" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M203.5,212.4 Q274.3,151.7 380.0,124.0" fill="none" stroke="#2E8B57" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><rect x="301.4" y="98.0" width="157.2" height="52.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2"/><text x="380.0" y="120.2" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Circunstancia que</tspan><tspan x="380.0" dy="16.6">cambia</tspan></text><circle cx="303.4" cy="100.0" r="10" fill="#2E8B57"/><text x="303.4" y="104.0" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">1</text><rect x="477.9" y="186.4" width="157.2" height="52.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2"/><text x="556.5" y="208.7" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="556.5" dy="0.0">Empuje: lo actual</tspan><tspan x="556.5" dy="16.6">deja de servir</tspan></text><circle cx="479.9160894243804" cy="188.44582472000673" r="10" fill="#2E8B57"/><text x="479.9160894243804" y="192.44582472000673" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">2</text><rect x="429.5" y="329.6" width="119.2" height="52.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2"/><text x="489.1" y="351.8" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="489.1" dy="0.0">Búsqueda de</tspan><tspan x="489.1" dy="16.6">alternativas</tspan></text><circle cx="431.49294282548306" cy="331.5541752799933" r="10" fill="#2E8B57"/><text x="431.49294282548306" y="335.5541752799933" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">3</text><rect x="199.9" y="329.6" width="142.0" height="52.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2"/><text x="270.9" y="351.8" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="270.9" dy="0.0">Contratación de</tspan><tspan x="270.9" dy="16.6">una solución</tspan></text><circle cx="201.90705717451704" cy=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Del mercado total al que puedes alcanzar</title><desc id="d">Del mercado total al que puedes alcanzar. Cada barra es una porción más pequeña del mercado. La última (SOM) es la que importa para el plan: lo que realmente puedes captar con tu equipo, tu canal y tu caja (cifras ilustrativas).</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Del mercado total al que puedes alcanzar</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 20 · Descubrimiento, validación y mercado</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="100.0" width="520.0" height="52.0" rx="8" fill="#CBE2D5"/><text x="300.0" y="131.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">TAM: clínicas del país</tspan></text><text x="596.0" y="131.0" font-size="14" text-anchor="start" fill="#2E8B57" font-weight="700"><tspan x="596.0" dy="0.0">4.000</tspan></text><rect x="162.5" y="160.0" width="275.0" height="52.0" rx="8" fill="#8CBFA3"/><text x="300.0" y="191.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">SAM: las que tu oferta atiende</tspan></text><text x="596.0" y="191.0" font-size="14" text-anchor="start" fill="#2E8B57" font-weight="700"><tspan x="596.0" dy="0.0">1.200</tspan></text><text x="668.0" y="191.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 30 %</tspan></text><rect x="213.7" y="220.0" width="172.6" height="52.0" rx="8" fill="#4D9C70"/><text x="300.0" y="243.2" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">SOM: las que captas</tspan><tspan x="300.0" dy="16.6">en un año</tspan></text><text x="596.0" y="251.0" font-size="14" text-anchor="start" fill="#2E8B57" font-weight="700"><tspan x="596.0" dy="0.0">30</tspan></text><text x="668.0" y="251.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 2 %</tspan></text><rect x="30" y="216" width="720" height="60" rx="12" fill="none" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="6 4"/><text x="742.0" y="212.0" font-size="11" text-anchor="end" fill="#DC2626" font-weight="700"><tspan x="742.0" dy="0.0">cuello</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">20</text></svg>

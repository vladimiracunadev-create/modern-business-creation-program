<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Por qué el capital de riesgo exige un crecimiento extraordinario</title><desc id="d">Por qué el capital de riesgo exige un crecimiento extraordinario. Mira cómo se compone el retorno de un fondo: una apuesta enorme paga a todo el portafolio. Por eso un inversionista no se interesa en un negocio sano pero modesto, aunque sea rentable.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Por qué el capital de riesgo exige un crecimiento extraordinario</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 220 · Financiamiento, banca, fondos e inversión</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="126.0" y="149.9" width="128.0" height="200.1" rx="8" fill="#0F766E"/><text x="190.0" y="139.9" font-size="14" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="190.0" dy="0.0">20 x</tspan></text><text x="190.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="190.0" dy="0.0">Una apuesta que retorna 20</tspan><tspan x="190.0" dy="16.0">veces</tspan></text><rect x="326.0" y="290.0" width="128.0" height="60.0" rx="8" fill="#ABCFCC"/><text x="390.0" y="280.0" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="390.0" dy="0.0">6 x</tspan></text><text x="390.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="390.0" dy="0.0">Tres apuestas que retornan</tspan><tspan x="390.0" dy="16.0">2 veces</tspan></text><rect x="526.0" y="350.0" width="128.0" height="0.0" rx="8" fill="#ABCFCC"/><text x="590.0" y="340.0" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="590.0" dy="0.0">0 x</tspan></text><text x="590.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="590.0" dy="0.0">Seis apuestas que se</tspan><tspan x="590.0" dy="16.0">pierden</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">El modelo del fondo depende de pocos resultados extraordinarios; un negocio de crecimiento moderado no</tspan><tspan x="56.0" dy="16.0">calza con esa lógica.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Retorno sobre lo invertido, en veces (ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">220</text></svg>

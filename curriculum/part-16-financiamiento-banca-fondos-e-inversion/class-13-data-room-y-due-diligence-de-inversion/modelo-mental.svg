<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Qué se verifica antes de invertir, con evidencia independiente</title><desc id="d">Qué se verifica antes de invertir, con evidencia independiente. Cada satélite es una dimensión que verificar. La evidencia debe provenir de fuentes independientes: una cifra que solo informa quien se beneficia de ella no es una prueba.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Qué se verifica antes de invertir, con evidencia independiente</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 223 · Financiamiento, banca, fondos e inversión</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="380.0" y1="262.0" x2="380.0" y2="130.0" stroke="#93C1BE" stroke-width="2"/><line x1="380.0" y1="262.0" x2="600.8" y2="196.0" stroke="#93C1BE" stroke-width="2"/><line x1="380.0" y1="262.0" x2="600.8" y2="328.0" stroke="#93C1BE" stroke-width="2"/><line x1="380.0" y1="262.0" x2="380.0" y2="394.0" stroke="#93C1BE" stroke-width="2"/><line x1="380.0" y1="262.0" x2="159.2" y2="328.0" stroke="#93C1BE" stroke-width="2"/><line x1="380.0" y1="262.0" x2="159.2" y2="196.0" stroke="#93C1BE" stroke-width="2"/><ellipse cx="380" cy="262" rx="78" ry="46" fill="#0F766E"/><text x="380.0" y="257.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">Debida</tspan><tspan x="380.0" dy="17.9">diligencia</tspan></text><rect x="292.0" y="103.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="380.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="380.0" dy="0.0">Producto</tspan></text><text x="380.0" y="138.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Existe y funciona como</tspan><tspan x="380.0" dy="14.7">se presenta</tspan></text><rect x="512.8" y="169.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="600.8" y="188.0" font-size="13.5" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="600.8" dy="0.0">Entidad</tspan></text><text x="600.8" y="204.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="600.8" dy="0.0">Quién es, quién la</tspan><tspan x="600.8" dy="14.7">controla y su historia</tspan></text><rect x="512.8" y="301.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="600.8" y="320.0" font-size="13.5" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="600.8" dy="0.0">Fondos y custodia</tspan></text><text x="600.8" y="336.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="600.8" dy="0.0">Dónde están y quién los</tspan><tspan x="600.8" dy="14.7">verifica</tspan></text><rect x="292.0" y="367.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="380.0" y="386.0" font-size="13.5" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="380.0" dy="0.0">Rendimiento</tspan></text><text x="380.0" y="402.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Procedencia comprobada,</tspan><tspan x="380.0" dy="14.7">no solo informada</tspan></text><rect x="71.2" y="301.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="159.2" y="320.0" font-size="13.5" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="159.2" dy="0.0">Terceros y compliance</tspan></text><text x="159.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="159.2" dy="0.0">Proveedores, contratos y</tspan><tspan x="159.2" dy="14.7">cumplimiento</tspan></text><rect x="71.2" y="169.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="159.2" y="188.0" font-size="13.5" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="159.2" dy="0.0">Gobierno</tspan></text><text x="159.2" y="204.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="159.2" dy="0.0">Controles, directorio y</tspan><tspan x="159.2" dy="14.7">conflictos</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">223</text></svg>

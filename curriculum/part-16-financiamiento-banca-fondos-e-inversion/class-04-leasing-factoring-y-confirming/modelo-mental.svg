<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">¿Leasing, factoring, confirming o crédito?</title><desc id="d">¿Leasing, factoring, confirming o crédito?. Recorre el árbol según la necesidad. La pregunta de fondo es qué estás financiando y por cuánto tiempo. El instrumento correcto mantiene el calce; el incorrecto lo rompe.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">¿Leasing, factoring, confirming o crédito?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 214 · Financiamiento, banca, fondos e inversión</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="55.0" y="224.0" width="190.0" height="68.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="150.0" y="246.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="150.0" dy="0.0">Leasing: pagas el uso del</tspan><tspan x="150.0" dy="16.0">activo en cuotas calzadas</tspan><tspan x="150.0" dy="16.0">con su vida útil</tspan></text><rect x="285.0" y="336.0" width="190.0" height="84.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="380.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Factoring (como cliente)</tspan><tspan x="380.0" dy="16.0">o confirming (si eres el</tspan><tspan x="380.0" dy="16.0">comprador): compara el</tspan><tspan x="380.0" dy="16.0">costo efectivo anual</tspan></text><rect x="515.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="610.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="610.0" dy="0.0">Línea de crédito o</tspan><tspan x="610.0" dy="16.0">capital de trabajo con</tspan><tspan x="610.0" dy="16.0">plan de pago</tspan></text><line x1="495.0" y1="306.0" x2="380.0" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="425.5" y="319.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="425.5" dy="0.0">sí</tspan></text><line x1="495.0" y1="306.0" x2="610.0" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="564.5" y="319.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="564.5" dy="0.0">no</tspan></text><path d="M412.6,224 h164.8 a14,14 0 0 1 14,14 v54 a14,14 0 0 1 -14,14 h-164.8 a14,14 0 0 1 -14,-14 v-54 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.2"/><text x="495.0" y="244.6" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="495.0" dy="0.0">¿Tienes facturas por</tspan><tspan x="495.0" dy="16.6">cobrar a plazo que</tspan><tspan x="495.0" dy="16.6">necesitas convertir en</tspan><tspan x="495.0" dy="16.6">caja?</tspan></text><line x1="322.5" y1="178.0" x2="150.0" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="224.2" y="199.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="224.2" dy="0.0">sí</tspan></text><line x1="322.5" y1="178.0" x2="495.0" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="420.8" y="199.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="420.8" dy="0.0">no</tspan></text><path d="M236.39999999999998,112 h172.20000000000002 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-172.20000000000002 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.2"/><text x="322.5" y="132.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="322.5" dy="0.0">¿Necesitas financiar un</tspan><tspan x="322.5" dy="16.6">activo que usarás por</tspan><tspan x="322.5" dy="16.6">años?</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">214</text></svg>

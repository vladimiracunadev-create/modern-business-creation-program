<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Qué mercado eliges y qué carga trae</title><desc id="d">Qué mercado eliges y qué carga trae. Ubica el mercado al que quieres vender según cuánto tarda en cerrar una venta y cuánta regulación trae. Cada cuadrante exige un tipo distinto de caja, equipo y asesoría.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Qué mercado eliges y qué carga trae</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 12 · Fundamentos de empresa y mentalidad empresarial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="150.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#D1E5DA" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">B2C regulado</tspan></text><text x="164.0" y="148.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Venta rápida a personas con Ley</tspan><tspan x="164.0" dy="15.4">del Consumidor y datos personales.</tspan></text><rect x="410.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#EAF3EE" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">B2G o sectores regulados</tspan></text><text x="424.0" y="148.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Ciclo largo, garantías,</tspan><tspan x="424.0" dy="15.4">licitaciones y plazos propios.</tspan></text><rect x="150.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#EEF0F3" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">B2C o C2C simple</tspan></text><text x="164.0" y="293.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Ventas rápidas, poca regulación</tspan><tspan x="164.0" dy="15.4">específica; mucha competencia.</tspan></text><rect x="410.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#FDEED3" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">B2B de ciclo largo</tspan></text><text x="424.0" y="293.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Ventas con varios decisores;</tspan><tspan x="424.0" dy="15.4">contratos y capital de trabajo</tspan><tspan x="424.0" dy="15.4">mayores.</tspan></text><line x1="140.0" y1="396.0" x2="676.0" y2="396.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><line x1="140.0" y1="396.0" x2="140.0" y2="92.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><text x="410.0" y="420.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="410.0" dy="0.0">Largo del ciclo de venta</tspan></text><g transform="translate(88 241.0) rotate(-90)"><text x="0.0" y="0.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="0.0" dy="0.0">Carga regulatoria y de cumplimiento</tspan></text></g><text x="150.0" y="420.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="150.0" dy="0.0">bajo</tspan></text><text x="670.0" y="420.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="670.0" dy="0.0">alto</tspan></text><circle cx="524.4" cy="217.8" r="9" fill="#2E8B57" stroke="#FFFFFF" stroke-width="3"/><text x="540.4" y="222.8" font-size="13" text-anchor="start" fill="#2E8B57" font-weight="700"><tspan x="540.4" dy="0.0">Tu mercado</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">12</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuando pagas antes de cobrar</title><desc id="d">Cuando pagas antes de cobrar. La línea muestra cuándo sale y cuándo entra el dinero. El tramo entre el primer pago y el cobro es la caja que la empresa debe financiar por su cuenta.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuando pagas antes de cobrar</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 7 · Fundamentos de empresa y mentalidad empresarial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#2E8B57" stroke-width="4"/><circle cx="110.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="152.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="110.0" dy="0.0">Día 0</tspan></text><text x="110.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">Compras materiales y</tspan><tspan x="110.0" dy="16.0">pagas al proveedor</tspan></text><circle cx="290.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="290.0" y1="258.0" x2="290.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="290.0" y="312.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="290.0" dy="0.0">Día 15</tspan></text><text x="290.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="290.0" dy="0.0">Entregas el producto al</tspan><tspan x="290.0" dy="16.0">cliente</tspan></text><circle cx="470.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="470.0" y1="230.0" x2="470.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="470.0" y="152.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="470.0" dy="0.0">Día 30</tspan></text><text x="470.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="470.0" dy="0.0">Pagas sueldos y gastos</tspan><tspan x="470.0" dy="16.0">del mes</tspan></text><circle cx="650.0" cy="244" r="13" fill="#2E8B57" stroke="#2E8B57" stroke-width="3"/><line x1="650.0" y1="258.0" x2="650.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="312.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="650.0" dy="0.0">Día 60</tspan></text><text x="650.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="650.0" dy="0.0">El cliente paga tu</tspan><tspan x="650.0" dy="16.0">factura</tspan></text><text x="380.0" y="420.0" font-size="12" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">Entre el día 0 y el día 60 financias la operación con tu propia caja: ese es el capital de trabajo.</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">7</text></svg>

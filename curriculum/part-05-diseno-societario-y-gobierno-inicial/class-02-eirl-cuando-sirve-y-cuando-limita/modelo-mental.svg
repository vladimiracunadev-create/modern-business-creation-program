<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">¿EIRL, SpA o seguir como persona natural?</title><desc id="d">¿EIRL, SpA o seguir como persona natural?. Responde las preguntas en orden. La primera separa a quienes tendrán socios de quienes no; la segunda mide cuánto necesitas proteger tu patrimonio. Revisa la respuesta cada vez que cambie tu plan de crecimiento.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2563EB"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">¿EIRL, SpA o seguir como persona natural?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 58 · Diseño societario y gobierno inicial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="55.0" y="224.0" width="190.0" height="68.0" rx="10" fill="#DCE6FC" stroke="#2563EB" stroke-width="1.6"/><text x="150.0" y="246.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="150.0" dy="0.0">SpA: admite varios</tspan><tspan x="150.0" dy="16.0">accionistas, series y</tspan><tspan x="150.0" dy="16.0">aumentos de capital</tspan></text><rect x="285.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#DCE6FC" stroke="#2563EB" stroke-width="1.6"/><text x="380.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">EIRL o SpA con un solo</tspan><tspan x="380.0" dy="16.0">accionista; la SpA no</tspan><tspan x="380.0" dy="16.0">tiene techo de socios</tspan></text><rect x="515.0" y="336.0" width="190.0" height="52.0" rx="10" fill="#DCE6FC" stroke="#2563EB" stroke-width="1.6"/><text x="610.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="610.0" dy="0.0">Persona natural, mientras</tspan><tspan x="610.0" dy="16.0">el riesgo sea bajo</tspan></text><line x1="495.0" y1="274.0" x2="380.0" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="425.5" y="303.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="425.5" dy="0.0">sí</tspan></text><line x1="495.0" y1="274.0" x2="610.0" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="564.5" y="303.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="564.5" dy="0.0">no</tspan></text><path d="M416.3,224 h157.4 a14,14 0 0 1 14,14 v22 a14,14 0 0 1 -14,14 h-157.4 a14,14 0 0 1 -14,-14 v-22 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/><text x="495.0" y="245.2" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="495.0" dy="0.0">¿Necesitas limitar tu</tspan><tspan x="495.0" dy="16.6">responsabilidad?</tspan></text><line x1="322.5" y1="162.0" x2="150.0" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="224.2" y="191.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="224.2" dy="0.0">sí</tspan></text><line x1="322.5" y1="162.0" x2="495.0" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="420.8" y="191.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="420.8" dy="0.0">no</tspan></text><path d="M229.0,112 h187.0 a14,14 0 0 1 14,14 v22 a14,14 0 0 1 -14,14 h-187.0 a14,14 0 0 1 -14,-14 v-22 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/><text x="322.5" y="133.2" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="322.5" dy="0.0">¿Habrá más de un dueño o</tspan><tspan x="322.5" dy="16.6">entrará un inversionista?</tspan></text><circle cx="720" cy="40" r="14" fill="#E5ECFD" stroke="#B3C8F8"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">58</text></svg>

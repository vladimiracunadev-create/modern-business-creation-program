<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuatro preguntas para elegir la forma societaria</title><desc id="d">Cuatro preguntas para elegir la forma societaria. Recorre las preguntas en orden y deja constancia de cada respuesta. La decisión final es consecuencia de las cuatro, no de una moda ni de la costumbre.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2563EB"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuatro preguntas para elegir la forma societaria</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 63 · Diseño societario y gobierno inicial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="35.0" y="160.0" width="102.8" height="118.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><circle cx="51.0" cy="160" r="12" fill="#2563EB"/><text x="51.0" y="164.5" font-size="12" text-anchor="middle" fill="#FFF" font-weight="800">1</text><text x="86.4" y="219.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="86.4" dy="0.0">¿Cuántos</tspan><tspan x="86.4" dy="16.0">dueños habrá?</tspan></text><rect x="181.8" y="160.0" width="102.8" height="118.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><circle cx="197.8" cy="160" r="12" fill="#2563EB"/><text x="197.8" y="164.5" font-size="12" text-anchor="middle" fill="#FFF" font-weight="800">2</text><text x="233.2" y="211.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="233.2" dy="0.0">¿Entrará</tspan><tspan x="233.2" dy="16.0">capital</tspan><tspan x="233.2" dy="16.0">externo?</tspan></text><line x1="141.8" y1="219.0" x2="178.8" y2="219.0" stroke="#2563EB" stroke-width="2.2" marker-end="url(#fl)"/><rect x="328.6" y="160.0" width="102.8" height="118.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><circle cx="344.6" cy="160" r="12" fill="#2563EB"/><text x="344.6" y="164.5" font-size="12" text-anchor="middle" fill="#FFF" font-weight="800">3</text><text x="380.0" y="203.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">¿Qué</tspan><tspan x="380.0" dy="16.0">exposición</tspan><tspan x="380.0" dy="16.0">patrimonial</tspan><tspan x="380.0" dy="16.0">aceptas?</tspan></text><line x1="288.6" y1="219.0" x2="325.6" y2="219.0" stroke="#2563EB" stroke-width="2.2" marker-end="url(#fl)"/><rect x="475.4" y="160.0" width="102.8" height="118.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><circle cx="491.40000000000003" cy="160" r="12" fill="#2563EB"/><text x="491.40000000000003" y="164.5" font-size="12" text-anchor="middle" fill="#FFF" font-weight="800">4</text><text x="526.8" y="211.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="526.8" dy="0.0">¿Qué régimen</tspan><tspan x="526.8" dy="16.0">tributario</tspan><tspan x="526.8" dy="16.0">conviene?</tspan></text><line x1="435.4" y1="219.0" x2="472.4" y2="219.0" stroke="#2563EB" stroke-width="2.2" marker-end="url(#fl)"/><rect x="622.2" y="160.0" width="102.8" height="118.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><circle cx="638.2" cy="160" r="12" fill="#2563EB"/><text x="638.2" y="164.5" font-size="12" text-anchor="middle" fill="#FFF" font-weight="800">5</text><
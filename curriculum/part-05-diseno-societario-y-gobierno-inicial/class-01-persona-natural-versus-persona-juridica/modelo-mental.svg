<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Operar a tu nombre o a través de una sociedad</title><desc id="d">Operar a tu nombre o a través de una sociedad. Compara los dos platos: a la izquierda están la simplicidad y el riesgo personal; a la derecha, la protección patrimonial y la formalidad. No hay plato correcto: depende del riesgo de tu actividad.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2563EB"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Operar a tu nombre o a través de una sociedad</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 57 · Diseño societario y gobierno inicial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="96.0" width="316.0" height="214.0" rx="14" fill="#FEF3E2" stroke="#F59E0B" stroke-width="2"/><text x="60.0" y="134.0" font-size="16" text-anchor="start" fill="#B45309" font-weight="700"><tspan x="60.0" dy="0.0">Persona natural</tspan></text><circle cx="64" cy="164" r="3.4" fill="#F59E0B"/><text x="78.0" y="168.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="78.0" dy="0.0">Simple y barato: boleta de honorarios</tspan></text><circle cx="64" cy="192" r="3.4" fill="#F59E0B"/><text x="78.0" y="196.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="78.0" dy="0.0">Respondes con todo tu patrimonio</tspan><tspan x="78.0" dy="16.6">personal</tspan></text><circle cx="64" cy="238" r="3.4" fill="#F59E0B"/><text x="78.0" y="242.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="78.0" dy="0.0">Cuesta acceder a clientes grandes y a</tspan><tspan x="78.0" dy="16.6">crédito</tspan></text><rect x="404.0" y="96.0" width="316.0" height="214.0" rx="14" fill="#E5ECFD" stroke="#2563EB" stroke-width="2"/><text x="424.0" y="134.0" font-size="16" text-anchor="start" fill="#2563EB" font-weight="700"><tspan x="424.0" dy="0.0">Persona jurídica</tspan></text><circle cx="428" cy="164" r="3.4" fill="#2563EB"/><text x="442.0" y="168.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="442.0" dy="0.0">Patrimonio de la sociedad separado del</tspan><tspan x="442.0" dy="16.6">tuyo</tspan></text><circle cx="428" cy="210" r="3.4" fill="#2563EB"/><text x="442.0" y="214.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="442.0" dy="0.0">Facilita socios, crédito y contratos</tspan><tspan x="442.0" dy="16.6">grandes</tspan></text><circle cx="428" cy="256" r="3.4" fill="#2563EB"/><text x="442.0" y="260.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="442.0" dy="0.0">Exige formalidad, contabilidad y</tspan><tspan x="442.0" dy="16.6">gobierno</tspan></text><circle cx="380" cy="203" r="22" fill="#1F2937"/><text x="380.0" y="208.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">vs</tspan></text><rect x="40.0" y="326.0" width="680.0" height="90.0" rx="12" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.6"/><text x="60.0" y="350.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="60.0" dy="0.0">Criterio de decisión</tspan></text><text x="60.0" y="376.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="60.0" dy="0.0">Pasa a una sociedad cuando el riesgo de la actividad o el tamaño de los clientes</tspan><tspan x="60.0" dy="19.2">supera lo que tu patrimonio personal debería arriesgar.</tspan></text><circle cx="720" cy="40" r="14" fill="#E5ECFD" stroke="#B3C8F8"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">57</text></svg>

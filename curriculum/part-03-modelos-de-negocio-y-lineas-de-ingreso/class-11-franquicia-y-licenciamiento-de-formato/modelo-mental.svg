<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuándo una empresa está lista para franquiciar</title><desc id="d">Cuándo una empresa está lista para franquiciar. Cada peldaño es una condición que debe cumplirse antes de subir. Saltarse uno traslada el riesgo al franquiciado y daña la marca que se quería expandir.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuándo una empresa está lista para franquiciar</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 39 · Modelos de negocio y líneas de ingreso</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="126.0" height="120.0" rx="10" fill="#EAF3EE"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#2E8B57" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Unidad propia</tspan><tspan x="54.0" dy="17.9">rentable</tspan></text><text x="54.0" y="374.0" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="54.0" dy="0.0">Gana dinero con</tspan><tspan x="54.0" dy="15.4">dueño y equipo</tspan><tspan x="54.0" dy="15.4">propio</tspan></text><rect x="174.0" y="237.5" width="126.0" height="162.5" rx="10" fill="#D0E5D9"/><text x="188.0" y="265.5" font-size="22" text-anchor="start" fill="#2E8B57" font-weight="800"><tspan x="188.0" dy="0.0">2</tspan></text><text x="188.0" y="289.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="188.0" dy="0.0">Manual probado</tspan></text><text x="188.0" y="313.5" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="188.0" dy="0.0">Un tercero puede</tspan><tspan x="188.0" dy="15.4">seguirlo</tspan></text><rect x="308.0" y="195.0" width="126.0" height="205.0" rx="10" fill="#B6D6C4"/><text x="322.0" y="223.0" font-size="22" text-anchor="start" fill="#2E8B57" font-weight="800"><tspan x="322.0" dy="0.0">3</tspan></text><text x="322.0" y="247.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="322.0" dy="0.0">Segunda unidad</tspan><tspan x="322.0" dy="17.9">propia</tspan></text><text x="322.0" y="289.0" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="322.0" dy="0.0">Funciona sin el</tspan><tspan x="322.0" dy="15.4">fundador</tspan></text><rect x="442.0" y="152.5" width="126.0" height="247.5" rx="10" fill="#9CC8AF"/><text x="456.0" y="180.5" font-size="22" text-anchor="start" fill="#2E8B57" font-weight="800"><tspan x="456.0" dy="0.0">4</tspan></text><text x="456.0" y="204.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="456.0" dy="0.0">Piloto</tspan><tspan x="456.0" dy="17.9">franquiciado</tspan></text><text x="456.0" y="246.5" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="456.0" dy="0.0">Una unidad con</tspan><tspan x="456.0" dy="15.4">contrato de prueba</tspan></text><rect x="576.0" y="110.0" width="126.0" height="290.0" rx="10" fill="#82B99A"/><text x="590.0" y="138.0" font-size="22" text-anchor="start" fill="#2E8B57" font-weight="800"><tspan x="590.0" dy="0.0">5</tspan></text><text x="590.0" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="590.0" dy="0.0">Red</tspan></text><text x="590.0" y="186.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="590.0" dy="0.0">Control de marca y</tspan><tspan x="590.0" dy="15.4">apoyo a la red</tspan></text><line x1="48.0" y1="412.0" x2="720.0" y2="412.0" stroke="#2E8B57" stroke-width="2.4" marker-end="url(#fl)"/><text x="716.0" y="430.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="716.0" dy="0.0">Más replicable, más riesgo de marca</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">39</text></svg>

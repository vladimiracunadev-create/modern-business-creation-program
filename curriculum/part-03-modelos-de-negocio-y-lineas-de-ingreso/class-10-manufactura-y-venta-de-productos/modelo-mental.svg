<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El ciclo de caja de una fábrica pequeña</title><desc id="d">El ciclo de caja de una fábrica pequeña. La línea muestra cuánto tarda el dinero en volver. Cada hito inmoviliza capital hasta el cobro. El lote mínimo suele ser la variable que decide cuánto se inmoviliza en el primer tramo.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El ciclo de caja de una fábrica pequeña</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 38 · Modelos de negocio y líneas de ingreso</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#2E8B57" stroke-width="4"/><circle cx="110.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="136.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="110.0" dy="0.0">Día 0</tspan></text><text x="110.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">Compra materia</tspan><tspan x="110.0" dy="16.0">prima en lote</tspan><tspan x="110.0" dy="16.0">mínimo</tspan></text><circle cx="245.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="245.0" y1="258.0" x2="245.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="245.0" y="312.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="245.0" dy="0.0">Día 20</tspan></text><text x="245.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="245.0" dy="0.0">Producción:</tspan><tspan x="245.0" dy="16.0">producto en</tspan><tspan x="245.0" dy="16.0">proceso</tspan></text><circle cx="380.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="380.0" y1="230.0" x2="380.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="380.0" y="152.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="380.0" dy="0.0">Día 40</tspan></text><text x="380.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="380.0" dy="0.0">Producto terminado</tspan><tspan x="380.0" dy="16.0">en bodega</tspan></text><circle cx="515.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="515.0" y1="258.0" x2="515.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="515.0" y="312.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="515.0" dy="0.0">Día 60</tspan></text><text x="515.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="515.0" dy="0.0">Entrega al cliente</tspan><tspan x="515.0" dy="16.0">y factura</tspan></text><circle cx="650.0" cy="244" r="13" fill="#2E8B57" stroke="#2E8B57" stroke-width="3"/><line x1="650.0" y1="230.0" x2="650.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="168.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="650.0" dy="0.0">Día 90</tspan></text><text x="650.0" y="186.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="650.0" dy="0.0">Cobro de la venta</tspan></text><text x="380.0" y="420.0" font-size="12" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">Entre la compra y el cobro pasan 90 días: esa caja inmovilizada es el costo de producir.</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">38</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">De cada pedido, ¿cuánto te queda realmente?</title><desc id="d">De cada pedido, ¿cuánto te queda realmente?. Cada barra es lo que queda de la venta tras un costo. La última es lo que aporta el pedido para pagar marketing y gastos fijos. Si es menor que el costo de captar al cliente, vender más pierde dinero (cifras ilustrativas).</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">De cada pedido, ¿cuánto te queda realmente?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 33 · Modelos de negocio y líneas de ingreso</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="100.0" width="520.0" height="52.0" rx="8" fill="#CBE2D5"/><text x="300.0" y="131.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Venta por pedido</tspan></text><text x="596.0" y="131.0" font-size="14" text-anchor="start" fill="#2E8B57" font-weight="700"><tspan x="596.0" dy="0.0">$30.000</tspan></text><rect x="101.2" y="160.0" width="397.5" height="52.0" rx="8" fill="#A1CBB3"/><text x="300.0" y="191.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Tras costo del producto</tspan></text><text x="596.0" y="191.0" font-size="14" text-anchor="start" fill="#2E8B57" font-weight="700"><tspan x="596.0" dy="0.0">$19.500</tspan></text><text x="668.0" y="191.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 65 %</tspan></text><rect x="129.2" y="220.0" width="341.5" height="52.0" rx="8" fill="#77B492"/><text x="300.0" y="251.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Tras despacho y embalaje</tspan></text><text x="596.0" y="251.0" font-size="14" text-anchor="start" fill="#2E8B57" font-weight="700"><tspan x="596.0" dy="0.0">$14.700</tspan></text><text x="668.0" y="251.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 75 %</tspan></text><rect x="146.8" y="280.0" width="306.5" height="52.0" rx="8" fill="#4D9C70"/><text x="300.0" y="303.2" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">Contribución tras pasarela y</tspan><tspan x="300.0" dy="16.6">devoluciones</tspan></text><text x="596.0" y="311.0" font-size="14" text-anchor="start" fill="#2E8B57" font-weight="700"><tspan x="596.0" dy="0.0">$11.700</tspan></text><text x="668.0" y="311.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 80 %</tspan></text><rect x="30" y="276" width="720" height="60" rx="12" fill="none" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="6 4"/><text x="742.0" y="272.0" font-size="11" text-anchor="end" fill="#DC2626" font-weight="700"><tspan x="742.0" dy="0.0">cuello</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">33</text></svg>

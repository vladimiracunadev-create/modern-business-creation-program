<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El orden correcto antes de automatizar</title><desc id="d">El orden correcto antes de automatizar. Cada peldaño prepara al siguiente. Saltarse alguno hace que la automatización reproduzca el desorden a mayor velocidad.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El orden correcto antes de automatizar</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 182 · Operaciones, compras, inventario y calidad</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="159.5" height="120.0" rx="10" fill="#E7F1F0"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Estandarizar</tspan></text><text x="54.0" y="356.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="54.0" dy="0.0">Un solo modo de</tspan><tspan x="54.0" dy="15.4">hacerlo</tspan></text><rect x="207.5" y="223.3" width="159.5" height="176.7" rx="10" fill="#BFDAD8"/><text x="221.5" y="251.3" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="221.5" dy="0.0">2</tspan></text><text x="221.5" y="275.3" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="221.5" dy="0.0">Medir</tspan></text><text x="221.5" y="299.3" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="221.5" dy="0.0">Datos de tiempos,</tspan><tspan x="221.5" dy="15.4">errores y costos</tspan></text><rect x="375.0" y="166.7" width="159.5" height="233.3" rx="10" fill="#97C4C0"/><text x="389.0" y="194.7" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="389.0" dy="0.0">3</tspan></text><text x="389.0" y="218.7" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="389.0" dy="0.0">Simplificar</tspan></text><text x="389.0" y="242.7" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="389.0" dy="0.0">Eliminar pasos que no</tspan><tspan x="389.0" dy="15.4">agregan valor</tspan></text><rect x="542.5" y="110.0" width="159.5" height="290.0" rx="10" fill="#6FADA8"/><text x="556.5" y="138.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="556.5" dy="0.0">4</tspan></text><text x="556.5" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="556.5" dy="0.0">Automatizar</tspan></text><text x="556.5" y="186.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="556.5" dy="0.0">Recién entonces, lo</tspan><tspan x="556.5" dy="15.4">que ya funciona</tspan></text><line x1="48.0" y1="412.0" x2="720.0" y2="412.0" stroke="#0F766E" stroke-width="2.4" marker-end="url(#fl)"/><text x="716.0" y="430.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="716.0" dy="0.0">Cada peldaño prepara al siguiente</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">182</text></svg>

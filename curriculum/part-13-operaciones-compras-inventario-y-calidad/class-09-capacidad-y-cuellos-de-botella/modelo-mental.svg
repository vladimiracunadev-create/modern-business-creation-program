<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">La etapa que limita toda la producción</title><desc id="d">La etapa que limita toda la producción. Cada barra es la capacidad de una etapa. La más baja, la pintura, limita a toda la línea. Duplicar el corte no cambiaría nada: se llenaría la bodega de piezas sin pintar.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">La etapa que limita toda la producción</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 177 · Operaciones, compras, inventario y calidad</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="117.0" y="149.9" width="96.0" height="200.1" rx="8" fill="#ABCFCC"/><text x="165.0" y="139.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="165.0" dy="0.0">100 u/día</tspan></text><text x="165.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="165.0" dy="0.0">Corte</tspan></text><rect x="267.0" y="230.0" width="96.0" height="120.0" rx="8" fill="#ABCFCC"/><text x="315.0" y="220.0" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="315.0" dy="0.0">60 u/día</tspan></text><text x="315.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="315.0" dy="0.0">Armado</tspan></text><rect x="417.0" y="270.0" width="96.0" height="80.0" rx="8" fill="#0F766E"/><text x="465.0" y="260.0" font-size="14" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="465.0" dy="0.0">40 u/día</tspan></text><text x="465.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="465.0" dy="0.0">Pintura (cuello)</tspan></text><rect x="567.0" y="169.9" width="96.0" height="180.1" rx="8" fill="#ABCFCC"/><text x="615.0" y="159.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="615.0" dy="0.0">90 u/día</tspan></text><text x="615.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="615.0" dy="0.0">Embalaje</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">Toda la línea produce lo que permite la etapa más lenta: mejorar otra solo acumula inventario en</tspan><tspan x="56.0" dy="16.0">proceso.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Capacidad por etapa, unidades por día (ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">177</text></svg>

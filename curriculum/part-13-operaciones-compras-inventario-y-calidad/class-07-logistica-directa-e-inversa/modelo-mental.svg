<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuánto cuesta una devolución frente al margen del pedido</title><desc id="d">Cuánto cuesta una devolución frente al margen del pedido. Cada barra resta un costo del margen original. La última muestra que, tras todas las etapas, la devolución puede dejar pérdida. Por eso la política de cambios debe diseñarse con su costo a la vista (cifras ilustrativas).</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuánto cuesta una devolución frente al margen del pedido</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 175 · Operaciones, compras, inventario y calidad</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="100.0" width="520.0" height="52.0" rx="8" fill="#C3DDDB"/><text x="300.0" y="131.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Margen del pedido</tspan></text><text x="596.0" y="131.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">$9.000</tspan></text><rect x="108.2" y="160.0" width="383.5" height="52.0" rx="8" fill="#93C1BE"/><text x="300.0" y="191.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Menos transporte de vuelta</tspan></text><text x="596.0" y="186.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">$5.500</tspan></text><text x="596.0" y="207.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 61 %</tspan></text><rect x="166.0" y="220.0" width="268.0" height="52.0" rx="8" fill="#63A6A1"/><text x="300.0" y="251.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Menos revisión y reacondicionado</tspan></text><text x="596.0" y="246.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">$2.500</tspan></text><text x="596.0" y="267.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 46 %</tspan></text><rect x="201.0" y="280.0" width="198.0" height="52.0" rx="8" fill="#338B84"/><text x="300.0" y="303.2" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">Menos pérdida de valor</tspan><tspan x="300.0" dy="16.6">del producto</tspan></text><text x="596.0" y="306.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">-$1.000</tspan></text><text x="596.0" y="327.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 29 %</tspan></text><rect x="30" y="276" width="720" height="60" rx="12" fill="none" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="6 4"/><text x="742.0" y="272.0" font-size="11" text-anchor="end" fill="#DC2626" font-weight="700"><tspan x="742.0" dy="0.0">cuello</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">175</text></svg>

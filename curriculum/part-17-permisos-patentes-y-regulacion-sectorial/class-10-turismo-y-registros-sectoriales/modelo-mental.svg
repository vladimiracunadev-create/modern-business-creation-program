<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Qué exige un servicio turístico según su riesgo</title><desc id="d">Qué exige un servicio turístico según su riesgo. Ubica tu servicio según el riesgo para los clientes. A más riesgo, mayor formalidad y normas técnicas. Operar actividades de riesgo sin las exigencias puede poner en peligro a personas.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Qué exige un servicio turístico según su riesgo</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 234 · Permisos, patentes y regulación sectorial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="150.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#CAE1DF" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">Bajo riesgo, muchas</tspan><tspan x="164.0" dy="19.2">exigencias</tspan></text><text x="164.0" y="166.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Alojamiento y gastronomía:</tspan><tspan x="164.0" dy="15.4">inscripción y normas sanitarias y</tspan><tspan x="164.0" dy="15.4">municipales.</tspan></text><rect x="410.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#E7F1F0" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">Alto riesgo, muchas</tspan><tspan x="424.0" dy="19.2">exigencias</tspan></text><text x="424.0" y="166.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Turismo aventura: registro, normas</tspan><tspan x="424.0" dy="15.4">técnicas, equipos y seguros.</tspan></text><rect x="150.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#EEF0F3" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">Bajo riesgo, pocas</tspan><tspan x="164.0" dy="19.2">exigencias</tspan></text><text x="164.0" y="311.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Guías y servicios de información:</tspan><tspan x="164.0" dy="15.4">inscripción en el registro.</tspan></text><rect x="410.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#FDEED3" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">Alto riesgo, pocas</tspan><tspan x="424.0" dy="19.2">exigencias</tspan></text><text x="424.0" y="311.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Zona peligrosa: aunque falte una</tspan><tspan x="424.0" dy="15.4">norma específica, refuerza</tspan><tspan x="424.0" dy="15.4">protocolos y seguros.</tspan></text><line x1="140.0" y1="396.0" x2="676.0" y2="396.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><line x1="140.0" y1="396.0" x2="140.0" y2="92.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><text x="410.0" y="420.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="410.0" dy="0.0">Riesgo para la seguridad de los clientes</tspan></text><g transform="translate(88 241.0) rotate(-90)"><text x="0.0" y="0.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="0.0" dy="0.0">Cantidad de exigencias formales</tspan></text></g><text x="150.0" y="420.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="150.0" dy="0.0">bajo</tspan></text><text x="670.0" y="420.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="670.0" dy="0.0">alto</tspan></text><circle cx="566.0" cy="154.0" r="9" fill="#0F766E" stroke="#FFFFFF" stroke-width="3"/><text x="582.0" y="159.0" font-size="13" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="582.0" dy="0.0">Ejemplo: rafting</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">234</text></svg>

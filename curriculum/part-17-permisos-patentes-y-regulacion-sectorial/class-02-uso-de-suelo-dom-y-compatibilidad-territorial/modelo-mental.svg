<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Antes de firmar el arriendo: ¿se puede ejercer allí?</title><desc id="d">Antes de firmar el arriendo: ¿se puede ejercer allí?. Responde en orden con documentos y no con promesas del arrendador. El uso de suelo es la primera barrera; la recepción definitiva, la segunda. Si falla una, el negocio no puede abrir legalmente.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Antes de firmar el arriendo: ¿se puede ejercer allí?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 226 · Permisos, patentes y regulación sectorial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="55.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="150.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="150.0" dy="0.0">Puedes seguir con la</tspan><tspan x="150.0" dy="16.0">patente y los permisos</tspan><tspan x="150.0" dy="16.0">sectoriales</tspan></text><rect x="285.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="380.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Riesgo alto: sin</tspan><tspan x="380.0" dy="16.0">recepción no se obtiene</tspan><tspan x="380.0" dy="16.0">la patente</tspan></text><line x1="265.0" y1="274.0" x2="150.0" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="195.5" y="303.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="195.5" dy="0.0">sí</tspan></text><line x1="265.0" y1="274.0" x2="380.0" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="334.5" y="303.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="334.5" dy="0.0">no</tspan></text><path d="M186.3,224 h157.4 a14,14 0 0 1 14,14 v22 a14,14 0 0 1 -14,14 h-157.4 a14,14 0 0 1 -14,-14 v-22 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.2"/><text x="265.0" y="245.2" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="265.0" dy="0.0">¿El inmueble tiene</tspan><tspan x="265.0" dy="16.6">recepción definitiva?</tspan></text><rect x="515.0" y="224.0" width="190.0" height="68.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="610.0" y="246.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="610.0" dy="0.0">No firmes: busca otro</tspan><tspan x="610.0" dy="16.0">predio o evalúa un cambio</tspan><tspan x="610.0" dy="16.0">de destino con asesoría</tspan></text><line x1="437.5" y1="194.0" x2="265.0" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="339.2" y="207.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="339.2" dy="0.0">sí</tspan></text><line x1="437.5" y1="194.0" x2="610.0" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="535.8" y="207.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="535.8" dy="0.0">no</tspan></text><path d="M340.3,112 h194.4 a14,14 0 0 1 14,14 v54 a14,14 0 0 1 -14,14 h-194.4 a14,14 0 0 1 -14,-14 v-54 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.2"/><text x="437.5" y="132.6" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="437.5" dy="0.0">¿El certificado de</tspan><tspan x="437.5" dy="16.6">informaciones previas</tspan><tspan x="437.5" dy="16.6">admite tu actividad en ese</tspan><tspan x="437.5" dy="16.6">predio?</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">226</text></svg>

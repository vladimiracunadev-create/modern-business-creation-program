<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Lo que debe resolver el diseño de un local de alimentos</title><desc id="d">Lo que debe resolver el diseño de un local de alimentos. Cada capa es una condición del local. Corregirlas después de construir cuesta mucho más que incorporarlas desde los planos; por eso se revisan antes de arrendar y remodelar.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Lo que debe resolver el diseño de un local de alimentos</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 229 · Permisos, patentes y regulación sectorial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="140.0" y="100.0" width="300.0" height="64.0" rx="10" fill="#D4E6E5"/><text x="290.0" y="137.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">Superficies lavables</tspan></text><text x="560.0" y="129.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Pisos, muros y mesones</tspan><tspan x="560.0" dy="16.0">fáciles de limpiar</tspan></text><line x1="446.0" y1="132.0" x2="552.0" y2="132.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="106.7" y="170.0" width="366.7" height="64.0" rx="10" fill="#A2CAC7"/><text x="290.0" y="207.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">Separación de áreas</tspan></text><text x="560.0" y="199.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Cocina, bodega, servicios</tspan><tspan x="560.0" dy="16.0">y zonas limpias y sucias</tspan></text><line x1="479.3" y1="202.0" x2="552.0" y2="202.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="73.3" y="240.0" width="433.3" height="64.0" rx="10" fill="#71AEA9"/><text x="290.0" y="277.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="290.0" dy="0.0">Agua potable y servicios</tspan></text><text x="560.0" y="269.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Suministro seguro y</tspan><tspan x="560.0" dy="16.0">evacuación adecuada</tspan></text><line x1="512.7" y1="272.0" x2="552.0" y2="272.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="40.0" y="310.0" width="500.0" height="64.0" rx="10" fill="#3F918B"/><text x="290.0" y="347.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="290.0" dy="0.0">Control de plagas y manipuladores</tspan></text><text x="560.0" y="339.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Procedimientos y personal</tspan><tspan x="560.0" dy="16.0">capacitado</tspan></text><line x1="546.0" y1="342.0" x2="552.0" y2="342.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">229</text></svg>

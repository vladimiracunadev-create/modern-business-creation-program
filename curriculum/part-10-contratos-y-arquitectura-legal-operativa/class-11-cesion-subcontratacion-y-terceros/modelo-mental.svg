<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Quién responde cuando se subcontrata</title><desc id="d">Quién responde cuando se subcontrata. El centro es tu contrato y los satélites son quienes quedan conectados a él. Cada subcontratación añade un eslabón que también puede reclamar o responder.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#C2410C"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Quién responde cuando se subcontrata</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 137 · Contratos y arquitectura legal operativa</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="380.0" y1="262.0" x2="380.0" y2="130.0" stroke="#E4AA92" stroke-width="2"/><line x1="380.0" y1="262.0" x2="622.5" y2="221.2" stroke="#E4AA92" stroke-width="2"/><line x1="380.0" y1="262.0" x2="529.9" y2="368.8" stroke="#E4AA92" stroke-width="2"/><line x1="380.0" y1="262.0" x2="230.1" y2="368.8" stroke="#E4AA92" stroke-width="2"/><line x1="380.0" y1="262.0" x2="137.5" y2="221.2" stroke="#E4AA92" stroke-width="2"/><ellipse cx="380" cy="262" rx="78" ry="46" fill="#C2410C"/><text x="380.0" y="257.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">Tu contrato</tspan><tspan x="380.0" dy="17.9">con el cliente</tspan></text><rect x="292.0" y="103.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/><text x="380.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="380.0" dy="0.0">Cliente</tspan></text><text x="380.0" y="138.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Sigue exigiéndote a ti</tspan><tspan x="380.0" dy="14.7">el cumplimiento</tspan></text><rect x="534.5" y="194.2" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/><text x="622.5" y="213.2" font-size="13.5" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="622.5" dy="0.0">Tú, el contratista</tspan></text><text x="622.5" y="229.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="622.5" dy="0.0">Responde por el</tspan><tspan x="622.5" dy="14.7">subcontratista</tspan></text><rect x="441.9" y="341.8" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/><text x="529.9" y="360.8" font-size="13.5" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="529.9" dy="0.0">Subcontratista</tspan></text><text x="529.9" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="529.9" dy="0.0">Ejecuta una parte del</tspan><tspan x="529.9" dy="14.7">trabajo</tspan></text><rect x="142.1" y="334.8" width="176.0" height="68.0" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/><text x="230.1" y="353.8" font-size="13.5" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="230.1" dy="0.0">Trabajadores del subcontratista</tspan></text><text x="230.1" y="369.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="230.1" dy="0.0">Pueden reclamar al</tspan><tspan x="230.1" dy="14.7">contratista y al</tspan><tspan x="230.1" dy="14.7">mandante</tspan></text><rect x="49.5" 
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Un suministro de 12 meses con ajuste de precio</title><desc id="d">Un suministro de 12 meses con ajuste de precio. La línea muestra los puntos de control de un contrato anual. Los ajustes y las revisiones repartidos en el tiempo evitan que la volatilidad rompa la relación.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#C2410C"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Un suministro de 12 meses con ajuste de precio</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 130 · Contratos y arquitectura legal operativa</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#C2410C" stroke-width="4"/><circle cx="110.0" cy="244" r="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="136.0" font-size="15" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="110.0" dy="0.0">Mes 0</tspan></text><text x="110.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">Firma con volumen</tspan><tspan x="110.0" dy="16.0">mínimo y precio</tspan><tspan x="110.0" dy="16.0">base</tspan></text><circle cx="245.0" cy="244" r="13" fill="#C2410C" stroke="#C2410C" stroke-width="3"/><line x1="245.0" y1="258.0" x2="245.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="245.0" y="312.0" font-size="15" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="245.0" dy="0.0">Mes 3</tspan></text><text x="245.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="245.0" dy="0.0">Primer ajuste</tspan><tspan x="245.0" dy="16.0">según índice del</tspan><tspan x="245.0" dy="16.0">insumo</tspan></text><circle cx="380.0" cy="244" r="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="3"/><line x1="380.0" y1="230.0" x2="380.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="380.0" y="136.0" font-size="15" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="380.0" dy="0.0">Mes 6</tspan></text><text x="380.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="380.0" dy="0.0">Revisión de</tspan><tspan x="380.0" dy="16.0">volumen y de</tspan><tspan x="380.0" dy="16.0">cumplimiento</tspan></text><circle cx="515.0" cy="244" r="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="3"/><line x1="515.0" y1="258.0" x2="515.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="515.0" y="312.0" font-size="15" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="515.0" dy="0.0">Mes 9</tspan></text><text x="515.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="515.0" dy="0.0">Segundo ajuste y</tspan><tspan x="515.0" dy="16.0">aviso de</tspan><tspan x="515.0" dy="16.0">renovación</tspan></text><circle cx="650.0" cy="244" r="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="3"/><line x1="650.0" y1="230.0" x2="650.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="136.0" font-size="15" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="650.0" dy="0.0">Mes 12</tspan></text><text x="650.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="650.0" dy="0.0">Término o</tspan><tspan x="650.0" dy="16.0">renovación con</tspan><tspan x="650.0" dy="16.0">nuevas condiciones</tspan></text><text x="380.0" y="420.0" font-size="12" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">Pactar precio fijo a doce meses en un insumo volátil traslada todo el riesgo a una parte.</tspan></text><circle cx="720" cy="40" r="14" fill="#F8E8E2" stroke="#EABCAA"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#C2410C" font-weight="700">130</text></svg>

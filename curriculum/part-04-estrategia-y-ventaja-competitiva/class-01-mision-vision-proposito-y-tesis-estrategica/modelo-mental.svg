<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">De la aspiración a una apuesta que se puede refutar</title><desc id="d">De la aspiración a una apuesta que se puede refutar. Los tres primeros peldaños inspiran; el último decide. Si tu tesis no puede resultar falsa en un plazo, aún es una visión y no una apuesta.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">De la aspiración a una apuesta que se puede refutar</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 43 · Estrategia y ventaja competitiva</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="159.5" height="120.0" rx="10" fill="#EAF3EE"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#2E8B57" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Propósito</tspan></text><text x="54.0" y="356.0" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="54.0" dy="0.0">Por qué existe la</tspan><tspan x="54.0" dy="15.4">empresa</tspan></text><rect x="207.5" y="223.3" width="159.5" height="176.7" rx="10" fill="#C7E0D2"/><text x="221.5" y="251.3" font-size="22" text-anchor="start" fill="#2E8B57" font-weight="800"><tspan x="221.5" dy="0.0">2</tspan></text><text x="221.5" y="275.3" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="221.5" dy="0.0">Misión</tspan></text><text x="221.5" y="299.3" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="221.5" dy="0.0">Qué hace y para quién</tspan><tspan x="221.5" dy="15.4">hoy</tspan></text><rect x="375.0" y="166.7" width="159.5" height="233.3" rx="10" fill="#A4CDB6"/><text x="389.0" y="194.7" font-size="22" text-anchor="start" fill="#2E8B57" font-weight="800"><tspan x="389.0" dy="0.0">3</tspan></text><text x="389.0" y="218.7" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="389.0" dy="0.0">Visión</tspan></text><text x="389.0" y="242.7" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="389.0" dy="0.0">Cómo sería el mundo si</tspan><tspan x="389.0" dy="15.4">funciona</tspan></text><rect x="542.5" y="110.0" width="159.5" height="290.0" rx="10" fill="#82B99A"/><text x="556.5" y="138.0" font-size="22" text-anchor="start" fill="#2E8B57" font-weight="800"><tspan x="556.5" dy="0.0">4</tspan></text><text x="556.5" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="556.5" dy="0.0">Tesis estratégica</tspan></text><text x="556.5" y="186.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="556.5" dy="0.0">Apuesta falsable sobre</tspan><tspan x="556.5" dy="15.4">cómo cambiará el</tspan><tspan x="556.5" dy="15.4">mercado</tspan></text><line x1="48.0" y1="412.0" x2="720.0" y2="412.0" stroke="#2E8B57" stroke-width="2.4" marker-end="url(#fl)"/><text x="716.0" y="430.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="716.0" dy="0.0">Más concreto y más comprobable</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">43</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuándo ejercer una opción y cuándo dejarla expirar</title><desc id="d">Cuándo ejercer una opción y cuándo dejarla expirar. Recorre el árbol con cada apuesta pequeña. La disciplina está en escribir el gatillo y el plazo antes de empezar, de modo que la decisión no dependa del entusiasmo del momento.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuándo ejercer una opción y cuándo dejarla expirar</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 52 · Estrategia y ventaja competitiva</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="55.0" y="224.0" width="190.0" height="68.0" rx="10" fill="#DEECE4" stroke="#2E8B57" stroke-width="1.6"/><text x="150.0" y="246.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="150.0" dy="0.0">Ejercer: comprometer el</tspan><tspan x="150.0" dy="16.0">capital que habías</tspan><tspan x="150.0" dy="16.0">reservado</tspan></text><rect x="285.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#DEECE4" stroke="#2E8B57" stroke-width="1.6"/><text x="380.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Dejar expirar: recuperar</tspan><tspan x="380.0" dy="16.0">el aprendizaje y liberar</tspan><tspan x="380.0" dy="16.0">el presupuesto</tspan></text><rect x="515.0" y="336.0" width="190.0" height="52.0" rx="10" fill="#DEECE4" stroke="#2E8B57" stroke-width="1.6"/><text x="610.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="610.0" dy="0.0">Mantener la opción</tspan><tspan x="610.0" dy="16.0">abierta y seguir midiendo</tspan></text><line x1="495.0" y1="274.0" x2="380.0" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="425.5" y="303.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="425.5" dy="0.0">sí</tspan></text><line x1="495.0" y1="274.0" x2="610.0" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="564.5" y="303.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="564.5" dy="0.0">no</tspan></text><path d="M412.6,224 h164.8 a14,14 0 0 1 14,14 v22 a14,14 0 0 1 -14,14 h-164.8 a14,14 0 0 1 -14,-14 v-22 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2.2"/><text x="495.0" y="245.2" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="495.0" dy="0.0">¿Venció el plazo de la</tspan><tspan x="495.0" dy="16.6">opción?</tspan></text><line x1="322.5" y1="178.0" x2="150.0" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="224.2" y="199.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="224.2" dy="0.0">sí</tspan></text><line x1="322.5" y1="178.0" x2="495.0" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="420.8" y="199.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="420.8" dy="0.0">no</tspan></text><path d="M225.3,112 h194.4 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-194.4 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2.2"/><text x="322.5" y="132.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="322.5" dy="0.0">¿Apareció la evidencia que</tspan><tspan x="322.5" dy="16.6">definiste como gatillo</tspan><tspan x="322.5" dy="16.6">para ejercer?</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">52</text></svg>

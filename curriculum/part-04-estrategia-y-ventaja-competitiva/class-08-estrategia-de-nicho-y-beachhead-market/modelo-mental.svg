<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Dominar un nicho y expandirse por adyacencia</title><desc id="d">Dominar un nicho y expandirse por adyacencia. La línea muestra cómo se avanza: primero un nicho que se domina, luego segmentos vecinos con el prestigio ganado. El hito destacado es la dominancia, que produce las referencias.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Dominar un nicho y expandirse por adyacencia</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 50 · Estrategia y ventaja competitiva</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#2E8B57" stroke-width="4"/><circle cx="110.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="136.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="110.0" dy="0.0">Mes 0</tspan></text><text x="110.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">Elegir un segmento</tspan><tspan x="110.0" dy="16.0">pequeño y</tspan><tspan x="110.0" dy="16.0">alcanzable</tspan></text><circle cx="245.0" cy="244" r="13" fill="#2E8B57" stroke="#2E8B57" stroke-width="3"/><line x1="245.0" y1="258.0" x2="245.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="245.0" y="312.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="245.0" dy="0.0">Mes 12</tspan></text><text x="245.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="245.0" dy="0.0">Dominancia:</tspan><tspan x="245.0" dy="16.0">referencias y</tspan><tspan x="245.0" dy="16.0">casos</tspan></text><circle cx="380.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="380.0" y1="230.0" x2="380.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="380.0" y="152.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="380.0" dy="0.0">Mes 24</tspan></text><text x="380.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="380.0" dy="0.0">Segmento adyacente</tspan><tspan x="380.0" dy="16.0">1</tspan></text><circle cx="515.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="515.0" y1="258.0" x2="515.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="515.0" y="312.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="515.0" dy="0.0">Mes 36</tspan></text><text x="515.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="515.0" dy="0.0">Segmento adyacente</tspan><tspan x="515.0" dy="16.0">2</tspan></text><circle cx="650.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="650.0" y1="230.0" x2="650.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="152.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="650.0" dy="0.0">Mes 60</tspan></text><text x="650.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" fon
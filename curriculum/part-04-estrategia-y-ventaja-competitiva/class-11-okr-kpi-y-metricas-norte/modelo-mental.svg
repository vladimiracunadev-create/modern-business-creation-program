<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cómo vas con un resultado clave del trimestre</title><desc id="d">Cómo vas con un resultado clave del trimestre. Cada banda es una decisión sobre un resultado clave. Mira el avance frente a la meta y actúa según el color; no esperes al cierre del trimestre para descubrir el rojo.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cómo vas con un resultado clave del trimestre</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 53 · Estrategia y ventaja competitiva</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><text x="40.0" y="104.0" font-size="13" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="40.0" dy="0.0">Avance de un resultado clave frente a su meta al cierre del trimestre (umbrales de ejemplo)</tspan></text><rect x="40.0" y="118.0" width="680.0" height="82.0" rx="14" fill="#ECFDF3" stroke="#16A34A" stroke-width="2"/><circle cx="86" cy="159" r="22" fill="#16A34A"/><text x="130.0" y="150.0" font-size="15.5" text-anchor="start" fill="#1F2937" font-weight="800"><tspan x="130.0" dy="0.0">70 % o más de la meta</tspan></text><text x="130.0" y="180.0" font-size="11" text-anchor="start" fill="#16A34A" font-weight="800"><tspan x="130.0" dy="0.0">VERDE</tspan></text><text x="430.0" y="148.0" font-size="13.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="430.0" dy="0.0">En ruta: mantén el esfuerzo y documenta</tspan><tspan x="430.0" dy="17.3">qué funcionó.</tspan></text><rect x="40.0" y="212.0" width="680.0" height="82.0" rx="14" fill="#FEF6E3" stroke="#F59E0B" stroke-width="2"/><circle cx="86" cy="253" r="22" fill="#F59E0B"/><text x="130.0" y="244.0" font-size="15.5" text-anchor="start" fill="#1F2937" font-weight="800"><tspan x="130.0" dy="0.0">40 % a 69 %</tspan></text><text x="130.0" y="274.0" font-size="11" text-anchor="start" fill="#F59E0B" font-weight="800"><tspan x="130.0" dy="0.0">AMARILLO</tspan></text><text x="430.0" y="242.0" font-size="13.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="430.0" dy="0.0">En riesgo: revisa la causa y ajusta el</tspan><tspan x="430.0" dy="17.3">plan esta semana.</tspan></text><rect x="40.0" y="306.0" width="680.0" height="82.0" rx="14" fill="#FDECEC" stroke="#DC2626" stroke-width="2"/><circle cx="86" cy="347" r="22" fill="#DC2626"/><text x="130.0" y="338.0" font-size="15.5" text-anchor="start" fill="#1F2937" font-weight="800"><tspan x="130.0" dy="0.0">Menos de 40 %</tspan></text><text x="130.0" y="368.0" font-size="11" text-anchor="start" fill="#DC2626" font-weight="800"><tspan x="130.0" dy="0.0">ROJO</tspan></text><text x="430.0" y="336.0" font-size="13.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="430.0" dy="0.0">Fuera de ruta: decide si se redefine el</tspan><tspan x="430.0" dy="17.3">resultado o se detiene.</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">53</text></svg>

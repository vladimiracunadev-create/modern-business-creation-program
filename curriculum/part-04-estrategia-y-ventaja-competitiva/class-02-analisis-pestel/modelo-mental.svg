<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Qué del entorno exige prepararse, y cuándo</title><desc id="d">Qué del entorno exige prepararse, y cuándo. Cada satélite es un frente del entorno. Para cada uno anota cuándo te afectaría, cuánto y qué señal verías antes. Lo que no tiene horizonte ni señal es ruido.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Qué del entorno exige prepararse, y cuándo</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 44 · Estrategia y ventaja competitiva</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="380.0" y1="262.0" x2="380.0" y2="130.0" stroke="#A1CBB3" stroke-width="2"/><line x1="380.0" y1="262.0" x2="600.8" y2="196.0" stroke="#A1CBB3" stroke-width="2"/><line x1="380.0" y1="262.0" x2="600.8" y2="328.0" stroke="#A1CBB3" stroke-width="2"/><line x1="380.0" y1="262.0" x2="380.0" y2="394.0" stroke="#A1CBB3" stroke-width="2"/><line x1="380.0" y1="262.0" x2="159.2" y2="328.0" stroke="#A1CBB3" stroke-width="2"/><line x1="380.0" y1="262.0" x2="159.2" y2="196.0" stroke="#A1CBB3" stroke-width="2"/><ellipse cx="380" cy="262" rx="78" ry="46" fill="#2E8B57"/><text x="380.0" y="266.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">Tu empresa</tspan></text><rect x="292.0" y="103.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.8"/><text x="380.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="380.0" dy="0.0">Político</tspan></text><text x="380.0" y="138.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Cambios de gobierno y</tspan><tspan x="380.0" dy="14.7">políticas públicas</tspan></text><rect x="512.8" y="169.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.8"/><text x="600.8" y="188.0" font-size="13.5" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="600.8" dy="0.0">Económico</tspan></text><text x="600.8" y="204.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="600.8" dy="0.0">Tasas, tipo de cambio,</tspan><tspan x="600.8" dy="14.7">consumo</tspan></text><rect x="512.8" y="308.0" width="176.0" height="40.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.8"/><text x="600.8" y="327.0" font-size="13.5" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="600.8" dy="0.0">Social</tspan></text><text x="600.8" y="343.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="600.8" dy="0.0">Hábitos y demografía</tspan></text><rect x="292.0" y="367.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.8"/><text x="380.0" y="386.0" font-size="13.5" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="380.0" dy="0.0">Tecnológico</tspan></text><text x="380.0" y="402.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">IA, automatización,</tspan><tspan x="380.0" dy="14.7">plataformas</tspan></text><rect x="71.2" y="301.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#2E8B57
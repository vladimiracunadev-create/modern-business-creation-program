<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Dónde queda el margen en tu industria</title><desc id="d">Dónde queda el margen en tu industria. Cada barra mide la presión de una de las cinco fuerzas. Las más altas son las que se llevan el margen. Antes de apostar a un sector, pregunta quién se queda con la ganancia.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Dónde queda el margen en tu industria</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 45 · Estrategia y ventaja competitiva</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="111.6" y="149.9" width="76.8" height="200.1" rx="8" fill="#2E8B57"/><text x="150.0" y="139.9" font-size="14" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="150.0" dy="0.0">5</tspan></text><text x="150.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="150.0" dy="0.0">Poder de</tspan><tspan x="150.0" dy="16.0">proveedores</tspan></text><rect x="231.6" y="189.9" width="76.8" height="160.1" rx="8" fill="#B6D6C4"/><text x="270.0" y="179.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="270.0" dy="0.0">4</tspan></text><text x="270.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="270.0" dy="0.0">Poder de</tspan><tspan x="270.0" dy="16.0">clientes</tspan></text><rect x="351.6" y="189.9" width="76.8" height="160.1" rx="8" fill="#B6D6C4"/><text x="390.0" y="179.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="390.0" dy="0.0">4</tspan></text><text x="390.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="390.0" dy="0.0">Rivalidad entre</tspan><tspan x="390.0" dy="16.0">competidores</tspan></text><rect x="471.6" y="230.0" width="76.8" height="120.0" rx="8" fill="#B6D6C4"/><text x="510.0" y="220.0" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="510.0" dy="0.0">3</tspan></text><text x="510.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="510.0" dy="0.0">Amenaza de</tspan><tspan x="510.0" dy="16.0">sustitutos</tspan></text><rect x="591.6" y="270.0" width="76.8" height="80.0" rx="8" fill="#B6D6C4"/><text x="630.0" y="260.0" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="630.0" dy="0.0">2</tspan></text><text x="630.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="630.0" dy="0.0">Amenaza de</tspan><tspan x="630.0" dy="16.0">nuevos entrantes</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">Con proveedores concentrados y clientes grandes, el margen se reparte antes de llegar a ti, por bien</tspan><tspan x="56.0" dy="16.0">gestionada que esté la empresa.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Intensidad de 1 (baja) a 5 (alta), ejemplo ilustrativo</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">45</text></svg>

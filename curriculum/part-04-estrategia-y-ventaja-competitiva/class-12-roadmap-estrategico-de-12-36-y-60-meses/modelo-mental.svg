<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Tres horizontes con la capacidad de uno</title><desc id="d">Tres horizontes con la capacidad de uno. El primer horizonte sostiene a los otros: sin caja y capacidad en la base, los de arriba no se financian. Declara qué debe estar listo antes de qué y cuánta capacidad real asignas a cada uno.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Tres horizontes con la capacidad de uno</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 54 · Estrategia y ventaja competitiva</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="140.0" y="100.0" width="300.0" height="64.0" rx="10" fill="#D9EAE1"/><text x="290.0" y="137.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">Horizonte 1: defender y operar</tspan></text><text x="560.0" y="136.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Negocio actual y su caja</tspan></text><line x1="446.0" y1="132.0" x2="552.0" y2="132.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="90.0" y="170.0" width="400.0" height="64.0" rx="10" fill="#99C6AD"/><text x="290.0" y="207.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">Horizonte 2: extender</tspan></text><text x="560.0" y="199.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Nuevos productos o</tspan><tspan x="560.0" dy="16.0">mercados cercanos</tspan></text><line x1="496.0" y1="202.0" x2="552.0" y2="202.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="40.0" y="240.0" width="500.0" height="64.0" rx="10" fill="#58A279"/><text x="290.0" y="277.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="290.0" dy="0.0">Horizonte 3: explorar</tspan></text><text x="560.0" y="269.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Apuestas inciertas de</tspan><tspan x="560.0" dy="16.0">largo plazo</tspan></text><line x1="546.0" y1="272.0" x2="552.0" y2="272.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">54</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">La cadencia de comunicación durante una crisis</title><desc id="d">La cadencia de comunicación durante una crisis. El ciclo es una promesa de cadencia. Lo importante no es tener todas las respuestas, sino volver a hablar cuando se dijo que se haría. Este modelo complementa el protocolo de audiencias de la guía de reputación.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">La cadencia de comunicación durante una crisis</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 292 · Crisis, continuidad, insolvencia y recuperación</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><circle cx="380" cy="252" r="128" fill="none" stroke="#B9BCC2" stroke-width="3" stroke-dasharray="3 7"/><path d="M380.0,124.0 Q485.7,151.7 556.5,212.4" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M556.5,212.4 Q546.2,289.2 489.1,355.6" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M489.1,355.6 Q380.0,379.6 270.9,355.6" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M270.9,355.6 Q213.8,289.2 203.5,212.4" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M203.5,212.4 Q274.3,151.7 380.0,124.0" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><rect x="309.0" y="89.5" width="142.0" height="69.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="2"/><text x="380.0" y="111.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Comunicar</tspan><tspan x="380.0" dy="16.6">temprano con lo</tspan><tspan x="380.0" dy="16.6">que se sabe</tspan></text><circle cx="311.0" cy="91.5" r="10" fill="#374151"/><text x="311.0" y="95.5" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">1</text><rect x="481.7" y="186.4" width="149.6" height="52.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="2"/><text x="556.5" y="208.7" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="556.5" dy="0.0">Decir lo que aún</tspan><tspan x="556.5" dy="16.6">no se sabe</tspan></text><circle cx="483.7160894243804" cy="188.44582472000673" r="10" fill="#374151"/><text x="483.7160894243804" y="192.44582472000673" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">2</text><rect x="421.9" y="312.6" width="134.4" height="86.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="2"/><text x="489.1" y="335.1" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="489.1" dy="0.0">Comprometer la</tspan><tspan x="489.1" dy="16.6">fecha de la</tspan><tspan x="489.1" dy="16.6">próxima</tspan><tspan x="489.1" dy="16.6">actualización</tspan></text><circle cx="423.89294282548303" cy="314.5541752799933" r="10" fill="#374151"/><text x="423.89294282548303" y="318.5541752799933" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">3</text><rect x="192.3" y="329.6" width="157.2" height="52.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="2"/><text x="270.9" y="351.8" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="270.9" dy="0.0">Actualizar aunque</tspan><tspan x="270.9" dy="16.6">no haya novedades</tspan></text><circle cx="194.30705717451704" cy="331.5541752799933" r="10" fill="#374151"/><text x="194.30705717451704" y="335.5541752799933" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">4</text><rect x="140.1" y="186.4" width="126.8" height="52.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="2"/><text x="203.5" y="208.7" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="203.5" dy="0.0">Cerrar con lo</tspan><tspan x="203.5" dy="16.6">aprendido</tspan></text><circle cx="142.08391057561948" cy="188.44582472000675" r="10" fill="#374151"/><text x="142.08391057561948" y="192.44582472000675" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">5</text><text x="380.0" y="239.0" font-size="14" text-anchor="middle" fill="#374151" font-weight="700"><tspan x="380.0" dy="0.0">Una sola</tspan><tspan x="380.0" dy="17.9">versión, por</tspan><tspan x="380.0" dy="17.9">audiencia</tspan></text><circle cx="720" cy="40" r="14" fill="#E7E8EA" stroke="#B9BCC2"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">292</text></svg>

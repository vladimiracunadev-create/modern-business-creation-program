<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">La recuperación avanza por hitos de estabilización</title><desc id="d">La recuperación avanza por hitos de estabilización. La curva es lenta al comienzo, se acelera tras el hito de estabilización y se aplana al recuperarse. Volver a crecer antes del hito, sin reserva ni capacidad, puede repetir la crisis.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">La recuperación avanza por hitos de estabilización</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 294 · Crisis, continuidad, insolvencia y recuperación</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="96.0" y1="362.0" x2="664.0" y2="362.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><line x1="96.0" y1="362.0" x2="96.0" y2="92.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><text x="376.0" y="394.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="376.0" dy="0.0">Tiempo desde el punto más bajo</tspan></text><g transform="translate(66 231.0) rotate(-90)"><text x="0.0" y="0.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="0.0" dy="0.0">Capacidad operativa recuperada</tspan></text></g><path d="M96.0,360.2 L105.3,359.9 L114.7,359.6 L124.0,359.1 L133.3,358.6 L142.7,358.0 L152.0,357.3 L161.3,356.5 L170.7,355.5 L180.0,354.3 L189.3,353.0 L198.7,351.4 L208.0,349.6 L217.3,347.4 L226.7,345.0 L236.0,342.1 L245.3,338.8 L254.7,335.1 L264.0,330.8 L273.3,325.9 L282.7,320.4 L292.0,314.2 L301.3,307.3 L310.7,299.8 L320.0,291.5 L329.3,282.6 L338.7,273.1 L348.0,263.1 L357.3,252.6 L366.7,241.9 L376.0,231.0 L385.3,220.1 L394.7,209.4 L404.0,198.9 L413.3,188.9 L422.7,179.4 L432.0,170.5 L441.3,162.2 L450.7,154.7 L460.0,147.8 L469.3,141.6 L478.7,136.1 L488.0,131.2 L497.3,126.9 L506.7,123.2 L516.0,119.9 L525.3,117.0 L534.7,114.6 L544.0,112.4 L553.3,110.6 L562.7,109.0 L572.0,107.7 L581.3,106.5 L590.7,105.5 L600.0,104.7 L609.3,104.0 L618.7,103.4 L628.0,102.9 L637.3,102.4 L646.7,102.1 L656.0,101.8" fill="none" stroke="#374151" stroke-width="3.4" stroke-linecap="round"/><circle cx="376.0" cy="231.0" r="8" fill="#374151" stroke="#FFFFFF" stroke-width="3"/><text x="392.0" y="255.0" font-size="13" text-anchor="start" fill="#374151" font-weight="700"><tspan x="392.0" dy="0.0">Hito de estabilización:</tspan><tspan x="392.0" dy="16.6">la caída se detuvo</tspan></text><circle cx="720" cy="40" r="14" fill="#E7E8EA" stroke="#B9BCC2"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">294</text></svg>

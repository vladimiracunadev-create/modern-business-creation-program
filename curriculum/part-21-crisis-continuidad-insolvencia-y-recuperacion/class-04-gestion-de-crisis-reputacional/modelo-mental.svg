<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cinco categorías que no se mezclan en un mensaje de crisis</title><desc id="d">Cinco categorías que no se mezclan en un mensaje de crisis. Cada categoría tiene su propia regla de uso. Mezclarlas, como presentar una alegación como un hecho, convierte un mensaje en un riesgo adicional. Este modelo complementa la guía de reputación y crisis del programa.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cinco categorías que no se mezclan en un mensaje de crisis</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 284 · Crisis, continuidad, insolvencia y recuperación</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="380.0" y1="262.0" x2="380.0" y2="130.0" stroke="#A5AAB1" stroke-width="2"/><line x1="380.0" y1="262.0" x2="622.5" y2="221.2" stroke="#A5AAB1" stroke-width="2"/><line x1="380.0" y1="262.0" x2="529.9" y2="368.8" stroke="#A5AAB1" stroke-width="2"/><line x1="380.0" y1="262.0" x2="230.1" y2="368.8" stroke="#A5AAB1" stroke-width="2"/><line x1="380.0" y1="262.0" x2="137.5" y2="221.2" stroke="#A5AAB1" stroke-width="2"/><ellipse cx="380" cy="262" rx="78" ry="46" fill="#374151"/><text x="380.0" y="257.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">Mensaje de</tspan><tspan x="380.0" dy="17.9">crisis</tspan></text><rect x="292.0" y="103.0" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/><text x="380.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="380.0" dy="0.0">Hecho verificado</tspan></text><text x="380.0" y="138.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Lo que la empresa</tspan><tspan x="380.0" dy="14.7">confirmó</tspan></text><rect x="534.5" y="194.2" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/><text x="622.5" y="213.2" font-size="13.5" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="622.5" dy="0.0">Alegación</tspan></text><text x="622.5" y="229.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="622.5" dy="0.0">Lo que otros afirman sin</tspan><tspan x="622.5" dy="14.7">confirmación</tspan></text><rect x="427.5" y="341.8" width="204.7" height="54.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/><text x="529.9" y="360.8" font-size="12" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="529.9" dy="0.0">Actuación de una autoridad</tspan></text><text x="529.9" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="529.9" dy="0.0">Lo que un regulador o</tspan><tspan x="529.9" dy="14.7">tribunal hizo</tspan></text><rect x="137.8" y="341.8" width="184.6" height="54.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/><text x="230.1" y="360.8" font-size="12" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="230.1" dy="0.0">Respuesta de la empresa</tspan></text><text x="230.1" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="230.1" dy="0.0">Lo que la empresa dice y</tspan><tspan x="230.1" dy="14.7">hace</tspan></text><rect x="49.5" y="194.2" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/><text x="137.5" y="213.2" font-size="13.5" text-anchor="middle" fill="#374151" font-weight="800"><tspan x="137.5" dy="0.0">Interpretación</tspan></text><text x="137.5" y="229.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="137.5" dy="0.0">Lo que se concluye de lo</tspan><tspan x="137.5" dy="14.7">anterior</tspan></text><circle cx="720" cy="40" r="14" fill="#E7E8EA" stroke="#B9BCC2"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">284</text></svg>

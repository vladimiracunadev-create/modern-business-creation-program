<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El ciclo de auditoría interna de una empresa pequeña</title><desc id="d">El ciclo de auditoría interna de una empresa pequeña. El ciclo no termina al detectar un hallazgo: sigue hasta que se cierra. Un hallazgo sin responsable ni fecha se repite el siguiente año con otro nombre.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El ciclo de auditoría interna de una empresa pequeña</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 266 · Compliance, riesgos y responsabilidad empresarial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><circle cx="380" cy="252" r="128" fill="none" stroke="#ABCFCC" stroke-width="3" stroke-dasharray="3 7"/><path d="M380.0,124.0 Q485.7,151.7 556.5,212.4" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M556.5,212.4 Q546.2,289.2 489.1,355.6" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M489.1,355.6 Q380.0,379.6 270.9,355.6" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M270.9,355.6 Q213.8,289.2 203.5,212.4" fill="none" stroke="#0F766E" s
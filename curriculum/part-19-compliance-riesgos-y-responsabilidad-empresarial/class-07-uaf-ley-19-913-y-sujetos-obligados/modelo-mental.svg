<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">¿Tu empresa es sujeto obligado ante la UAF?</title><desc id="d">¿Tu empresa es sujeto obligado ante la UAF?. Recorre el árbol con tu actividad. Si figuras en el listado de la UAF, hay obligaciones concretas y plazos. Si no, tus clientes o tu banco pueden pedirte información aunque no seas sujeto obligado directo.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">¿Tu empresa es sujeto obligado ante la UAF?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 259 · Compliance, riesgos y responsabilidad empresarial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="55.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="150.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="150.0" dy="0.0">Mantén el programa y</tspan><tspan x="150.0" dy="16.0">reporta operaciones</tspan><tspan x="150.0" dy="16.0">sospechosas y en efectivo</tspan></text><rect x="285.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="380.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Inscríbete y designa al</tspan><tspan x="380.0" dy="16.0">encargado antes de seguir</tspan><tspan x="380.0" dy="16.0">operando</tspan></text><line x1="265.0" y1="290.0" x2="150.0" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="195.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="195.5" dy="0.0">sí</tspan></text><line x1="265.0" y1="290.0" x2="380.0" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="334.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="334.5" dy="0.0">no</tspan></text><path d="M171.5,224 h187.0 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-187.0 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.2"/><text x="265.0" y="244.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="265.0" dy="0.0">¿Estás inscrita en la UAF</tspan><tspan x="265.0" dy="16.6">y tienes un oficial de</tspan><tspan x="265.0" dy="16.6">cumplimiento?</tspan></text><rect x="515.0" y="224.0" width="190.0" height="84.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="610.0" y="246.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="610.0" dy="0.0">No eres sujeto obligado</tspan><tspan x="610.0" dy="16.0">directo, pero tus</tspan><tspan x="610.0" dy="16.0">clientes pueden pedirte</tspan><tspan x="610.0" dy="16.0">debida diligencia</tspan></text><line x1="437.5" y1="178.0" x2="265.0" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="339.2" y="199.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="339.2" dy="0.0">sí</tspan></text><line x1="437.5" y1="178.0" x2="610.0" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="535.8" y="199.0" font-size="12.5" text-anchor=
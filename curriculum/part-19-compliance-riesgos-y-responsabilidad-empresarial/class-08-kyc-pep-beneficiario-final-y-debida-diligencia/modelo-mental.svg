<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Conocer al cliente es un proceso, no un formulario</title><desc id="d">Conocer al cliente es un proceso, no un formulario. Cada peldaño suma información y reduce el riesgo. El último es el más olvidado: conocer al cliente al inicio no basta si luego sus operaciones dejan de calzar con su perfil.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Conocer al cliente es un proceso, no un formulario</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 260 · Compliance, riesgos y responsabilidad empresarial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="126.0" height="120.0" rx="10" fill="#E7F1F0"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Identificar al</tspan><tspan x="54.0" dy="17.9">cliente</tspan></text><text x="54.0" y="374.0" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="54.0" dy="0.0">Quién es y cómo se</tspan><tspan x="54.0" dy="15.4">verifica</tspan></text><rect x="174.0" y="237.5" width="126.0" height="162.5" rx="10" fill="#C9E0DE"/><text x="188.0" y="265.5" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="188.0" dy="0.0">2</tspan></text><text x="188.0" y="289.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="188.0" dy="0.0">Entender el</tspan><tspan x="188.0" dy="17.9">propósito</tspan></text><text x="188.0" y="331.5" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="188.0" dy="0.0">Para qué quiere la</tspan><tspan x="188.0" dy="15.4">relación comercial</tspan></text><rect x="308.0" y="195.0" width="126.0" height="205.0" rx="10" fill="#ABCFCC"/><text x="322.0" y="223.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="322.0" dy="0.0">3</tspan></text><text x="322.0" y="247.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="322.0" dy="0.0">Identificar al</tspan><tspan x="322.0" dy="17.9">beneficiario</tspan><tspan x="322.0" dy="17.9">final</tspan></text><text x="322.0" y="307.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="322.0" dy="0.0">Quién controla</tspan><tspan x="322.0" dy="15.4">realmente</tspan></text><rect x="442.0" y="152.5" width="126.0" height="247.5" rx="10" fill="#8DBEBA"/><text x="456.0" y="180.5" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="456.0" dy="0.0">4</tspan></text><text x="456.0" y="204.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="456.0" dy="0.0">Evaluar riesgo</tspan><tspan x="456.0" dy="17.9">y PEP</tspan></text><text x="456.0" y="246.5" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="456.0" dy="0.0">Personas expuestas</tspan><tspan x="456.0" dy="15.4">políticamente y</tspan><tspan x="456.0" dy="15.4">países de riesgo</tspan></text><rect x="576.0" y="110.0" width="126.0" height="290.0" rx="10" fill="#6FADA8"/><text x="590.0" y="138.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="590.0" dy="0.0">5</tspan></text><text x="590.0" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="590.0" dy="0.0">Monitorear de</tspan><tspan x="590.0" dy="17.9">forma continua</tspan></text><text x="590.0" y="204.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="590.0" dy="0.0">Operaciones</tspan><tspan x="590.0" dy="15.4">coherentes con su</tspan><tspan x="590.0" dy="15.4">perfil</tspan></text><line x1="48.0" y1="412.0" x2="720.0" y2="412.0" stroke="#0F766E" stroke-width="2.4" marker-end="url(#fl)"/><text x="716.0" y="430.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="716.0" dy="0.0">Más conocimiento, menos riesgo</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">260</text></svg>

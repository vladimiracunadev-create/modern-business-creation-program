<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Una operación con razón de negocios y una solo por impuestos</title><desc id="d">Una operación con razón de negocios y una solo por impuestos. Compara los dos platos. La misma operación puede estar en uno o en otro según su motivo y su documentación. El segundo plato es el que el SII examina con más atención.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Una operación con razón de negocios y una solo por impuestos</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 263 · Compliance, riesgos y responsabilidad empresarial</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="96.0" width="316.0" height="214.0" rx="14" fill="#FEF3E2" stroke="#F59E0B" stroke-width="2"/><text x="60.0" y="134.0" font-size="16" text-anchor="start" fill="#B45309" font-weight="700"><tspan x="60.0" dy="0.0">Estructura con razón de negocios</tspan></text><circle cx="64" cy="164" r="3.4" fill="#F59E0B"/><text x="78.0" y="168.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="78.0" dy="0.0">Responde a un objetivo comercial</tspan><tspan x="78.0" dy="16.6">verificable</tspan></text><circle cx="64" cy="210" r="3.4" fill="#F59E0B"/><text x="78.0" y="214.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="78.0" dy="0.0">Está documentada antes de ejecutarse</tspan></text><circle cx="64" cy="238" r="3.4" fill="#F59E0B"/><text x="78.0" y="242.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="78.0" dy="0.0">Resiste una fiscalización</tspan></text><rect x="404.0" y="96.0" width="316.0" height="214.0" rx="14" fill="#E2EFEE" stroke="#0F766E" stroke-width="2"/><text x="424.0" y="134.0" font-size="16" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="424.0" dy="0.0">Estructura solo por ahorro</tspan><tspan x="424.0" dy="20.5">tributario</tspan></text><circle cx="428" cy="164" r="3.4" fill="#0F766E"/><text x="442.0" y="168.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="442.0" dy="0.0">No hay un motivo económico distinto del</tspan><tspan x="442.0" dy="16.6">impuesto</tspan></text><circle cx="428" cy="210" r="3.4" fill="#0F766E"/><text x="442.0" y="214.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="442.0" dy="0.0">Se arma con documentos a posteriori</tspan></text><circle cx="428" cy="238" r="3.4" fill="#0F766E"/><text x="442.0" y="242.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="442.0" dy="0.0">Atrae las normas antielusivas del SII</tspan></text><circle cx="380" cy="203" r="22" fill="#1F2937"/><text x="380.0" y="208.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">vs</tspan></text><rect x="40.0" y="326.0" width="680.0" height="90.0" rx="12" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.6"/><text x="60.0" y="350.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="60.0" dy="0.0">Criterio de decisión</tspan></text><text x="60.0" y="376.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="60.0" dy="0.0">Documenta la razón de negocios de cada reorganización, operación con relacionados o</tspan><tspan x="60.0" dy="19.2">estructura relevante antes de ejecutarla.</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">263</text></svg>

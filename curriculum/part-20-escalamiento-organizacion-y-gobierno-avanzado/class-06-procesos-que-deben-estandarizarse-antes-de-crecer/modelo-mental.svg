<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Estandarizar para poder replicar</title><desc id="d">Estandarizar para poder replicar. El ciclo tiene un paso decisivo: probar con una persona nueva. Si necesita preguntar para completar un paso, el manual no está terminado y el proceso no es replicable.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Estandarizar para poder replicar</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 272 · Escalamiento, organización y gobierno avanzado</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><circle cx="380" cy="252" r="128" fill="none" stroke="#ABCFCC" stroke-width="3" stroke-dasharray="3 7"/><path d="M380.0,124.0 Q485.7,151.7 556.5,212.4" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M556.5,212.4 Q546.2,289.2 489.1,355.6" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M489.1,355.6 Q380.0,379.6 270.9,355.6" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M270.9,355.6 Q213.8,289.2 203.5,212.4" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M203.5,212.4 Q274.3,151.7 380.0,124.0" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><rect x="309.0" y="89.5" width="142.0" height="69.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="380.0" y="111.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Documentar el</tspan><tspan x="380.0" dy="16.6">proceso como se</tspan><tspan x="380.0" dy="16.6">hace de verdad</tspan></text><circle cx="311.0" cy="91.5" r="10" fill="#0F766E"/><text x="311.0" y="95.5" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">1</text><rect x="481.7" y="186.4" width="149.6" height="52.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="556.5" y="208.7" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="556.5" dy="0.0">Probarlo con una</tspan><tspan x="556.5" dy="16.6">persona nueva</tspan></text><circle cx="483.7160894243804" cy="188.44582472000673" r="10" fill="#0F766E"/><text x="483.7160894243804" y="192.44582472000673" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">2</text><rect x="418.1" y="329.6" width="142.0" height="52.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="489.1" y="351.8" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="489.1" dy="0.0">Corregir lo que</tspan><tspan x="489.1" dy="16.6">no se entiende</tspan></text><circle cx="420.092942825483" cy="331.5541752799933" r="10" fill="#0F766E"/><text x="420.092942825483" y="335.5541752799933" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">3</text><rect x="196.1" y="329.6" width="149.6" height="52.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="270.9" y="351.8" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="270.9" dy="0.0">Medir resultados</tspan><tspan x="270.9" dy="16.6">con el manual</tspan></text><circle cx="
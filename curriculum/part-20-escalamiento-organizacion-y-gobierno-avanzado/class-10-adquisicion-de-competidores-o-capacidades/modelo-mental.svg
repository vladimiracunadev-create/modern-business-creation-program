<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El valor de una adquisición se gana o se pierde en la integración</title><desc id="d">El valor de una adquisición se gana o se pierde en la integración. Cada barra resta algo de la sinergia prometida. El valor neto es lo que queda después de la integración y las contingencias. Si el precio pagado supera esa cifra, la compra destruye valor.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El valor de una adquisición se gana o se pierde en la integración</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 276 · Escalamiento, organización y gobierno avanzado</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="117.0" y="149.9" width="96.0" height="200.1" rx="8" fill="#ABCFCC"/><text x="165.0" y="139.9" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="165.0" dy="0.0">100</tspan></text><text x="165.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="165.0" dy="0.0">Sinergia prometida</tspan></text><rect x="267.0" y="230.0" width="96.0" height="120.0" rx="8" fill="#ABCFCC"/><text x="315.0" y="220.0" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="315.0" dy="0.0">60</tspan></text><text x="315.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="315.0" dy="0.0">Sinergia realizable</tspan></text><rect x="417.0" y="280.0" width="96.0" height="70.0" rx="8" fill="#ABCFCC"/><text x="465.0" y="270.0" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="465.0" dy="0.0">35</tspan></text><text x="465.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="465.0" dy="0.0">Costos de</tspan><tspan x="465.0" dy="16.0">integración y</tspan><tspan x="465.0" dy="16.0">contingencias</tspan></text><rect x="567.0" y="300.0" width="96.0" height="50.0" rx="8" fill="#0F766E"/><text x="615.0" y="290.0" font-size="14" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="615.0" dy="0.0">25</tspan></text><text x="615.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="615.0" dy="0.0">Valor neto esperado</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">Las contingencias laborales y tributarias suelen aparecer después de cerrar si no se detectan en la</tspan><tspan x="56.0" dy="16.0">debida diligencia.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Valor relativo (ejemplo ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">276</text></svg>

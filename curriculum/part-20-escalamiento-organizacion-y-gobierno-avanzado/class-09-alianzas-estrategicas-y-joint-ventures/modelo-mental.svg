<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuánto compromiso exige cada tipo de relación</title><desc id="d">Cuánto compromiso exige cada tipo de relación. Cada peldaño pide más compromiso y más gobierno. Muchas relaciones se quedan mejor como contratos simples; una alianza formal solo vale cuando la relación lo justifica.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuánto compromiso exige cada tipo de relación</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 275 · Escalamiento, organización y gobierno avanzado</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="126.0" height="120.0" rx="10" fill="#E7F1F0"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Proveedor</tspan></text><text x="54.0" y="356.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="54.0" dy="0.0">Compra y venta con</tspan><tspan x="54.0" dy="15.4">un contrato simple</tspan></text><rect x="174.0" y="237.5" width="126.0" height="162.5" rx="10" fill="#C9E0DE"/><text x="188.0" y="265.5" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="188.0" dy="0.0">2</tspan></text><text x="188.0" y="289.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="188.0" dy="0.0">Canal o reventa</tspan></text><text x="188.0" y="313.5" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="188.0" dy="0.0">Vende tu producto</tspan><tspan x="188.0" dy="15.4">con reglas de</tspan><tspan x="188.0" dy="15.4">registro</tspan></text><rect x="308.0" y="195.0" width="126.0" height="205.0" rx="10" fill="#ABCFCC"/><text x="322.0" y="223.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="322.0" dy="0.0">3</tspan></text><text x="322.0" y="247.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="322.0" dy="0.0">Partner</tspan><tspan x="322.0" dy="17.9">comercial o</tspan><tspan x="322.0" dy="17.9">tecnológico</tspan></text><text x="322.0" y="307.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="322.0" dy="0.0">Acuerdo con</tspan><tspan x="322.0" dy="15.4">objetivos y roles</tspan><tspan x="322.0" dy="15.4">compartidos</tspan></text><rect x="442.0" y="152.5" width="126.0" height="247.5" rx="10" fill="#8DBEBA"/><text x="456.0" y="180.5" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="456.0" dy="0.0">4</tspan></text><text x="456.0" y="204.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="456.0" dy="0.0">Socio</tspan><tspan x="456.0" dy="17.9">estratégico</tspan></text><text x="456.0" y="246.5" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="456.0" dy="0.0">Participación o</tspan><tspan x="456.0" dy="15.4">proyectos</tspan><tspan x="456.0" dy="15.4">conjuntos de largo</tspan><tspan x="456.0" dy="15.4">plazo</tspan></text><rect x="576.0" y="110.0" width="126.0" hei
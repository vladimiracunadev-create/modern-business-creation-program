<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Delegar bien: resultado claro y límite claro</title><desc id="d">Delegar bien: resultado claro y límite claro. Ubica una delegación tuya según la claridad de su resultado y de su límite. Solo el cuadrante superior derecho permite soltar el control sin perderlo.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Delegar bien: resultado claro y límite claro</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 269 · Escalamiento, organización y gobierno avanzado</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="150.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#CAE1DF" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">Actividad sin freno</tspan></text><text x="164.0" y="148.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Hay meta, pero sin límites:</tspan><tspan x="164.0" dy="15.4">aparecen sorpresas.</tspan></text><rect x="410.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#E7F1F0" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">Delegación efectiva</tspan></text><text x="424.0" y="148.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Resultado y límite claros: la</tspan><tspan x="424.0" dy="15.4">persona decide y rinde cuentas.</tspan></text><rect x="150.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#EEF0F3" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">Delegación vacía</tspan></text><text x="164.0" y="293.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Sin meta ni límite: actividad sin</tspan><tspan x="164.0" dy="15.4">efecto.</tspan></text><rect x="410.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#FDEED3" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">Permiso sin propósito</tspan></text><text x="424.0" y="293.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Hay límite, pero no meta: se</tspan><tspan x="424.0" dy="15.4">cumple la regla y no el resultado.</tspan></text><line x1="140.0" y1="396.0" x2="676.0" y2="396.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><line x1="140.0" y1="396.0" x2="140.0" y2="92.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><text x="410.0" y="420.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="410.0" dy="0.0">Claridad del límite de decisión</tspan></text><g transform="translate(88 241.0) rotate(-90)"><text x="0.0" y="0.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="0.0" dy="0.0">Claridad del resultado comprometido</tspan></text></g><text x="150.0" y="420.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="150.0" dy="0.0">bajo</tspan></text><text x="670.0" y="420.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="670.0" dy="0.0">alto</tspan></text><circle cx="566.0" cy="154.0" r="9" fill="#0F766E" stroke="#FFFFFF" stroke-width="3"/><text x="582.0" y="159.0" font-size="13" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="582.0" dy="0.0">Objetivo de la delegación</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">269</text></svg>

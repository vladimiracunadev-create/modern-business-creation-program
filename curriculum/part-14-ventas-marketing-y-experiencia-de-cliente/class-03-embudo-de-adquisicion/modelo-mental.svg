<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Dónde se pierde el cliente: el embudo</title><desc id="d">Dónde se pierde el cliente: el embudo. Cada barra es una etapa y el porcentaje a la derecha dice cuántos pasan a la siguiente. El recuadro rojo marca el cuello de botella: ahí está la mejora más barata (datos ilustrativos).</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Dónde se pierde el cliente: el embudo</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 185 · Ventas, marketing y experiencia de cliente</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="100.0" width="520.0" height="50.0" rx="8" fill="#C3DDDB"/><text x="300.0" y="130.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Visitas al sitio</tspan></text><text x="596.0" y="130.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">1.000</tspan></text><rect x="162.5" y="158.0" width="275.0" height="50.0" rx="8" fill="#9FC8C5"/><text x="300.0" y="188.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Interesados</tspan></text><text x="596.0" y="188.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">300</tspan></text><text x="668.0" y="188.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 30 %</tspan></text><rect x="199.2" y="216.0" width="201.5" height="50.0" rx="8" fill="#7BB4AF"/><text x="300.0" y="246.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Reuniones</tspan></text><text x="596.0" y="246.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">90</tspan></text><text x="668.0" y="246.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 30 %</tspan></text><rect x="207.1" y="274.0" width="185.8" height="50.0" rx="8" fill="#579F9A"/><text x="300.0" y="304.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">Propuestas</tspan></text><text x="596.0" y="304.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">45</tspan></text><text x="668.0" y="304.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 50 %</tspan></text><rect x="214.3" y="332.0" width="171.4" height="50.0" rx="8" fill="#338B84"/><text x="300.0" y="362.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">Clientes</tspan></text><text x="596.0" y="362.0" font-size="14" text-anchor="start" fill="#0F766E" font-weight="700"><tspan x="596.0" dy="0.0">4</tspan></text><text x="668.0" y="362.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="668.0" dy="0.0">pasa 9 %</tspan></text><rect x="30" y="328.0" width="720" height="58.0" rx="12" fill="none" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="6 4"/><text x="742.0" y="324.0" font-size="11" text-anchor="end" fill="#DC2626" font-weight="700"
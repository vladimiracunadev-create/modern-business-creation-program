<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuando más inversión encarece al cliente</title><desc id="d">Cuando más inversión encarece al cliente. A medida que se invierte más, el costo por cliente sube. Mientras la curva es plana conviene escalar; en la zona roja cada peso adicional compra menos.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuando más inversión encarece al cliente</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Clase 187 · Ventas, marketing y experiencia de cliente</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="96.0" y1="362.0" x2="664.0" y2="362.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><line x1="96.0" y1="362.0" x2="96.0" y2="92.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><text x="376.0" y="394.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="376.0" dy="0.0">Inversión en el canal</tspan></text><g transform="translate(66 231.0) rotate(-90)"><text x="0.0" y="0.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="0.0" dy="0.0">Costo por cliente nuevo (CAC)</tspan></text></g><path d="M96.0,341.0 L105.3,341.0 L114.7,341
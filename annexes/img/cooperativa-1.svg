<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Del texto refundido a las reformas recientes</title><desc id="d">Línea de tiempo de las cooperativas: 2003 Ley 19.832 entra en vigencia, 2003 DFL 5 fija el texto refundido, 2007 reglamento Decreto 101 y reformas posteriores sobre género y firma electrónica.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#C2410C"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Del texto refundido a las reformas recientes</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 09 · Cooperativa</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#C2410C" stroke-width="4"/><circle cx="110.0" cy="244" r="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="152.0" font-size="15" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="110.0" dy="0.0">4 mayo 2003</tspan></text><text x="110.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">Entra en vigencia la</tspan><tspan x="110.0" dy="16.0">Ley 19.832</tspan></text><circle cx="290.0" cy="244" r="13" fill="#C2410C" stroke="#C2410C" stroke-width="3"/><line x1="290.0" y1="258.0" x2="290.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="290.0" y="312.0" font-size="15" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="290.0" dy="0.0">25 sep 2003</tspan></text><text x="290.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="290.0" dy="0.0">DFL 5 fija el texto</tspan><tspan x="290.0" dy="16.0">refundido (publicado en</tspan><tspan x="290.0" dy="16.0">2004)</tspan></text><circle cx="470.0" cy="244" r="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="3"/><line x1="470.0" y1="230.0" x2="470.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="470.0" y="152.0" font-size="15" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="470.0" dy="0.0">2007</tspan></text><text x="470.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="470.0" dy="0.0">Decreto 101: reglamento</tspan><tspan x="470.0" dy="16.0">de la ley</tspan></text><circle cx="650.0" cy="244" r="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="3"/><line x1="650.0" y1="258.0" x2="650.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="312.0" font-size="15" text-anchor="middle" fill="#C2410C" font-weight="800"><tspan x="650.0" dy="0.0">Reformas</tspan></text><text x="650.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="650.0" dy="0.0">Género en órganos,</tspan><tspan x="650.0" dy="16.0">firma electrónica y</tspan><tspan x="650.0" dy="16.0">reglas transitorias</tspan></text><text x="380.0" y="420.0" font-size="12" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">La cooperativa se define por su finalidad: mejorar las condiciones de vida de sus socios.</tspan></text><circle cx="720" cy="40" r="14" fill="#F8E8E2" stroke="#EABCAA"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#C2410C" font-weight="700">9</text></svg>

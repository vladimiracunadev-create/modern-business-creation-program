<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">¿Honorarios o factura?</title><desc id="d">Árbol de decisión: si ejerces una profesión liberal sin giro comercial emites boleta de honorarios en Segunda Categoría, y si vendes bienes o tienes giro comercial emites factura o boleta en Primera Categoría.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">¿Honorarios o factura?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 01 · Persona natural con giro y trabajador independiente</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="55.0" y="224.0" width="190.0" height="68.0" rx="10" fill="#DEECE4" stroke="#2E8B57" stroke-width="1.6"/><text x="150.0" y="246.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="150.0" dy="0.0">Boleta de honorarios:</tspan><tspan x="150.0" dy="16.0">Segunda Categoría, con</tspan><tspan x="150.0" dy="16.0">retención de tus clientes</tspan></text><rect x="285.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#DEECE4" stroke="#2E8B57" stroke-width="1.6"/><text x="380.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Factura o boleta: Primera</tspan><tspan x="380.0" dy="16.0">Categoría, IVA y régimen</tspan><tspan x="380.0" dy="16.0">a elegir</tspan></text><rect x="515.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#DEECE4" stroke="#2E8B57" stroke-width="1.6"/><text x="610.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="610.0" dy="0.0">Consulta al SII y a tu</tspan><tspan x="610.0" dy="16.0">contador cómo se</tspan><tspan x="610.0" dy="16.0">clasifica tu actividad</tspan></text><line x1="495.0" y1="290.0" x2="380.0" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="425.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="425.5" dy="0.0">sí</tspan></text><line x1="495.0" y1="290.0" x2="610.0" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="564.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="564.5" dy="0.0">no</tspan></text><path d="M397.8,224 h194.4 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-194.4 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2.2"/><text x="495.0" y="244.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="495.0" dy="0.0">¿Vendes bienes o tienes un</tspan><tspan x="495.0" dy="16.6">giro de industria o</tspan><tspan x="495.0" dy="16.6">comercio?</tspan></text><line x1="322.5" y1="194.0" x2="150.0" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="224.2" y="207.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="224.2" dy="0.0">sí</tspan></text><line x1="322.5" y1="194.0" x2="495.0" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="420.8" y="207.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="420.8" dy="0.0">no</tspan></text><path d="M225.3,112 h194.4 a14,14 0 0 1 14,14 v54 a14,14 0 0 1 -14,14 h-194.4 a14,14 0 0 1 -14,-14 v-54 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2.2"/><text x="322.5" y="132.6" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="322.5" dy="0.0">¿Tu ingreso viene del</tspan><tspan x="322.5" dy="16.6">ejercicio de una profesión</tspan><tspan x="322.5" dy="16.6">u ocupación sin giro</tspan><tspan x="322.5" dy="16.6">comercial?</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">1</text></svg>

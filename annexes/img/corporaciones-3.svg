<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El excedente de una organización sin fines de lucro</title><desc id="d">Ciclo de cinco pasos: obtener ingresos, financiar el fin, medir el excedente, reinvertir en el fin y rendir cuentas, con la prohibición de repartir utilidades al centro.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El excedente de una organización sin fines de lucro</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 12 · Corporaciones, asociaciones y fundaciones</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><circle cx="380" cy="252" r="128" fill="none" stroke="#ABCFCC" stroke-width="3" stroke-dasharray="3 7"/><path d="M380.0,124.0 Q485.7,151.7 556.5,212.4" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M556.5,212.4 Q546.2,289.2 489.1,355.6" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M489.1,355.6 Q380.0,379.6 270.9,355.6" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M270.9,355.6 Q213.8,289.2 203.5,212.4" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><path d="M203.5,212.4 Q274.3,151.7 380.0,124.0" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#fa)" opacity=".75"/><rect x="301.4" y="81.0" width="157.2" height="86.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="380.0" y="103.6" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Obtener ingresos:</tspan><tspan x="380.0" dy="16.6">cuotas,</tspan><tspan x="380.0" dy="16.6">donaciones,</tspan><tspan x="380.0" dy="16.6">servicios</tspan></text><circle cx="303.4" cy="83.0" r="10" fill="#0F766E"/><text x="303.4" y="87.0" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">1</text><rect x="481.7" y="186.4" width="149.6" height="52.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="556.5" y="208.7" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="556.5" dy="0.0">Financiar el fin</tspan><tspan x="556.5" dy="16.6">y la operación</tspan></text><circle cx="483.7160894243804" cy="188.44582472000673" r="10" fill="#0F766E"/><text x="483.7160894243804" y="192.44582472000673" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">2</text><rect x="425.7" y="321.1" width="126.8" height="69.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="489.1" y="343.5" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="489.1" dy="0.0">Medir el</tspan><tspan x="489.1" dy="16.6">excedente del</tspan><tspan x="489.1" dy="16.6">período</tspan></text><circle cx="427.69294282548304" cy="323.0541752799933" r="10" fill="#0F766E"/><text x="427.69294282548304" y="327.0541752799933" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">3</text><rect x="199.9" y="329.6" width="142.0" height="52.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="270.9" y="351.8" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="270.9" dy="0.0">Reinvertirlo en</tspan><tspan x="270.9" dy="16.6">el fin</tspan></text><circle cx="201.90705717451704" cy="331.5541752799933" r="10" fill="#0F766E"/><text x="201.90705717451704" y="335.5541752799933" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">4</text><rect x="128.7" y="177.9" width="149.6" height="69.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="203.5" y="200.4" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="203.5" dy="0.0">Rendir cuentas a</tspan><tspan x="203.5" dy="16.6">la asamblea y al</tspan><tspan x="203.5" dy="16.6">Ministerio</tspan></text><circle cx="130.6839105756195" cy="179.94582472000675" r="10" fill="#0F766E"/><text x="130.6839105756195" y="183.94582472000675" font-size="11" text-anchor="middle" fill="#FFF" font-weight="700">5</text><text x="380.0" y="239.0" font-size="14" text-anchor="middle" fill="#0F766E" font-weight="700"><tspan x="380.0" dy="0.0">Sin reparto de</tspan><tspan x="380.0" dy="17.9">utilidades (art.</tspan><tspan x="380.0" dy="17.9">556)</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">12</text></svg>

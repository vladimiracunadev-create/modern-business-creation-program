<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuándo elegir EIRL y cuándo otra forma</title><desc id="d">Matriz que cruza la cantidad de dueños con la probabilidad de captar inversión para sugerir EIRL, SpA, sociedad limitada o persona natural.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuándo elegir EIRL y cuándo otra forma</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 02 · Empresa Individual de Responsabilidad Limitada (EIRL)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="150.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#D1E5DA" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">Separar y crecer</tspan></text><text x="164.0" y="148.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">SpA: flexible para socios e</tspan><tspan x="164.0" dy="15.4">inversión.</tspan></text><rect x="410.0" y="96.0" width="260.0" height="145.0" rx="6" fill="#EAF3EE" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="124.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">Separar sin socios</tspan></text><text x="424.0" y="148.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">EIRL: simple y con patrimonio</tspan><tspan x="424.0" dy="15.4">propio.</tspan></text><rect x="150.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#EEF0F3" stroke="#FFFFFF" stroke-width="3"/><text x="164.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="164.0" dy="0.0">Sin socios ni riesgo</tspan></text><text x="164.0" y="293.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="164.0" dy="0.0">Persona natural con giro puede</tspan><tspan x="164.0" dy="15.4">bastar.</tspan></text><rect x="410.0" y="241.0" width="260.0" height="145.0" rx="6" fill="#FDEED3" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="269.0" font-size="15" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="424.0" dy="0.0">Socios sin gran riesgo</tspan></text><text x="424.0" y="293.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="424.0" dy="0.0">Sociedad limitada con pacto claro.</tspan></text><line x1="140.0" y1="396.0" x2="676.0" y2="396.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><line x1="140.0" y1="396.0" x2="140.0" y2="92.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#fl)"/><text x="410.0" y="420.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="410.0" dy="0.0">Probabilidad de socios o inversión en dos años</tspan></text><g transform="translate(88 241.0) rotate(-90)"><text x="0.0" y="0.0" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="0.0" dy="0.0">Necesidad de separar tu patrimonio del negocio</tspan></text></g><text x="150.0" y="420.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="150.0" dy="0.0">bajo</tspan></text><text x="670.0" y="420.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="670.0" dy="0.0">alto</tspan></text><circle cx="254.0" cy="168.5" r="9" fill="#2E8B57" stroke="#FFFFFF" stroke-width="3"/><text x="270.0" y="173.5" font-size="13" text-anchor="start" fill="#2E8B57" font-weight="700"><tspan x="270.0" dy="0.0">EIRL</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">2</text></svg>

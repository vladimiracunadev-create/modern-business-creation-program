<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Quién vigila a una sociedad abierta</title><desc id="d">Mapa con la sociedad abierta al centro y alrededor la CMF, la junta de accionistas, el comité de directores, los auditores externos y las bolsas de valores.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Quién vigila a una sociedad abierta</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 08 · Sociedad Anónima Abierta (mercado de valores, CMF)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="380.0" y1="262.0" x2="380.0" y2="130.0" stroke="#C4A6F7" stroke-width="2"/><line x1="380.0" y1="262.0" x2="622.5" y2="221.2" stroke="#C4A6F7" stroke-width="2"/><line x1="380.0" y1="262.0" x2="529.9" y2="368.8" stroke="#C4A6F7" stroke-width="2"/><line x1="380.0" y1="262.0" x2="230.1" y2="368.8" stroke="#C4A6F7" stroke-width="2"/><line x1="380.0" y1="262.0" x2="137.5" y2="221.2" stroke="#C4A6F7" stroke-width="2"/><ellipse cx="380" cy="262" rx="78" ry="46" fill="#7C3AED"/><text x="380.0" y="249.0" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">Sociedad</tspan><tspan x="380.0" dy="17.9">anónima</tspan><tspan x="380.0" dy="17.9">abierta</tspan></text><rect x="292.0" y="96.0" width="176.0" height="68.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><text x="380.0" y="115.0" font-size="13.5" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="380.0" dy="0.0">CMF</tspan></text><text x="380.0" y="131.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">Fiscaliza y puede</tspan><tspan x="380.0" dy="14.7">suspender juntas</tspan><tspan x="380.0" dy="14.7">ilegales</tspan></text><rect x="531.9" y="194.2" width="181.2" height="54.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><text x="622.5" y="213.2" font-size="13.5" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="622.5" dy="0.0">Junta de accionistas</tspan></text><text x="622.5" y="229.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="622.5" dy="0.0">Aprueba memoria, balance</tspan><tspan x="622.5" dy="14.7">y dividendos</tspan></text><rect x="439.3" y="334.8" width="181.2" height="68.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><text x="529.9" y="353.8" font-size="13.5" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="529.9" dy="0.0">Comité de directores</tspan></text><text x="529.9" y="369.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="529.9" dy="0.0">Revisa partes</tspan><tspan x="529.9" dy="14.7">relacionadas y auditoría</tspan><tspan x="529.9" dy="14.7">(si supera el umbral)</tspan></text><rect x="142.1" y="341.8" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><text x="230.1" y="360.8" font-size="13.5" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="230.1" dy="0.0">Auditores externos</tspan></text><text x="230.1" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="230.1" dy="0.0">Opinan sobre los estados</tspan><tspan x="230.1" dy="14.7">financieros</tspan></text><rect x="49.5" y="187.2" width="176.0" height="68.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><text x="137.5" y="206.2" font-size="13.5" text-anchor="middle" fill="#7C3AED" font-weight="800"><tspan x="137.5" dy="0.0">Bolsas de valores</tspan></text><text x="137.5" y="222.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="137.5" dy="0.0">Reciben informes de</tspan><tspan x="137.5" dy="14.7">operaciones de</tspan><tspan x="137.5" dy="14.7">directores</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">8</text></svg>

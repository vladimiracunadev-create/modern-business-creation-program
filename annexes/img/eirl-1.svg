<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">De la Ley 19.857 al Registro en línea</title><desc id="d">Línea de tiempo de la EIRL: 2003 la Ley 19.857 crea la empresa individual, 2013 la Ley 20.659 permite constituirla en línea y 2026 nuevas tasas tributarias de Primera Categoría.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#2E8B57"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">De la Ley 19.857 al Registro en línea</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 02 · Empresa Individual de Responsabilidad Limitada (EIRL)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#2E8B57" stroke-width="4"/><circle cx="110.0" cy="244" r="13" fill="#2E8B57" stroke="#2E8B57" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="136.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="110.0" dy="0.0">2003</tspan></text><text x="110.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">Ley 19.857: una persona</tspan><tspan x="110.0" dy="16.0">natural puede crear una</tspan><tspan x="110.0" dy="16.0">EIRL</tspan></text><circle cx="290.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="290.0" y1="258.0" x2="290.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="290.0" y="312.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="290.0" dy="0.0">2013</tspan></text><text x="290.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="290.0" dy="0.0">Ley 20.659:</tspan><tspan x="290.0" dy="16.0">constitución en línea</tspan></text><circle cx="470.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="470.0" y1="230.0" x2="470.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="470.0" y="136.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="470.0" dy="0.0">2020</tspan></text><text x="470.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="470.0" dy="0.0">Ley 21.210:</tspan><tspan x="470.0" dy="16.0">modernización</tspan><tspan x="470.0" dy="16.0">tributaria</tspan></text><circle cx="650.0" cy="244" r="9" fill="#FFFFFF" stroke="#2E8B57" stroke-width="3"/><line x1="650.0" y1="258.0" x2="650.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="312.0" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="800"><tspan x="650.0" dy="0.0">2026</tspan></text><text x="650.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="650.0" dy="0.0">Ley 21.850: nuevo</tspan><tspan x="650.0" dy="16.0">calendario de tasas</tspan></text><text x="380.0" y="420.0" font-size="12" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">La EIRL resolvió el problema de limitar la responsabilidad sin necesitar un segundo socio.</tspan></text><circle cx="720" cy="40" r="14" fill="#E6F1EB" stroke="#B6D6C4"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">2</text></svg>

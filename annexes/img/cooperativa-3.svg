<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Del remanente al excedente: en qué orden se usa</title><desc id="d">Embudo con cuatro etapas del uso del remanente de una cooperativa: absorber pérdidas, reserva legal del dieciocho por ciento, reservas voluntarias e intereses, y excedente a repartir entre socios.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#C2410C"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Del remanente al excedente: en qué orden se usa</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 09 · Cooperativa</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="100.0" width="520.0" height="52.0" rx="8" fill="#F0D0C2"/><text x="300.0" y="131.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Remanente del ejercicio</tspan></text><text x="596.0" y="131.0" font-size="14" text-anchor="start" fill="#C2410C" font-weight="700"><tspan x="596.0" dy="0.0">$10.000.000</tspan></text><rect x="66.2" y="160.0" width="467.5" height="52.0" rx="8" fill="#E4AA92"/><text x="300.0" y="191.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Tras absorber pérdidas acumuladas</tspan></text><text x="596.0" y="186.0" font-size="14" text-anchor="start" fill="#C2410C" font-weight="700"><tspan x="596.0" dy="0.0">$8.500.000</tspan></text><text x="596.0" y="207.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 85 %</tspan></text><rect x="97.8" y="220.0" width="404.5" height="52.0" rx="8" fill="#D78461"/><text x="300.0" y="251.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Tras reserva legal (18 % del remanente)</tspan></text><text x="596.0" y="246.0" font-size="14" text-anchor="start" fill="#C2410C" font-weight="700"><tspan x="596.0" dy="0.0">$6.700.000</tspan></text><text x="596.0" y="267.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 79 %</tspan></text><rect x="145.0" y="280.0" width="310.0" height="52.0" rx="8" fill="#CB5E30"/><text x="300.0" y="311.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">Excedente a repartir (ejemplo)</tspan></text><text x="596.0" y="306.0" font-size="14" text-anchor="start" fill="#C2410C" font-weight="700"><tspan x="596.0" dy="0.0">$4.000.000</tspan></text><text x="596.0" y="327.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 60 %</tspan></text><rect x="30" y="276" width="720" height="60" rx="12" fill="none" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="6 4"/><text x="742.0" y="272.0" font-size="11" text-anchor="end" fill="#DC2626" font-weight="700"><tspan x="742.0" dy="0.0">cuello</tspan></text><circle cx="720" cy="40" r="14" fill="#F8E8E2" stroke="#EABCAA"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#C2410C" font-weight="700">9</text></svg>

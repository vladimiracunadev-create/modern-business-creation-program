<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">¿Fundación, cooperativa o sociedad?</title><desc id="d">Árbol de decisión: si se quiere repartir resultados se elige una sociedad o cooperativa según el reparto sea por capital o por uso, y si no se quiere repartir se elige asociación o fundación.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">¿Fundación, cooperativa o sociedad?</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 12 · Corporaciones, asociaciones y fundaciones</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="41.0" y="336.0" width="160.5" height="52.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="121.2" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="121.2" dy="0.0">Cooperativa (Anexo</tspan><tspan x="121.2" dy="16.0">09)</tspan></text><rect x="213.5" y="336.0" width="160.5" height="68.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="293.8" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="293.8" dy="0.0">Sociedad: SpA o</tspan><tspan x="293.8" dy="16.0">limitada (Anexos 06 y</tspan><tspan x="293.8" dy="16.0">03)</tspan></text><line x1="207.5" y1="290.0" x2="121.2" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="152.4" y="311.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="152.4" dy="0.0">sí</tspan></text><line x1="207.5" y1="290.0" x2="293.8" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="262.6" y="311.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="262.6" dy="0.0">no</tspan></text><path d="M114.0,224 h187.0 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-187.0 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.2"/><text x="207.5" y="244.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="207.5" dy="0.0">¿El reparto será según el</tspan><tspan x="207.5" dy="16.6">uso que hagan de la</tspan><tspan x="207.5" dy="16.6">organización?</tspan></text><rect x="386.0" y="336.0" width="160.5" height="52.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="466.2" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="466.2" dy="0.0">Asociación o</tspan><tspan x="466.2" dy="16.0">corporación</tspan></text><rect x="558.5" y="336.0" width="160.5" height="36.0" rx="10" fill="#D9E9E8" stroke="#0F766E" stroke-width="1.6"/><text x="638.8" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="638.8" dy="0.0">Fundación</tspan></text><line x1="552.5" y1="290.0" x2="466.2" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="497.4" y="311.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="497.4" dy="0.0">sí</tspan></text><line x1="552.5" y1="290.0" x2="638.8" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="607.6" y="311.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="607.6" dy="0.0">no</tspan></text><path d="M455.3,224 h194.4 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-194.4 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.2"/><text x="552.5" y="244.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="552.5" dy="0.0">¿Nace de personas reunidas</tspan><tspan x="552.5" dy="16.6">o de bienes afectos a un</tspan><tspan x="552.5" dy="16.6">fin?</tspan></text><line x1="380.0" y1="178.0" x2="207.5" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="281.8" y="199.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="281.8" dy="0.0">sí</tspan></text><line x1="380.0" y1="178.0" x2="552.5" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="478.2" y="199.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="478.2" dy="0.0">no</tspan></text><path d="M301.3,112 h157.4 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-157.4 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.2"/><text x="380.0" y="132.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="380.0" dy="0.0">¿Los miembros quieren</tspan><tspan x="380.0" dy="16.6">recibir parte de los</tspan><tspan x="380.0" dy="16.6">resultados?</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">12</text></svg>

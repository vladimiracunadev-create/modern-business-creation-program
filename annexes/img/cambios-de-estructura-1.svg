<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Qué cambio de estructura necesitas</title><desc id="d">Árbol de decisión que distingue entre cambiar solo los estatutos, cambiar el tipo social, unir o separar sociedades, vender y terminar.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#B45309"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Qué cambio de estructura necesitas</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 20 · Cambios de estructura: modificar, transformar, fusionar, dividir, vender y cerrar una empresa</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="41.0" y="336.0" width="160.5" height="84.0" rx="10" fill="#F3E3D8" stroke="#B45309" stroke-width="1.6"/><text x="121.2" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="121.2" dy="0.0">Modificación del</tspan><tspan x="121.2" dy="16.0">estatuto, con la</tspan><tspan x="121.2" dy="16.0">forma legal del tipo</tspan><tspan x="121.2" dy="16.0">social</tspan></text><rect x="213.5" y="336.0" width="160.5" height="68.0" rx="10" fill="#F3E3D8" stroke="#B45309" stroke-width="1.6"/><text x="293.8" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="293.8" dy="0.0">Transformación a otro</tspan><tspan x="293.8" dy="16.0">tipo social, con</tspan><tspan x="293.8" dy="16.0">análisis tributario</tspan></text><line x1="207.5" y1="290.0" x2="121.2" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="152.4" y="311.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="152.4" dy="0.0">sí</tspan></text><line x1="207.5" y1="290.0" x2="293.8" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="262.6" y="311.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="262.6" dy="0.0">no</tspan></text><path d="M114.0,224 h187.0 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-187.0 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#B45309" stroke-width="2.2"/><text x="207.5" y="244.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="207.5" dy="0.0">¿Cambia solo alguna</tspan><tspan x="207.5" dy="16.6">cláusula (nombre, objeto,</tspan><tspan x="207.5" dy="16.6">capital, administración)?</tspan></text><rect x="386.0" y="336.0" width="160.5" height="68.0" rx="10" fill="#F3E3D8" stroke="#B45309" stroke-width="1.6"/><text x="466.2" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="466.2" dy="0.0">Fusión (por creación</tspan><tspan x="466.2" dy="16.0">o incorporación) o</tspan><tspan x="466.2" dy="16.0">división</tspan></text><rect x="558.5" y="336.0" width="160.5" height="68.0" rx="10" fill="#F3E3D8" stroke="#B45309" stroke-width="1.6"/><text x="638.8" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="638.8" dy="0.0">Venta de acciones o</tspan><tspan x="638.8" dy="16.0">de activos, o término</tspan><tspan x="638.8" dy="16.0">de giro y disolución</tspan></text><line x1="552.5" y1="274.0" x2="466.2" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="497.4" y="303.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="497.4" dy="0.0">sí</tspan></text><line x1="552.5" y1="274.0" x2="638.8" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="607.6" y="303.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="607.6" dy="0.0">no</tspan></text><path d="M466.4,224 h172.20000000000002 a14,14 0 0 1 14,14 v22 a14,14 0 0 1 -14,14 h-172.20000000000002 a14,14 0 0 1 -14,-14 v-22 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#B45309" stroke-width="2.2"/><text x="552.5" y="245.2" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="552.5" dy="0.0">¿Quieres unir o separar</tspan><tspan x="552.5" dy="16.6">sociedades?</tspan></text><line x1="380.0" y1="194.0" x2="207.5" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="281.8" y="207.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="281.8" dy="0.0">sí</tspan></text><line x1="380.0" y1="194.0" x2="552.5" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="478.2" y="207.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="478.2" dy="0.0">no</tspan></text><path d="M282.8,112 h194.4 a14,14 0 0 1 14,14 v54 a14,14 0 0 1 -14,14 h-194.4 a14,14 0 0 1 -14,-14 v-54 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#B45309" stroke-width="2.2"/><text x="380.0" y="132.6" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="380.0" dy="0.0">¿Quieres mantener la misma</tspan><tspan x="380.0" dy="16.6">sociedad con otro</tspan><tspan x="380.0" dy="16.6">contenido o con otro tipo</tspan><tspan x="380.0" dy="16.6">social?</tspan></text><circle cx="720" cy="40" r="14" fill="#F6EAE1" stroke="#E5C3A9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#B45309" font-weight="700">20</text></svg>

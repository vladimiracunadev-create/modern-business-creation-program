<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cuánto dividendo mínimo rige por defecto</title><desc id="d">Semáforo sobre el dividendo mínimo: verde si el estatuto lo fija, amarillo si calla y rige el treinta por ciento, rojo si se quiere retener todo sin acuerdo unánime.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cuánto dividendo mínimo rige por defecto</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 07 · Sociedad Anónima Cerrada (S.A.)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><text x="40.0" y="104.0" font-size="13" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="40.0" dy="0.0">Qué dice el estatuto sobre la política de dividendos</tspan></text><rect x="40.0" y="118.0" width="680.0" height="82.0" rx="14" fill="#ECFDF3" stroke="#16A34A" stroke-width="2"/><circle cx="86" cy="159" r="22" fill="#16A34A"/><text x="130.0" y="132.0" font-size="15.5" text-anchor="start" fill="#1F2937" font-weight="800"><tspan x="130.0" dy="0.0">El estatuto fija un</tspan><tspan x="130.0" dy="19.8">porcentaje y su</tspan><tspan x="130.0" dy="19.8">excepción</tspan></text><text x="130.0" y="180.0" font-size="11" text-anchor="start" fill="#16A34A" font-weight="800"><tspan x="130.0" dy="0.0">VERDE</tspan></text><text x="430.0" y="148.0" font-size="13.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="430.0" dy="0.0">Política clara: documenta los acuerdos</tspan><tspan x="430.0" dy="17.3">anuales.</tspan></text><rect x="40.0" y="212.0" width="680.0" height="82.0" rx="14" fill="#FEF6E3" stroke="#F59E0B" stroke-width="2"/><circle cx="86" cy="253" r="22" fill="#F59E0B"/><text x="130.0" y="244.0" font-size="15.5" text-anchor="start" fill="#1F2937" font-weight="800"><tspan x="130.0" dy="0.0">El estatuto calla</tspan></text><text x="130.0" y="274.0" font-size="11" text-anchor="start" fill="#F59E0B" font-weight="800"><tspan x="130.0" dy="0.0">AMARILLO</tspan></text><text x="430.0" y="242.0" font-size="13.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="430.0" dy="0.0">Rige el mínimo supletorio del 30 % de</tspan><tspan x="430.0" dy="17.3">las utilidades líquidas (art. 79).</tspan></text><rect x="40.0" y="306.0" width="680.0" height="82.0" rx="14" fill="#FDECEC" stroke="#DC2626" stroke-width="2"/><circle cx="86" cy="347" r="22" fill="#DC2626"/><text x="130.0" y="329.0" font-size="15.5" text-anchor="start" fill="#1F2937" font-weight="800"><tspan x="130.0" dy="0.0">Se quiere retener todo</tspan><tspan x="130.0" dy="19.8">sin acuerdo unánime</tspan></text><text x="130.0" y="368.0" font-size="11" text-anchor="start" fill="#DC2626" font-weight="800"><tspan x="130.0" dy="0.0">ROJO</tspan></text><text x="430.0" y="328.0" font-size="13.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="430.0" dy="0.0">Riesgo de reclamo de accionistas:</tspan><tspan x="430.0" dy="17.3">escribe la política o acuerda por</tspan><tspan x="430.0" dy="17.3">unanimidad.</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">7</text></svg>

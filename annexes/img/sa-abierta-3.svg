<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Las tres exigencias de transparencia de una abierta</title><desc id="d">Diagrama de Venn con tres círculos: información continua a la CMF, gobierno corporativo y trato de partes relacionadas, que se cruzan en una abierta bien gobernada.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Las tres exigencias de transparencia de una abierta</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 08 · Sociedad Anónima Abierta (mercado de valores, CMF)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><circle cx="328" cy="198" r="92" fill="#7C3AED" fill-opacity=".22" stroke="#7C3AED" stroke-width="2.4"/><circle cx="432" cy="198" r="92" fill="#F59E0B" fill-opacity=".22" stroke="#F59E0B" stroke-width="2.4"/><circle cx="380" cy="276" r="92" fill="#0EA5E9" fill-opacity=".22" stroke="#0EA5E9" stroke-width="2.4"/><text x="222.0" y="128.0" font-size="15" text-anchor="end" fill="#7C3AED" font-weight="800"><tspan x="222.0" dy="0.0">Información veraz,</tspan><tspan x="222.0" dy="19.2">suficiente y</tspan><tspan x="222.0" dy="19.2">oportuna</tspan></text><text x="538.0" y="128.0" font-size="15" text-anchor="start" fill="#B45309" font-weight="800"><tspan x="538.0" dy="0.0">Directorio,</tspan><tspan x="538.0" dy="19.2">independientes y</tspan><tspan x="538.0" dy="19.2">comité</tspan></text><text x="380.0" y="394.0" font-size="15" text-anchor="middle" fill="#0EA5E9" font-weight="800"><tspan x="380.0" dy="0.0">Partes</tspan><tspan x="380.0" dy="19.2">relacionadas e</tspan><tspan x="380.0" dy="19.2">información</tspan><tspan x="380.0" dy="19.2">privilegiada</tspan></text><text x="380.0" y="212.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="380.0" dy="0.0">Abierta</tspan><tspan x="380.0" dy="16.0">bien</tspan><tspan x="380.0" dy="16.0">gobernada</tspan></text><text x="724.0" y="410.0" font-size="11.5" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="724.0" dy="0.0">Sin las tres, el mercado pierde</tspan><tspan x="724.0" dy="14.7">confianza y la sociedad se expone a</tspan><tspan x="724.0" dy="14.7">sanciones.</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">8</text></svg>

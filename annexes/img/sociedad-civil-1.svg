<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">La sociedad civil en el derecho chileno</title><desc id="d">Línea de tiempo: Código Civil con el título de la sociedad, 1923 Ley 3.918 permite sociedades civiles con responsabilidad limitada, 2000 texto refundido del Código Civil y 2013 Ley 20.659 que lista solo tipos comerciales.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">La sociedad civil en el derecho chileno</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 11 · Sociedad Civil (Código Civil)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="50.0" y1="244.0" x2="710.0" y2="244.0" stroke="#0F766E" stroke-width="4"/><circle cx="110.0" cy="244" r="13" fill="#0F766E" stroke="#0F766E" stroke-width="3"/><line x1="110.0" y1="230.0" x2="110.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="110.0" y="152.0" font-size="15" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="110.0" dy="0.0">Siglo XIX</tspan></text><text x="110.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="110.0" dy="0.0">Código Civil regula el</tspan><tspan x="110.0" dy="16.0">contrato de sociedad</tspan></text><circle cx="290.0" cy="244" r="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/><line x1="290.0" y1="258.0" x2="290.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="290.0" y="312.0" font-size="15" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="290.0" dy="0.0">1923</tspan></text><text x="290.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="290.0" dy="0.0">Ley 3.918: civiles y</tspan><tspan x="290.0" dy="16.0">comerciales pueden</tspan><tspan x="290.0" dy="16.0">limitar la</tspan><tspan x="290.0" dy="16.0">responsabilidad</tspan></text><circle cx="470.0" cy="244" r="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/><line x1="470.0" y1="230.0" x2="470.0" y2="198.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="470.0" y="152.0" font-size="15" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="470.0" dy="0.0">2000</tspan></text><text x="470.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="470.0" dy="0.0">DFL 1: texto refundido</tspan><tspan x="470.0" dy="16.0">del Código Civil</tspan></text><circle cx="650.0" cy="244" r="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/><line x1="650.0" y1="258.0" x2="650.0" y2="290.0" stroke="#CBD5E1" stroke-width="1.5"/><text x="650.0" y="312.0" font-size="15" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="650.0" dy="0.0">2013</tspan></text><text x="650.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="650.0" dy="0.0">Ley 20.659 lista tipos</tspan><tspan x="650.0" dy="16.0">comerciales</tspan></text><text x="380.0" y="420.0" font-size="12" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">Es el tipo base del contrato de sociedad: civil, comercial o mixta.</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">11</text></svg>

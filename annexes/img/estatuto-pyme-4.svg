<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Quién apoya y quién fiscaliza a una pyme</title><desc id="d">Mapa con la empresa de menor tamaño al centro y alrededor el Ministerio de Economía, el Consejo Consultivo, la municipalidad, la autoridad sanitaria y la Dirección del Trabajo.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Quién apoya y quién fiscaliza a una pyme</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 13 · Estatuto Pyme: empresas de menor tamaño (Ley 20.416)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="380.0" y1="262.0" x2="380.0" y2="130.0" stroke="#93C1BE" stroke-width="2"/><line x1="380.0" y1="262.0" x2="622.5" y2="221.2" stroke="#93C1BE" stroke-width="2"/><line x1="380.0" y1="262.0" x2="529.9" y2="368.8" stroke="#93C1BE" stroke-width="2"/><line x1="380.0" y1="262.0" x2="230.1" y2="368.8" stroke="#93C1BE" stroke-width="2"/><line x1="380.0" y1="262.0" x2="137.5" y2="221.2" stroke="#93C1BE" stroke-width="2"/><ellipse cx="380" cy="262" rx="78" ry="46" fill="#0F766E"/><text x="380.0" y="257.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="380.0" dy="0.0">Empresa de</tspan><tspan x="380.0" dy="17.9">menor tamaño</tspan></text><rect x="291.1" y="103.0" width="177.8" height="54.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="380.0" y="122.0" font-size="12" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="380.0" dy="0.0">Ministerio de Economía</tspan></text><text x="380.0" y="138.0" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="380.0" dy="0.0">División de Empresas de</tspan><tspan x="380.0" dy="14.7">Menor Tamaño y fomento</tspan></text><rect x="534.5" y="187.2" width="176.0" height="68.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="622.5" y="206.2" font-size="13.5" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="622.5" dy="0.0">Consejo Consultivo</tspan></text><text x="622.5" y="222.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="622.5" dy="0.0">Asesora políticas y</tspan><tspan x="622.5" dy="14.7">sesiona al menos 4 veces</tspan><tspan x="622.5" dy="14.7">al año</tspan></text><rect x="441.9" y="341.8" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="529.9" y="360.8" font-size="13.5" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="529.9" dy="0.0">Municipalidad</tspan></text><text x="529.9" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="529.9" dy="0.0">Patente provisoria con</tspan><tspan x="529.9" dy="14.7">exención o cuotas</tspan></text><rect x="142.1" y="341.8" width="176.0" height="54.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="230.1" y="360.8" font-size="13.5" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="230.1" dy="0.0">Autoridad sanitaria</tspan></text><text x="230.1" y="376.8" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="230.1" dy="0.0">Declaración jurada y</tspan><tspan x="230.1" dy="14.7">declaración voluntaria</tspan></text><rect x="43.1" y="194.2" width="188.8" height="54.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/><text x="137.5" y="213.2" font-size="13.5" text-anchor="middle" fill="#0F766E" font-weight="800"><tspan x="137.5" dy="0.0">Dirección del Trabajo</tspan></text><text x="137.5" y="229.2" font-size="11.5" text-anchor="middle" fill="#6B7280" font-weight="400"><tspan x="137.5" dy="0.0">Multas graduadas,</tspan><tspan x="137.5" dy="14.7">sustitución y rebaja</tspan></text><circle cx="720" cy="40" r="14" fill="#E2EFEE" stroke="#ABCFCC"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#0F766E" font-weight="700">13</text></svg>

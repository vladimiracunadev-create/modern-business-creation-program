<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">El orden de los permisos para abrir un local</title><desc id="d">Escalera de cinco peldaños: verificar zonificación, autorización sanitaria, otros permisos especiales, verificación de la Dirección de Obras y patente municipal.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">El orden de los permisos para abrir un local</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 17 · Municipalidades: patente comercial, zonificación y permisos locales</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="126.0" height="120.0" rx="10" fill="#EBECEE"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#374151" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Zonificación</tspan></text><text x="54.0" y="356.0" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="54.0" dy="0.0">Uso de suelo según</tspan><tspan x="54.0" dy="15.4">el Plan Regulador,</tspan><tspan x="54.0" dy="15.4">antes de arrendar</tspan></text><rect x="174.0" y="237.5" width="126.0" height="162.5" rx="10" fill="#D2D4D8"/><text x="188.0" y="265.5" font-size="22" text-anchor="start" fill="#374151" font-weight="800"><tspan x="188.0" dy="0.0">2</tspan></text><text x="188.0" y="289.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="188.0" dy="0.0">Autorización</tspan><tspan x="188.0" dy="17.9">sanitaria</tspan></text><text x="188.0" y="331.5" font-size="12" text-anchor="start" fill="#4B5563" font-weight="400"><tspan x="188.0" dy="0.0">Acompañarla o</tspan><tspan x="188.0" dy="15.4">acreditar que se</tspan><tspan x="188.0" dy="15.4">solicitó</tspan></text><rect x="308.0" y="195.0" width="126.0" height="205.0" rx="10" fill="#B9BCC2"/><text x="322.0" y="223.0" font-size="22" text-anchor="start" fill="#374151" font-weight="800"><tspan x="322.0" dy="0.0">3</tspan></text><text x="322.0" y="247.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="322.0" dy="0.0">Permisos de</tspan><tspan x="322.0" dy="17.9">leyes</tspan><tspan x="322.0" dy="17.9">especiales</tspan></text><text x="322.0" y="307.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="322.0" dy="0.0">Según la actividad</tspan></text><rect x="442.0" y="152.5" width="126.0" height="247.5" rx="10" fill="#A0A5AC"/><text x="456.0" y="180.5" font-size="22" text-anchor="start" fill="#374151" font-weight="800"><tspan x="456.0" dy="0.0">4</tspan></text><text x="456.0" y="204.5" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="456.0" dy="0.0">Dirección de</tspan><tspan x="456.0" dy="17.9">Obras</tspan></text><text x="456.0" y="246.5" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="456.0" dy="0.0">Verifica</tspan><tspan x="456.0" dy="15.4">condiciones de</tspan><tspan x="456.0" dy="15.4">funcionamiento si</tspan><tspan x="456.0" dy="15.4">corresponde</tspan></text><rect x="576.0" y="110.0" width="126.0" height="290.0" rx="10" fill="#878D97"/><text x="590.0" y="138.0" font-size="22" text-anchor="start" fill="#374151" font-weight="800"><tspan x="590.0" dy="0.0">5</tspan></text><text x="590.0" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="590.0" dy="0.0">Patente</tspan><tspan x="590.0" dy="17.9">municipal</tspan></text><text x="590.0" y="204.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="590.0" dy="0.0">Declaración de</tspan><tspan x="590.0" dy="15.4">capital propio y</tspan><tspan x="590.0" dy="15.4">pago</tspan></text><line x1="48.0" y1="412.0" x2="720.0" y2="412.0" stroke="#374151" stroke-width="2.4" marker-end="url(#fl)"/><text x="716.0" y="430.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="716.0" dy="0.0">Cada peldaño habilita al siguiente</tspan></text><circle cx="720" cy="40" r="14" fill="#E7E8EA" stroke="#B9BCC2"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">17</text></svg>

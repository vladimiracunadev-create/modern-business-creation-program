<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Constituir una sociedad anónima cerrada</title><desc id="d">Flujo de cinco pasos: acordar estatuto y pacto, redactar la escritura con doce menciones, firmar, inscribir y publicar en sesenta días y constituir el directorio e iniciar actividades.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Constituir una sociedad anónima cerrada</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 07 · Sociedad Anónima Cerrada (S.A.)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="35.0" y="160.0" width="102.8" height="118.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><circle cx="51.0" cy="160" r="12" fill="#7C3AED"/><text x="51.0" y="164.5" font-size="12" text-anchor="middle" fill="#FFF" font-weight="800">1</text><text x="86.4" y="203.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="86.4" dy="0.0">Acordar</tspan><tspan x="86.4" dy="16.0">estatuto,</tspan><tspan x="86.4" dy="16.0">directorio y</tspan><tspan x="86.4" dy="16.0">dividendos</tspan></text><rect x="181.8" y="160.0" width="102.8" height="118.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><circle cx="197.8" cy="160" r="12" fill="#7C3AED"/><text x="197.8" y="164.5" font-size="12" text-anchor="middle" fill="#FFF" font-weight="800">2</text><text x="233.2" y="195.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="233.2" dy="0.0">Redactar la</tspan><tspan x="233.2" dy="16.0">escritura con</tspan><tspan x="233.2" dy="16.0">las 12</tspan><tspan x="233.2" dy="16.0">menciones del</tspan><tspan x="233.2" dy="16.0">art. 4</tspan></text><line x1="141.8" y1="219.0" x2="178.8" y2="219.0" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#fl)"/><rect x="328.6" y="160.0" width="102.8" height="118.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><circle cx="344.6" cy="160" r="12" fill="#7C3AED"/><text x="344.6" y="164.5" font-size="12" text-anchor="middle" fill="#FFF" font-weight="800">3</text><text x="380.0" y="211.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Firmar todos</tspan><tspan x="380.0" dy="16.0">los</tspan><tspan x="380.0" dy="16.0">accionistas</tspan></text><line x1="288.6" y1="219.0" x2="325.6" y2="219.0" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#fl)"/><rect x="475.4" y="160.0" width="102.8" height="118.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><circle cx="491.40000000000003" cy="160" r="12" fill="#7C3AED"/><text x="491.40000000000003" y="164.5" font-size="12" text-anchor="middle" fill="#FFF" font-weight="800">4</text><text x="526.8" y="195.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="526.8" dy="0.0">Inscribir y</tspan><tspan x="526.8" dy="16.0">publicar en 60</tspan><tspan x="526.8" dy="16.0">días, o</tspan><tspan x="526.8" dy="16.0">incorporar al</tspan><tspan x="526.8" dy="16.0">Registro</tspan></text><line x1="435.4" y1="219.0" x2="472.4" y2="219.0" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#fl)"/><rect x="622.2" y="160.0" width="102.8" height="118.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><circle cx="638.2" cy="160" r="12" fill="#7C3AED"/><text x="638.2" y="164.5" font-size="12" text-anchor="middle" fill="#FFF" font-weight="800">5</text><text x="673.6" y="203.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="673.6" dy="0.0">Directorio</tspan><tspan x="673.6" dy="16.0">provisorio e</tspan><tspan x="673.6" dy="16.0">inicio de</tspan><tspan x="673.6" dy="16.0">actividades</tspan></text><line x1="582.2" y1="219.0" x2="619.2" y2="219.0" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#fl)"/><path d="M673.6,278 v34 H86.4 v-34" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fl)"/><text x="380.0" y="340.0" font-size="12.5" text-anchor="middle" fill="#6B7280" font-weight="400" font-style="italic"><tspan x="380.0" dy="0.0">No se admite prueba contra el tenor de la escritura: lo que no está escrito no vale</tspan></text><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">7</text></svg>

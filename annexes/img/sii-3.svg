<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cómo se calcula el IVA del mes (ejemplo ilustrativo)</title><desc id="d">Embudo con el cálculo del IVA mensual: débito fiscal de un millón novecientos mil pesos, menos crédito fiscal de setecientos sesenta mil, igual a un millón ciento cuarenta mil de IVA a pagar.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#374151"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cómo se calcula el IVA del mes (ejemplo ilustrativo)</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 16 · Servicio de Impuestos Internos (SII): lo que una empresa debe saber</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="100.0" width="520.0" height="52.0" rx="8" fill="#CDD0D4"/><text x="300.0" y="131.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Ventas netas del mes</tspan></text><text x="596.0" y="131.0" font-size="14" text-anchor="start" fill="#374151" font-weight="700"><tspan x="596.0" dy="0.0">$10.000.000</tspan></text><rect x="92.5" y="160.0" width="415.0" height="52.0" rx="8" fill="#A5AAB1"/><text x="300.0" y="191.9" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Débito fiscal (19 %)</tspan></text><text x="596.0" y="186.0" font-size="14" text-anchor="start" fill="#374151" font-weight="700"><tspan x="596.0" dy="0.0">$1.900.000</tspan></text><text x="596.0" y="207.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 70 %</tspan></text><rect x="136.2" y="220.0" width="327.5" height="52.0" rx="8" fill="#7D848E"/><text x="300.0" y="243.2" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="300.0" dy="0.0">Menos crédito fiscal (compras con</tspan><tspan x="300.0" dy="16.6">factura registrada)</tspan></text><text x="596.0" y="246.0" font-size="14" text-anchor="start" fill="#374151" font-weight="700"><tspan x="596.0" dy="0.0">$760.000</tspan></text><text x="596.0" y="267.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 64 %</tspan></text><rect x="162.5" y="280.0" width="275.0" height="52.0" rx="8" fill="#555E6B"/><text x="300.0" y="311.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="700"><tspan x="300.0" dy="0.0">IVA a pagar</tspan></text><text x="596.0" y="306.0" font-size="14" text-anchor="start" fill="#374151" font-weight="700"><tspan x="596.0" dy="0.0">$1.140.000</tspan></text><text x="596.0" y="327.0" font-size="11" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="596.0" dy="0.0">pasa 67 %</tspan></text><rect x="30" y="276" width="720" height="60" rx="12" fill="none" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="6 4"/><text x="742.0" y="272.0" font-size="11" text-anchor="end" fill="#DC2626" font-weight="700"><tspan x="742.0" dy="0.0">cuello</tspan></text><circle cx="720" cy="40" r="14" fill="#E7E8EA" stroke="#B9BCC2"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">16</text></svg>

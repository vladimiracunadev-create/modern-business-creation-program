<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cómo se ordena el poder en una SpA</title><desc id="d">Cuatro capas: estatuto, series de acciones, administración y pacto de accionistas, de lo que fija la ley a lo que pactan los socios.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#7C3AED"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cómo se ordena el poder en una SpA</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 06 · Sociedad por Acciones (SpA)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="140.0" y="100.0" width="300.0" height="64.0" rx="10" fill="#E7DCFC"/><text x="290.0" y="137.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">Ley: arts. 424 a 446</tspan></text><text x="560.0" y="136.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Lo que no puedes cambiar</tspan></text><line x1="446.0" y1="132.0" x2="552.0" y2="132.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="106.7" y="170.0" width="366.7" height="64.0" rx="10" fill="#CCB3F8"/><text x="290.0" y="207.0" font-size="15" text-anchor="middle" fill="#1F2937" font-weight="800"><tspan x="290.0" dy="0.0">Estatuto</tspan></text><text x="560.0" y="199.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Lo que pactas y queda</tspan><tspan x="560.0" dy="16.0">inscrito</tspan></text><line x1="479.3" y1="202.0" x2="552.0" y2="202.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="73.3" y="240.0" width="433.3" height="64.0" rx="10" fill="#B18AF4"/><text x="290.0" y="277.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="290.0" dy="0.0">Series de acciones</tspan></text><text x="560.0" y="269.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Derechos económicos y</tspan><tspan x="560.0" dy="16.0">políticos distintos</tspan></text><line x1="512.7" y1="272.0" x2="552.0" y2="272.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="40.0" y="310.0" width="500.0" height="64.0" rx="10" fill="#9661F1"/><text x="290.0" y="347.0" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="800"><tspan x="290.0" dy="0.0">Pacto de accionistas</tspan></text><text x="560.0" y="339.0" font-size="12.5" text-anchor="start" fill="#1F2937" font-weight="400"><tspan x="560.0" dy="0.0">Reglas privadas de salida,</tspan><tspan x="560.0" dy="16.0">desempate y vesting</tspan></text><line x1="546.0" y1="342.0" x2="552.0" y2="342.0" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="720" cy="40" r="14" fill="#EFE7FD" stroke="#D1BAF9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#7C3AED" font-weight="700">6</text></svg>

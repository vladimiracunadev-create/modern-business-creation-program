<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Qué hacer ante un bloqueo entre socios</title><desc id="d">Árbol de decisión: si la conversación directa no resuelve, se pasa a mediación; si no, a arbitraje o a un mecanismo de salida pactado.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#B45309"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Qué hacer ante un bloqueo entre socios</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 19 · Pactos de socios y gobierno entre fundadores: qué acordar antes de que haya un conflicto</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="55.0" y="224.0" width="190.0" height="52.0" rx="10" fill="#F3E3D8" stroke="#B45309" stroke-width="1.6"/><text x="150.0" y="246.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="150.0" dy="0.0">Registrar el acuerdo por</tspan><tspan x="150.0" dy="16.0">escrito y seguir</tspan></text><rect x="285.0" y="336.0" width="190.0" height="52.0" rx="10" fill="#F3E3D8" stroke="#B45309" stroke-width="1.6"/><text x="380.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="380.0" dy="0.0">Formalizar el acuerdo y</tspan><tspan x="380.0" dy="16.0">actualizar el pacto</tspan></text><rect x="515.0" y="336.0" width="190.0" height="68.0" rx="10" fill="#F3E3D8" stroke="#B45309" stroke-width="1.6"/><text x="610.0" y="358.4" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600"><tspan x="610.0" dy="0.0">Arbitraje o mecanismo de</tspan><tspan x="610.0" dy="16.0">salida: comprar, vender o</tspan><tspan x="610.0" dy="16.0">subasta entre socios</tspan></text><line x1="495.0" y1="290.0" x2="380.0" y2="334.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="425.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="425.5" dy="0.0">sí</tspan></text><line x1="495.0" y1="290.0" x2="610.0" y2="334.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="564.5" y="311.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="564.5" dy="0.0">no</tspan></text><path d="M420.0,224 h150.0 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-150.0 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#B45309" stroke-width="2.2"/><text x="495.0" y="244.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="495.0" dy="0.0">¿La mediación con un</tspan><tspan x="495.0" dy="16.6">tercero acordado lo</tspan><tspan x="495.0" dy="16.6">resolvió?</tspan></text><line x1="322.5" y1="178.0" x2="150.0" y2="222.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#fl)"/><text x="224.2" y="199.0" font-size="12.5" text-anchor="middle" fill="#16A34A" font-weight="800"><tspan x="224.2" dy="0.0">sí</tspan></text><line x1="322.5" y1="178.0" x2="495.0" y2="222.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#fl)"/><text x="420.8" y="199.0" font-size="12.5" text-anchor="middle" fill="#DC2626" font-weight="800"><tspan x="420.8" dy="0.0">no</tspan></text><path d="M232.7,112 h179.60000000000002 a14,14 0 0 1 14,14 v38 a14,14 0 0 1 -14,14 h-179.60000000000002 a14,14 0 0 1 -14,-14 v-38 a14,14 0 0 1 14,-14z" fill="#FFFFFF" stroke="#B45309" stroke-width="2.2"/><text x="322.5" y="132.9" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="700"><tspan x="322.5" dy="0.0">¿La conversación directa</tspan><tspan x="322.5" dy="16.6">con plazo corto resolvió</tspan><tspan x="322.5" dy="16.6">el bloqueo?</tspan></text><circle cx="720" cy="40" r="14" fill="#F6EAE1" stroke="#E5C3A9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#B45309" font-weight="700">19</text></svg>

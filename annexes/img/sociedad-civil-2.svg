<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">De acordar a operar una sociedad civil</title><desc id="d">Escalera de cuatro peldaños: acordar aportes y reparto, escribir el contrato con administración y salida, obtener RUT e iniciar actividades y llevar contabilidad y documentos.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#0F766E"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">De acordar a operar una sociedad civil</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 11 · Sociedad Civil (Código Civil)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><rect x="40.0" y="280.0" width="159.5" height="120.0" rx="10" fill="#E7F1F0"/><text x="54.0" y="308.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="54.0" dy="0.0">1</tspan></text><text x="54.0" y="332.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="54.0" dy="0.0">Acordar aportes y</tspan><tspan x="54.0" dy="17.9">reparto</tspan></text><text x="54.0" y="374.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="54.0" dy="0.0">Qué pone cada uno y</tspan><tspan x="54.0" dy="15.4">cómo se divide</tspan></text><rect x="207.5" y="223.3" width="159.5" height="176.7" rx="10" fill="#BFDAD8"/><text x="221.5" y="251.3" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="221.5" dy="0.0">2</tspan></text><text x="221.5" y="275.3" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="221.5" dy="0.0">Escribir el</tspan><tspan x="221.5" dy="17.9">contrato</tspan></text><text x="221.5" y="317.3" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="221.5" dy="0.0">Administración,</tspan><tspan x="221.5" dy="15.4">decisión y salida</tspan></text><rect x="375.0" y="166.7" width="159.5" height="233.3" rx="10" fill="#97C4C0"/><text x="389.0" y="194.7" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="389.0" dy="0.0">3</tspan></text><text x="389.0" y="218.7" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="389.0" dy="0.0">RUT e inicio de</tspan><tspan x="389.0" dy="17.9">actividades</tspan></text><text x="389.0" y="260.7" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="389.0" dy="0.0">Con el SII y permisos</tspan></text><rect x="542.5" y="110.0" width="159.5" height="290.0" rx="10" fill="#6FADA8"/><text x="556.5" y="138.0" font-size="22" text-anchor="start" fill="#0F766E" font-weight="800"><tspan x="556.5" dy="0.0">4</tspan></text><text x="556.5" y="162.0" font-size="14" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="556.5" dy="0.0">Contabilidad y</tspan><tspan x="556.5" dy="17.9">documentos</tspan></text><text x="556.5" y="204.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="556.5" dy="0.0">Según el régimen</tspan><tspan x="556.5" dy="15.4">elegido</tspan></text><line x1="48.0" y1="412.0" x2="720.0" y2="412.0" stroke="#0F766E" stroke-width="2.4" marker-end="url(#fl)"/><text x="716.0" y="430.0" font-size="11" text-anchor="end" fill="#6B7280" font-weight="400"><tspan x="716.0" dy="0.0">Cada peldaño reduce un conflicto futuro</tspan></text><ci
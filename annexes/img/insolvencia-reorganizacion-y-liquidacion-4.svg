<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cómo se reparte una liquidación entre las clases de acreedores</title><desc id="d">Barras de un ejemplo ilustrativo: de 40 millones, 22 van a créditos de primera clase y 18 al conjunto de acreedores valistas, que recuperan el 20 % de sus créditos.</desc><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><rect width="760" height="440" rx="16" fill="#FBFAF7" stroke="#CBD5E1"/><rect x="0" y="0" width="760" height="8" rx="4" fill="#B45309"/><text x="32.0" y="44.0" font-size="20" text-anchor="start" fill="#1F2937" font-weight="700"><tspan x="32.0" dy="0.0">Cómo se reparte una liquidación entre las clases de acreedores</tspan></text><text x="32.0" y="66.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="32.0" dy="0.0">Anexo 21 · Insolvencia: reorganización, liquidación y cómo actuar a tiempo (Ley 20.720)</tspan></text><line x1="32" y1="76" x2="728" y2="76" stroke="#CBD5E1"/><line x1="90.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1F2937" stroke-width="1.8"/><rect x="117.0" y="305.5" width="96.0" height="44.5" rx="8" fill="#E5C3A9"/><text x="165.0" y="295.5" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="165.0" dy="0.0">4 millones</tspan></text><text x="165.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="165.0" dy="0.0">Gastos del</tspan><tspan x="165.0" dy="16.0">procedimiento</tspan></text><rect x="267.0" y="216.6" width="96.0" height="133.4" rx="8" fill="#E5C3A9"/><text x="315.0" y="206.6" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="315.0" dy="0.0">12 millones</tspan></text><text x="315.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="315.0" dy="0.0">Remuneraciones y</tspan><tspan x="315.0" dy="16.0">cotizaciones</tspan></text><rect x="417.0" y="283.3" width="96.0" height="66.7" rx="8" fill="#E5C3A9"/><text x="465.0" y="273.3" font-size="14" text-anchor="middle" fill="#6B7280" font-weight="800"><tspan x="465.0" dy="0.0">6 millones</tspan></text><text x="465.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="465.0" dy="0.0">Impuestos de</tspan><tspan x="465.0" dy="16.0">retención</tspan></text><rect x="567.0" y="149.9" width="96.0" height="200.1" rx="8" fill="#B45309"/><text x="615.0" y="139.9" font-size="14" text-anchor="middle" fill="#B45309" font-weight="800"><tspan x="615.0" dy="0.0">18 millones</tspan></text><text x="615.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="400"><tspan x="615.0" dy="0.0">Acreedores valistas</tspan></text><rect x="40.0" y="384.0" width="680.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="56.0" y="404.0" font-size="12.5" text-anchor="start" fill="#6B7280" font-weight="400"><tspan x="56.0" dy="0.0">Los valistas, con 90 millones de créditos, recuperan 18 millones: el 20 %.</tspan></text><text x="82.0" y="100.0" font-size="12" text-anchor="start" fill="#6B7280" font-weight="700"><tspan x="82.0" dy="0.0">Reparto de 40 millones de pesos (ilustrativo)</tspan></text><circle cx="720" cy="40" r="14" fill="#F6EAE1" stroke="#E5C3A9"/><text x="720" y="45" font-size="13" text-anchor="middle" fill="#B45309" font-weight="700">21</text></svg>
